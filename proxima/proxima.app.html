// Eine Zeitueberschreitung heisst meist: die Anweisung war zu lang oder der
// Dienst ueberlastet. Ab dann kuerzer fragen, statt weiter aufzulaufen.
function pruefeZeitueberschreitung(e){
  var m=String((e&&e.message)||e);
  if(!/Timeout|Zeitüberschreitung|Zeitueberschreitung/i.test(m))return false;
  if(!S.kurzKontext){
    S.kurzKontext=true;
    sysZeile('⏱ Die KI hat nicht rechtzeitig geantwortet. Ab jetzt wird der Kontext kürzer gehalten — '+
             'mit /nochmal kannst du den Zug wiederholen.');
    autosave();
  }else{
    sysZeile('⏱ Wieder keine Antwort. Der Textdienst ist vermutlich überlastet — /nochmal versucht es erneut.');
  }
  return true;
}
// Leere Angaben kommen in vielen Verkleidungen zurueck.
function leerAngabe(t){
  return !t||/^(nein|kein|keine[rn]?|niemand|none|null|nichts|-|\u2014)$/i.test(String(t).trim());
}
function findeNpc(name){
  var n=String(name||'').toLowerCase().trim();
  if(!n)return -1;
  var erstes=n.split(/[\s,]+/)[0];
  var idx=-1;
  W.npcs.forEach(function(f,i){
    if(idx>=0)return;
    var fn=String(f.name||'').toLowerCase();
    if(!fn)return;
    if(fn===n||n.indexOf(fn)>=0||fn.split(/\s+/)[0]===erstes)idx=i;
  });
  return idx;
}
// Die Handlung entscheidet mit, wer am Ort ist: kuendigt sie jemanden an oder
// laesst jemanden gehen, zieht die Besetzung nach.
// "Ida: a red silk dress" - auch mehrere, mit Semikolon getrennt. Gilt fuer
// die Figuren wie fuer den Helden. Unveraenderte Angaben werden verworfen,
// damit nicht bei jedem Zug dasselbe Bild neu entsteht.
function kleidungAendern(eintrag){
  var geaendert=false;
  String(eintrag||'').split(/\s*;\s*/).forEach(function(teil){
    var m=teil.match(/^([^:]{1,48}):\s*([\s\S]+)$/);
    if(!m)return;
    var name=entkleide(m[1]), outfit=entkleide(m[2]);
    if(leerAngabe(outfit)||outfit.length<3)return;
    var pn=String(W.protagonist.name||'').toLowerCase().split(/\s+/)[0];
    if(pn&&name.toLowerCase().indexOf(pn)>=0){
      if(String(W.protagonist.kleidung||'').toLowerCase()===outfit.toLowerCase())return;
      W.protagonist.kleidung=outfit;
      sysZeile('✦ '+W.protagonist.name+' trägt jetzt: '+outfit+' ✦');
      geaendert=true;return;
    }
    var i=findeNpc(name);
    if(i<0)return;
    if(String(S.kleidung[i]||'').toLowerCase()===outfit.toLowerCase())return;
    S.kleidung[i]=outfit;
    W.npcs[i].kleidung=outfit;   // damit es auch im Figurenmenü steht
    sysZeile('✦ '+W.npcs[i].name+' trägt jetzt: '+outfit+' ✦');
    geaendert=true;
  });
  return geaendert;
}
// Reihenfolge: erst der Ort, dann wer bleibt und wer dazukommt. Sonst
// tritt die neue Person noch am alten Schauplatz auf.
async function folgeHandlung(res){
  if(!res)return;
  if(CFG.autoBesetzung&&!leerAngabe(res.ortaenderung))ortNotiz(res.ortaenderung);
  if(CFG.autoBesetzung&&!leerAngabe(res.ortwechsel)&&!S.ortLaeuft)await ortWechseln(res.ortwechsel);
  await besetzungAendern(res);
  // Ein Kleiderwechsel ist sichtbar - deshalb sofort neu zeichnen, nicht erst
  // beim naechsten Bildtakt.
  if(CFG.autoBesetzung&&!leerAngabe(res.kleidung)&&kleidungAendern(res.kleidung)){
    S.bildZaehler=0;
    autosave();
    zeichneBild({});
  }
}
async function besetzungAendern(res){
  if(!CFG.autoBesetzung||!res)return;
  if(!leerAngabe(res.abgang)){
    var i=findeNpc(res.abgang);
    if(i>=0&&W.npcs.length>1)entferneNPC(i);
  }
  if(!leerAngabe(res.auftritt)&&W.npcs.length<MAX_NPCS&&!S.npcErscheint){
    await erscheineNPC(res.auftritt,true);
  }
}

// ── SCHLAGABTAUSCH ────────────────────────────
async function fuehreSchlagabtausch(erzwungenerIdx){
  if(S.wartet&&erzwungenerIdx<0)return;
  setWartet(true);
  var cap=W.npcs.length>1?Math.min(MAX_ZUEGE,W.npcs.length):1;
  var erzwinge=(typeof erzwungenerIdx==='number')?erzwungenerIdx:-1;
  var zuege=0;
  while(zuege<cap){
    var res=null;
    try{ res=await naechsterZug(erzwinge); }
    catch(e){ if(!pruefeZeitueberschreitung(e))zeigeFehler('NPC-Zug',e); break; }
    erzwinge=-1;
    if(!res||res.stop)break;
    npcSagt(res.idx,res.text);
    S.verlauf.push({rolle:'npc',idx:res.idx,text:res.text,name:W.npcs[res.idx].name});
    if(res.stimmung){ S.stimmung[res.idx]=res.stimmung; zeigeStimmung(); }
    await folgeHandlung(res);
    zuege++;
    if(!res.weiter)break;
  }
  bildTakt();
  autosave();
  setWartet(false);
}
function bildTakt(){
  if(!CFG.bildTakt)return;
  S.bildZaehler=(S.bildZaehler||0)+1;
  if(S.bildZaehler<CFG.bildTakt)return;
  S.bildZaehler=0;
  if(S.bildPauseBis&&Date.now()<S.bildPauseBis)return;   // Dienst drosselt gerade
  if(S.eigenerPrompt){
    // Festgehalten: das Bild soll bewusst stehenbleiben, also gar nicht erst
    // dieselbe Anfrage noch einmal stellen.
    if(S.promptFesthalten)return;
    // Sonst hat die Handlung Vorrang: ab hier folgt das Bild wieder der Szene.
    S.eigenerPrompt='';S.eigenerNegativ='';
  }
  zeichneBild({});
}

// ── AUTO-MODUS ────────────────────────────────
function warte(ms){ return new Promise(function(r){setTimeout(r,ms);}); }
function autoUmschalten(){
  if(!S.imSpiel)return;
  S.autoAktiv=!S.autoAktiv;
  aktualisiereUI();
  if(S.autoAktiv){
    sysZeile('▶ Auto-Modus an — '+(CFG.autoHeld?(W.protagonist.name+' und die Figuren übernehmen'):'die Figuren übernehmen')+
             '. Deine Eingaben sind jetzt Regie (mit /sag: sprichst du selbst).');
    autoSchleife();
  }else{
    sysZeile('⏹ Auto-Modus aus.');
  }
}
async function autoSchleife(){
  if(S.autoLaeuft)return;
  S.autoLaeuft=true;
  var fehler=0;
  while(S.autoAktiv){
    var erzwinge=(S.autoForceIdx!=null)?S.autoForceIdx:-1;
    S.autoForceIdx=null;
    var res=null;
    try{
      res=await naechsterZug(erzwinge,true);
      fehler=0;
    }catch(e){
      // Nicht sofort aufgeben: kurze Pause, dann erneut. Erst nach drei
      // Fehlschlaegen abschalten – und dann auch sichtbar, nicht stumm.
      fehler++;
      if(!pruefeZeitueberschreitung(e))zeigeFehler('Auto-Zug',e);
      if(fehler>=3){
        S.autoAktiv=false;
        sysZeile('⏹ Auto-Modus nach mehreren Fehlern beendet.');
        break;
      }
      await warte(2000*fehler);
      continue;
    }
    if(!S.autoAktiv)break;
    if(res&&!res.stop){
      if(res.held){
        ichSage(res.text);
        S.verlauf.push({rolle:'ich',text:res.text});
      }else{
        npcSagt(res.idx,res.text);
        S.verlauf.push({rolle:'npc',idx:res.idx,text:res.text,name:W.npcs[res.idx].name});
        if(res.stimmung){ S.stimmung[res.idx]=res.stimmung; zeigeStimmung(); }
      }
      await folgeHandlung(res);
      bildTakt();
      autosave();
      await warte(Math.min(6000,900+String(res.text).length*Math.max(8,CFG.tempo)));
    }else{
      await warte(1500);
    }
  }
  S.autoLaeuft=false;
  aktualisiereUI();
}
function setzeAutoRegie(txt){
  S.autoRegie=txt;
  sysZeile('🎬 Stehende Regie: '+txt);
  autosave();
}

// ── BILD-PIPELINE ─────────────────────────────
// Der Prompt wird aus Bausteinen gebaut, damit beim Kuerzen nicht ausgerechnet
// das Ende verlorengeht: dort stehen Stil und Bildaufbau, und die bestimmen,
// wie das Bild ueberhaupt aussieht. Gekuerzt wird in der Mitte.
function bauePrompt(opts,max){
  var figurenArr=[];
  var P=W.protagonist;
  var ichSicht=(W.perspektive==='ich');
  // In der Ich-Perspektive taucht der Held nicht als eigene Figur auf -
  // die Kamera ist sein Blick.
  if(!ichSicht&&P&&(P.aussehen||'').trim()){
    var pa=P.aussehen.trim().replace(/[.\s]+$/,'');
    var pk=(P.kleidung||'').trim().replace(/[.\s]+$/,'');
    figurenArr.push(pa+(pk?', wearing '+pk:''));
  }
  W.npcs.forEach(function(n,i){
    var a=(n.aussehen||'a person').trim().replace(/[.\s]+$/,'');
    var k=(S.kleidung[i]||n.kleidung||'').trim().replace(/[.\s]+$/,'');
    figurenArr.push(a+(k?', wearing '+k:''));
  });
  var figuren=figurenArr.join(' AND ');
  var figCount=figurenArr.length;
  var szene=(opts.szene||S.szeneText||(W.ort&&W.ort.bildPrompt)||'').trim();
  var setting=(S.szeneGlobal||'').trim().replace(/[.\s]+$/,'');
  var stimmungen=W.npcs.map(function(n,i){return S.stimmung[i];}).filter(Boolean).join(' and ');
  var anzahl=figCount>1?(figCount+' distinct characters together in the scene, interacting'):'single character in the foreground';

  var sicht=ichSicht
    ? ', first person point of view, seen through the protagonist eyes, the viewer is the protagonist, protagonist himself not visible'
    : '';
  var schwanz=', '+aktuellerStil()+', '+anzahl+sicht+', '+zeitFuerBild()+', comic panel composition, dramatic lighting, detailed background';
  var mitte=(setting?'. Setting: '+setting:'')+(szene?'. Scene: '+szene:'')+(stimmungen?', mood: '+stimmungen:'');
  var ganz=figuren+mitte+schwanz;
  if(!max||ganz.length<=max)return ganz;

  // Zu lang: Stil und Bildaufbau bleiben unangetastet, der Rest teilt sich den Platz.
  var frei=Math.max(80,max-schwanz.length);
  var figurAnteil=Math.floor(frei*0.55);
  if(figuren.length>figurAnteil)figuren=kuerzeText(figuren,figurAnteil);
  mitte=kuerzeText(mitte,Math.max(0,frei-figuren.length));
  return figuren+mitte+schwanz;
}
// ── BILDREGIE-BOT ─────────────────────────────
// Normalerweise faellt die Bildbeschreibung im selben KI-Aufruf ab wie die
// Dialogzeile (Feld "bild") - schnell und billig, aber die KI hat dabei den
// Kopf beim Reden. Ist der Bot eingeschaltet, fragt ein eigener Aufruf nur
// nach dem Bild: Er liest den letzten Verlauf und sagt, was zu sehen ist.
// Aussehen der Figuren, Stil und Bildaufbau kommen weiterhin aus bauePrompt --
// der Bot liefert nur die Szene, sonst wuerde er die Figuren jedes Mal neu
// erfinden.
var BILDBOT_MAX=320;
function letzteZeilen(n){
  var raus=[];
  for(var i=Math.max(0,S.verlauf.length-n);i<S.verlauf.length;i++){
    var v=S.verlauf[i];
    if(!v||!v.text)continue;
    raus.push((v.rolle==='ich'?(W.protagonist&&W.protagonist.name||'Held'):(v.name||'Figur'))+': '+v.text);
  }
  return raus.join('\n');
}
function baueBildRegieAnweisung(){
  var wer=W.npcs.map(function(n,i){
    return (n.name||('Figur '+(i+1)))+(S.stimmung[i]?' ('+S.stimmung[i]+')':'');
  }).join(', ');
  return 'Du bist die Bildregie eines Comics. Lies den Ausschnitt und sage, WAS IN DIESEM MOMENT ZU SEHEN IST.\n\n'+
    'Schauplatz: '+((S.szeneGlobal||(W.ort&&W.ort.name)||'unbekannt'))+'\n'+
    (wer?'Anwesend: '+wer+'\n':'')+
    (S.handlung?'Bisher: '+kuerzeText(S.handlung,400)+'\n':'')+
    '\nLetzte Zuege:\n'+(letzteZeilen(4)||'(noch nichts gesprochen)')+'\n\n'+
    'Antworte mit EINEM englischen Satz, hoechstens 40 Woerter: Handlung, Koerperhaltung, Blickrichtung, '+
    'Kameraeinstellung (close-up, medium shot, wide shot) und Licht. '+
    'KEINE Namen, KEINE Beschreibung von Gesicht, Haaren oder Kleidung - die stehen schon fest. '+
    'Kein Bildstil, keine Anfuehrungszeichen, keine Erklaerung. Nur der Satz.';
}
// Die KI haengt gern Anfuehrungszeichen, Codebloecke oder ein "Sure!" davor.
function saeubereBildIdee(roh){
  var t=String(roh==null?'':roh).trim();
  t=t.replace(/^```[a-z]*\s*/i,'').replace(/```\s*$/,'').trim();
  t=t.split(/\n+/).filter(function(z){return z.trim();}).pop()||'';
  t=t.replace(/^(scene|image|prompt|bild|szene)\s*[:\-]\s*/i,'').trim();
  t=entkleide(t).trim().replace(/^[\s"'\u201c\u201e]+|[\s"'\u201d\u201c]+$/g,'');
  if(t.length>BILDBOT_MAX)t=kuerzeText(t,BILDBOT_MAX);
  return t;
}
async function bildRegie(){
  try{
    var roh=await frageKI(baueBildRegieAnweisung(),45000);
    var idee=saeubereBildIdee(roh);
    return idee.length>=8?idee:null;
  }catch(e){
    // Faellt der Bot aus, uebernimmt die alte Methode - lieber ein Bild aus
    // der Dialogregie als gar keines.
    console.warn('Bildregie-Bot ohne Antwort:',e);
    return null;
  }
}
function baueNegativ(){
  var extra=STIL_NEGATIV[aktuellerStilSchluessel()];
  return CFG.negativ+(extra?', '+extra:'');
}
async function zeichneBild(opts){
  opts=opts||{};
  // Laeuft schon eines? Dann NICHT verwerfen, sondern vormerken —
  // sonst bleibt das Bild bei langsamen Diensten minutenlang stehen.
  if(S.bildLaeuft){ S.bildAusstehend=opts; return; }
  S.bildLaeuft=true;
  el('szenelade').classList.add('an');
  try{
    // Der Bot fragt nur, wenn nichts Konkreteres vorliegt: ein eigener Prompt,
    // ein Override oder eine von Hand gegebene Szene haben Vorrang.
    if(CFG.bildBot&&opts.promptOverride==null&&!S.eigenerPrompt&&!opts.szene){
      var idee=await bildRegie();
      if(idee){ S.szeneText=idee; opts=Object.assign({},opts,{szene:idee}); }
    }
    // Rangfolge: einmaliger Override → eigener Prompt (überdauert Quellenwechsel)
    // → automatisch aus der Szene gebaut.
    var max=quelle().maxPrompt;
    var prompt = (opts.promptOverride!=null) ? String(opts.promptOverride).trim()
               : (S.eigenerPrompt ? S.eigenerPrompt : bauePrompt(opts,max));
    if(max&&prompt.length>max)prompt=kuerzeText(prompt,max);   // greift nur bei eigenen Prompts
    var negativ= (opts.negativOverride!=null)?String(opts.negativOverride).trim():(S.eigenerNegativ||baueNegativ());
    var seed   = (opts.seedOverride!=null&&String(opts.seedOverride).trim()!=='')
                 ?(parseInt(opts.seedOverride,10)||S.seed)
                 :(S.seed||(S.seed=neuerSeed()));
    S.seed=seed;
    var src=await quelle().zeichne({prompt:prompt,negativ:negativ,seed:seed,breite:auf64(CFG.breite),hoehe:auf64(CFG.hoehe)});
    if(S.letzteBildUrl&&S.letzteBildUrl.indexOf('blob:')===0&&S.letzteBildUrl!==src){
      try{ URL.revokeObjectURL(S.letzteBildUrl); }catch(e1){}
    }
    el('img0').src=src;
    S.letzteBildUrl=src;
    S.bildGeneriert=true;
    S.letzterPrompt=prompt;
    S.letzterNegativ=negativ;
  }catch(e){
    var m=String((e&&e.message)||e);
    var gedrosselt=/HTTP 429/.test(m);
    // Ein erschöpftes Kontingent meldet nicht jeder Dienst als 429 — ZeroGPU
    // etwa schreibt es in die Antwort. Auch dann nicht weiter anklopfen.
    var kontingent=/zerogpu|quota|rate.?limit|exceeded|kontingent/i.test(m);
    if(!gedrosselt&&!kontingent&&istServerPanne(m)){
      S.bildPauseBis=Date.now()+90000;
      errZeile('⚠ '+quelle().label+' ist auf einen GPU-Fehler gelaufen — das passiert auf dem Server, '+
               'nicht in deiner Anfrage. Zweiter Anlauf ist schon gescheitert, daher 90s Pause. '+
               'Bleibt es dabei, ist der Space gerade defekt; Perchance zeichnet weiter.');
    }else if(gedrosselt||kontingent){
      var sek=gedrosselt?60:300, ra=m.match(/in (\d+)s/);
      if(ra)sek=Math.max(15,Math.min(600,parseInt(ra[1],10)||60));
      S.bildPauseBis=Date.now()+sek*1000;
      errZeile('⚠ '+quelle().label+(kontingent?' — Kontingent erschöpft':' drosselt (HTTP 429)')+
               '. Keine Bildanfragen für '+sek+'s. '+
               (/token/i.test(m)?'Ein Hugging-Face-Token im Feld „Token" (⚙) hebt das Kontingent deutlich an. ':'')+
               'Sonst: Bild-Takt in ⚙ erhöhen oder zurück auf Perchance.');
    }else{
      zeigeFehler('Bild ('+quelle().label+')',e);
    }
  }
  el('szenelade').classList.remove('an');
  S.bildLaeuft=false;
  if(S.bildAusstehend){ var n=S.bildAusstehend; S.bildAusstehend=null; zeichneBild(n); }
}

function befehlVerarbeitet(txt){
  for(var i=0;i<BEFEHLE.length;i++){
    var m=txt.match(BEFEHLE[i].muster);
    if(m){ BEFEHLE[i].fn(m); return true; }
  }
  return false;
}
// Zeigt, was die Regie zuletzt wirklich geantwortet hat, und was davon
// angekommen ist. Damit laesst sich unterscheiden: Feld fehlte, Feld war leer,
// oder die Antwort brach ab.
function zeigeRohantwort(){
  var roh=S.letzteRohantwort||'';
  if(!roh){ sysZeile('Noch keine Antwort der Regie da.'); return; }
  var j=jsonAus(roh);
  var felder=['wer','antwort','stimmung','weiter','auftritt','abgang','ortwechsel','kleidung','ortaenderung','bild','handlung','fakt'];
  var zeilen=felder.map(function(f){
    var wert=j?j[f]:undefined;
    var da=(wert!==undefined&&wert!==null&&String(wert).trim()!=='');
    return (da?'✓ ':(wert===undefined?'— ':'· '))+f+(da?': '+String(wert).substring(0,60):'');
  });
  var g=el('gespraech');
  var z=document.createElement('div');
  z.className='zeile hilfe';
  z.innerHTML='<div class="txt"><b>LETZTE ANTWORT DER REGIE</b><br>'+
    'Als JSON lesbar: '+(S.letzteJsonOk?'ja':'nein — der Zeilenparser hat übernommen')+'<br>'+
    'Kontext: '+(S.kurzKontext?'gekürzt (nach Zeitüberschreitung)':'normal')+'<br>'+
    'Länge: '+roh.length+' Zeichen'+(/\}\s*$/.test(roh.trim())?'':' · <b>endet nicht mit }</b> — vermutlich abgeschnitten')+'<br><br>'+
    zeilen.map(escapeHtml).join('<br>')+
    '<br><br><b>ORIGINAL</b><br>'+escapeHtml(roh.substring(0,900))+(roh.length>900?' …':'')+'</div>';
  g.appendChild(z);scrolle();
}

function sendeFreitext(){
  var feld=el('freitext');
  var txt=feld.value.trim();
  if(!txt)return;
  if(befehlVerarbeitet(txt)){ feld.value=''; return; }
  if(S.autoAktiv){ feld.value=''; setzeAutoRegie(txt); return; }
  if(S.wartet)return;
  feld.value='';
  spielerSagt(txt);
}
function spielerSagt(txt){
  merkeSchnappschuss();
  ichSage(txt);
  S.verlauf.push({rolle:'ich',text:txt});
  var versuch=CFG.wuerfel?wagnisAus(txt):'';
  if(versuch){
    S.probe=wuerfle(versuch,letzterNpcIdx());
    sysProbe(S.probe);
  }
  fuehreSchlagabtausch(-1);
}
function regieBefehl(idx,hintRaw){
  if(!S.imSpiel)return;
  var hint=entkleide(hintRaw);
  if(idx===W.npcs.length&&idx<MAX_NPCS){ erscheineNPC(hint); return; }   // naechste freie Nummer = neue Figur
  if(idx<0||idx>=W.npcs.length){ sysZeile('Diese Figur gibt es nicht (1 bis '+W.npcs.length+').'); return; }
  if(!hint){ sysZeile('/npc'+(idx+1)+': gib nach dem Doppelpunkt eine Regieanweisung an.'); return; }
  if(S.autoAktiv){
    S.regieAnweisung[idx]=hint;
    S.autoForceIdx=idx;
    sysZeile('🎬 Regie an '+W.npcs[idx].name+': '+hint);
    autosave();
    return;
  }
  if(S.wartet){ sysZeile('— Bitte kurz warten —'); return; }
  merkeSchnappschuss();
  S.regieAnweisung[idx]=hint;
  sysZeile('🎬 Regie an '+W.npcs[idx].name+': '+hint);
  fuehreSchlagabtausch(idx);
}
function kleidungBefehl(idx,outfitRaw){
  if(!S.imSpiel)return;
  if(idx<0||idx>=W.npcs.length){ sysZeile('Diese Figur gibt es nicht.'); return; }
  var outfit=entkleide(outfitRaw);
  if(!outfit){ sysZeile('/kleidung'+(idx+1)+': gib nach dem Doppelpunkt ein Outfit an.'); return; }
  S.kleidung[idx]=outfit;
  sysZeile('✦ Neues Outfit für '+W.npcs[idx].name+': '+outfit+' ✦');
  if(S.eigenerPrompt)sysZeile('Hinweis: Ein eigener Prompt ist aktiv, das Outfit wirkt erst nach „AUS SZENE" im Bildmenü.');
  autosave();
  zeichneBild({});
}
function bildBefehl(descRaw){
  if(!S.imSpiel)return;
  var beschreibung=entkleide(descRaw);
  if(!beschreibung){ sysZeile('/bild: gib nach dem Doppelpunkt eine Bildbeschreibung an.'); return; }
  S.szeneText=beschreibung;
  S.bildZaehler=0;
  S.eigenerPrompt='';S.eigenerNegativ='';S.promptFesthalten=false;   // ausdrueckliche Neubeschreibung schlaegt den eigenen Prompt
  sysZeile('✦ Neues Bild: '+beschreibung+' ✦');
  zeichneBild({szene:beschreibung});
}
function stilBefehl(raw){
  if(!S.imSpiel)return;
  var t=entkleide(raw);
  if(!t){
    var akt=S.stil?S.stilLabel:('Start-Auswahl ('+(el('stilwahl')?el('stilwahl').value:'?')+')');
    sysZeile('Aktueller Stil: '+akt+'. Presets: '+Object.keys(STILE).join(', ')+' — oder /stil: <eigener Text>.');
    return;
  }
  var key=t.toLowerCase();
  if(STILE[key]){ S.stil=STILE[key]; S.stilLabel=key; }
  else{ S.stil=t; S.stilLabel=t; }
  sysZeile('✦ Bildstil: '+S.stilLabel+' ✦');
  if(S.eigenerPrompt)sysZeile('Hinweis: Ein eigener Prompt ist aktiv, der Stil wirkt erst nach „AUS SZENE" im Bildmenü.');
  autosave();
  zeichneBild({});
}
function perspektiveBefehl(raw){
  if(!S.imSpiel)return;
  var t=entkleide(raw).toLowerCase();
  if(!t){
    sysZeile('Erzählweise: '+(W.perspektive==='ich'?'Ich-Perspektive (du siehst durch seine Augen)'
                                                   :'Er-Perspektive ('+W.protagonist.name+' ist im Bild)')+
             ' — umschalten mit /perspektive: ich  oder  /perspektive: er');
    return;
  }
  var neu=/^(ich|first|1|ego)/.test(t)?'ich':(/^(er|sie|third|3)/.test(t)?'er':'');
  if(!neu){ sysZeile('Unbekannt. Möglich: /perspektive: ich  oder  /perspektive: er'); return; }
  W.perspektive=neu;
  sysZeile(neu==='ich'?'✦ Ab jetzt durch deine Augen ✦':'✦ Ab jetzt aus der Beobachterperspektive ✦');
  autosave();
  zeichneBild({});
}
function quelleBefehl(raw){
  var t=entkleide(raw).toLowerCase();
  if(t&&BILDQUELLEN[t]){
    CFG.quelle=t;speichereCfg();
    sysZeile('✦ Bildquelle: '+BILDQUELLEN[t].label+' ✦');
    zeichneBild({});
    return;
  }
  if(t)sysZeile('Unbekannte Quelle. Möglich: '+Object.keys(BILDQUELLEN).join(', '));
  oeffneEinstellungen();
}

// ── UNDO / NOCHMAL ────────────────────────────
function merkeSchnappschuss(){
  S.rueckgaengig.push(JSON.stringify({
    verlauf:S.verlauf, stimmung:S.stimmung, kleidung:S.kleidung,
    handlung:S.handlung, fakten:S.fakten, szeneText:S.szeneText
  }));
  while(S.rueckgaengig.length>MAX_UNDO)S.rueckgaengig.shift();
}
function stelleZurueck(){
  var roh=S.rueckgaengig.pop();
  if(!roh)return null;
  var d=JSON.parse(roh);
  S.verlauf=d.verlauf;S.stimmung=d.stimmung;S.kleidung=d.kleidung;
  S.handlung=d.handlung;S.fakten=d.fakten;S.szeneText=d.szeneText;
  return d;
}
function undo(){
  if(!S.imSpiel)return;
  if(S.wartet){ sysZeile('— Bitte kurz warten —'); return; }
  if(!S.rueckgaengig.length){ sysZeile('Nichts mehr zurückzunehmen.'); return; }
  stelleZurueck();
  zeichneVerlaufNeu();
  sysZeile('⟲ Zug zurückgenommen.');
  autosave();
}
function nochmal(){
  if(!S.imSpiel)return;
  if(S.wartet){ sysZeile('— Bitte kurz warten —'); return; }
  if(!S.rueckgaengig.length){ sysZeile('Es gibt keinen Zug zum Wiederholen.'); return; }
  var vorher=JSON.parse(S.rueckgaengig[S.rueckgaengig.length-1]);
  // Letzte Spielereingabe suchen, um sie erneut zu senden.
  var letzte=null;
  for(var i=S.verlauf.length-1;i>=vorher.verlauf.length;i--){
    if(S.verlauf[i].rolle==='ich'){ letzte=S.verlauf[i].text; break; }
  }
  stelleZurueck();
  zeichneVerlaufNeu();
  sysZeile('⟲ Noch einmal…');
  if(letzte)spielerSagt(letzte);
  else fuehreSchlagabtausch(-1);
}
function zeichneVerlaufNeu(){
  tippenFertig();
  var g=el('gespraech');g.innerHTML='';
  S.verlauf.forEach(function(v){
    if(v.rolle==='npc')npcZeileSofort(v.idx,v.text,v.name); else ichSage(v.text);
  });
  zeigeStimmung();
  aktualisiereUI();
}

// ── FIGUREN AUFTRETEN / ABTRETEN ──────────────
async function erscheineNPC(hint,still){
  if(!S.imSpiel)return;
  if(W.npcs.length>=MAX_NPCS){ sysZeile('Mehr als '+MAX_NPCS+' Personen werden hier nicht gleichzeitig gespielt.'); return; }
  if(S.npcErscheint||(S.wartet&&!still)){ if(!still)sysZeile('— Bitte kurz warten —'); return; }
  hint=entkleide(hint);
  S.npcErscheint=true;
  if(!still)setWartet(true);
  var anwesend=W.npcs.map(function(n){return n.name+' ('+n.rolle+')';}).join(', ');
  var instruction=
    'Erfinde spontan eine WEITERE Person, die JETZT am Ort dazustoesst, passend zur Situation.\n\n'+
    weltKontext()+
    'ORT: '+W.ort.name+' — '+W.ort.geschichte+'\n'+
    'BEREITS ANWESEND: '+anwesend+'.\n'+
    'BISHERIGES GESCHEHEN:\n'+verlaufText(10)+'\n'+
    (hint?'VORGABE fuer die neue Person: '+hint+'\n':'')+
    '\nAntworte NUR mit einem JSON-Objekt, ohne Codeblock:\n'+
    '{"name":"","rolle":"","aussehen":"constant English visual IDENTITY only, no clothing, no art style","kleidung":"english default outfit","person":"deutscher Satz, warm, frech, frivol, aber respektvoll","stimmung":"EIN deutsches Wort","ziel":"was sie hier fuer sich erreichen will, ein deutscher Satz","geheimnis":"was sie verbirgt, ein deutscher Satz","beziehung":"Haltung dieser Person zum Helden in ein bis drei deutschen Woertern","beziehungen":"Haltung zu den bereits Anwesenden, Format Name: Haltung; Name: Haltung, sonst leer","eroeffnung":"erster deutscher Satz beim Hereinkommen, Handlungen in eckigen Klammern erlaubt"}';
  try{
    var text=await frageKI(instruction);
    var j=jsonAus(text), z=j?null:felderAus(text);
    var f=function(k,flach,ersatz){ return j?hole(j,[k],ersatz):(z[flach]||ersatz); };
    var npc={
      name:         f('name','NAME','Ein Fremder'),
      rolle:        f('rolle','ROLLE','Bewohner'),
      aussehen:     f('aussehen','AUSSEHEN','an adult with a memorable face'),
      kleidung:     f('kleidung','KLEIDUNG','simple clothing'),
      person:       f('person','PERSON','zurueckhaltend'),
      grundstimmung:einWort(f('stimmung','STIMMUNG','neugierig')),
      ziel:         f('ziel','ZIEL',''),
      geheimnis:    f('geheimnis','GEHEIMNIS',''),
      aufgedeckt:   false,
      eroeffnung:   f('eroeffnung','EROEFFNUNG','\x5Btritt ein\x5D Störe ich?')
    };
    var idx=W.npcs.length;
    W.npcs.push(npc);
    S.stimmung.push(npc.grundstimmung);
    S.kleidung.push(npc.kleidung);
    S.regieAnweisung.push('');
    setzeBeziehung(npc.name,heldName(),f('beziehung','BEZIEHUNG',''));
    uebernimmBeziehungen(f('beziehungen','BEZIEHUNGEN',''),npc.name);
    sysZeile('— '+npc.name+' erscheint —');
    npcSagt(idx,npc.eroeffnung);
    S.verlauf.push({rolle:'npc',idx:idx,text:npc.eroeffnung,name:npc.name});
    merkeFakt(npc.name+' ist am Ort dazugekommen ('+npc.rolle+').');
    aktualisiereUI();
    S.npcErscheint=false;
    S.bildZaehler=0;
    if(!still)setWartet(false);
    // Aus der Handlung heraus: keine zusaetzliche Runde ausloesen, die laeuft schon.
    if(hint&&!still){ S.regieAnweisung[idx]=hint; await fuehreSchlagabtausch(idx); }
    zeichneBild({});
  }catch(e){
    S.npcErscheint=false;if(!still)setWartet(false);
    zeigeFehler('Figur erscheinen',e);
  }
}
function entferneNPC(idx){
  if(!S.imSpiel)return;
  if(W.npcs.length<2){ sysZeile('Mindestens eine Person muss bleiben.'); return; }
  if(idx<0||idx>=W.npcs.length)return;
  var name=W.npcs[idx].name;
  // Verlauf: Namen einfrieren, Indizes nachziehen.
  S.verlauf.forEach(function(v){
    if(v.rolle==='npc'){
      if(v.name==null)v.name=(W.npcs[v.idx]&&W.npcs[v.idx].name)||'NPC';
      if(v.idx===idx)v.idx=-1;
      else if(v.idx>idx)v.idx=v.idx-1;
    }
  });
  W.npcs.splice(idx,1);
  S.stimmung.splice(idx,1);
  S.kleidung.splice(idx,1);
  S.regieAnweisung.splice(idx,1);
  S.autoForceIdx=null;
  beziehungenAufraeumen();
  merkeFakt(name+' hat den Ort verlassen.');
  sysZeile('— '+name+' geht —');
  aktualisiereUI();
  autosave();
  zeichneBild({});
}

function npcSagt(idx,text,name){

function errZeile(text){

}
// Schreibmaschine: immer nur EINE laufende Animation, und die vorherige Zeile
// wird sauber fertiggestellt statt halb getippt stehenzubleiben.
function tippe(elem,text){
  tippenFertig();
  if(!CFG.tempo){ elem.innerHTML=formatAktionen(text); scrolle(); return; }
  var i=0;
  tipper={el:elem,text:text,timer:null};
  tipper.timer=setInterval(function(){
    if(i<text.length){ elem.textContent+=text[i++]; scrolle(); }
    else{ tippenFertig(); }
  },CFG.tempo);
}
function tippenFertig(){
  if(!tipper)return;
  clearInterval(tipper.timer);
  tipper.el.innerHTML=formatAktionen(tipper.text);
  tipper=null;
  scrolle();
}
function scrolle(){ var g=el('gespraech'); if(g)g.scrollTop=g.scrollHeight; }
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function formatAktionen(s){ return escapeHtml(s).replace(/\[([^\]]*)\]/g,'<span class="aktion">[$1]</span>'); }
function setWartet(b){
  S.wartet=b;
  el('sendBtn').disabled=b;
  el('freitext').disabled=b;
  el('gespraech').setAttribute('aria-busy',b?'true':'false');
  var g=el('gespraech'), alt=el('tippt');
  if(b){
    if(!alt){ var d=document.createElement('div'); d.id='tippt'; d.textContent='…'; g.appendChild(d); scrolle(); }
  }else if(alt){ alt.remove(); }
}

function zeigeChronik(ziel){
  if(!S.imSpiel)return;
  baueChronikNav();
  var kopf=el('chronikTitel'), inhalt=el('chronikInhalt');
  inhalt.style.whiteSpace=(ziel==='handlung')?'pre-wrap':'normal';
  if(ziel==='ort'){
    kopf.textContent='📖 '+((W.ort&&W.ort.name)||'Ort').toUpperCase();
    inhalt.textContent=((W.ort&&W.ort.geschichte)||'Keine Aufzeichnungen.')+
      (S.szeneGlobal?'\n\nKulisse: '+S.szeneGlobal:'');
    inhalt.style.whiteSpace='pre-wrap';
  }else if(ziel==='handlung'){
    kopf.textContent='📖 HANDLUNG';
    var t=(S.handlung||'Noch nichts geschehen.');
    if(S.fakten.length)t+='\n\n• '+faktenTexte().join('\n• ');
    inhalt.textContent=t;
  }else if(ziel==='mission'){
    kopf.textContent='📖 MISSION';
    inhalt.style.whiteSpace='pre-wrap';
    inhalt.textContent=(W.mission||'Für diese Geschichte wurde kein Ziel gesetzt.')+
      (S.aktZiel?'\n\nAkt '+(S.akt||1)+': '+S.aktZiel:'')+
      (S.akteVorbei&&S.akteVorbei.length?'\n\nErledigt:\n• '+S.akteVorbei.join('\n• '):'')+
      (S.missionStand?'\n\nStand: '+S.missionStand:'\n\nNoch nichts geschehen.');
    var bearbeiten=document.createElement('button');
    bearbeiten.className='haupt';
    bearbeiten.textContent=W.mission?'✎ BEARBEITEN':'✦ ZIEL SETZEN';
    bearbeiten.onclick=function(){ schliesseModal(); oeffneMissionMenu(); };
    el('chronikNav').appendChild(bearbeiten);
  }else if(ziel==='beziehungen'){
    kopf.textContent='📖 BEZIEHUNGEN';
    inhalt.style.whiteSpace='pre-wrap';
    beziehungenAufraeumen();
    var zeilen=W.npcs.map(function(x){
      var ziele=[heldName()].concat(W.npcs.map(function(a){return a.name;}).filter(function(nm){return nm!==x.name;}));
      return x.name+'\n'+ziele.map(function(zn){
        return '   → '+zn+': '+(beziehungZu(x.name,zn)||'noch unbestimmt');
      }).join('\n');
    });
    inhalt.textContent=zeilen.length?zeilen.join('\n\n'):'Noch niemand da.';
  }else{
    var n=W.npcs[ziel];
    if(!n)return;
    kopf.textContent='📖 '+(n.name||'NPC').toUpperCase();
    beziehungenAufraeumen();
    var zieleN=[heldName()].concat(W.npcs.map(function(a){return a.name;}).filter(function(nm){return nm!==n.name;}));
    inhalt.style.whiteSpace='pre-wrap';
    inhalt.textContent=n.rolle+'. '+n.person+'  (Stimmung: '+S.stimmung[ziel]+', trägt: '+(S.kleidung[ziel]||n.kleidung)+')'+
      (n.geheimnis?'\n\n'+(n.aufgedeckt?'Hat preisgegeben: '+n.geheimnis:'Verbirgt etwas — noch nicht heraus.'):'')+
      '\n\nHaltung gegenüber:\n'+zieleN.map(function(zn){
        return '   → '+zn+': '+(beziehungZu(n.name,zn)||'noch unbestimmt');
      }).join('\n');
  }
  oeffneModal('mChronik');
}

// Dieselbe Stilauswahl wie auf dem Startbildschirm, nur im laufenden Spiel.
var STIL_NAMEN={manga:'Manga / Anime',comic:'Westlicher Comic',aquarell:'Aquarell',
                oel:'Ölgemälde',realistisch:'Fotorealistisch',pixel:'Pixel-Art',
                illustrious:'Illustrious / Anime-Tags'};
// Der Bildstil stand frueher in einem eigenen Fenster. Er gehoert zum Bild,
// also steht er jetzt oben im Bildmenue — ein Fenster statt zwei.
function fuelleStilWahl(){
  var sel=el('szeneStil');
  if(!sel)return;
  sel.innerHTML='';
  Object.keys(STILE).forEach(function(k){
    var o=document.createElement('option');
    o.value=k;o.textContent=STIL_NAMEN[k]||k;
    sel.appendChild(o);
  });
  var oe=document.createElement('option');
  oe.value='eigen';oe.textContent='Eigener Stil…';
  sel.appendChild(oe);

  // Vorbelegen: gesetzter Stil, sonst eigener Text, sonst die Startauswahl.
  var eigen=el('szeneStilEigen');
  if(S.stilLabel&&STILE[S.stilLabel]){
    sel.value=S.stilLabel;eigen.value='';
  }else if(S.stil){

// Ortswechsel: neuen Ort von der KI ausformulieren lassen, damit Beschreibung
// und Bildkulisse zusammenpassen. Die alte Besetzung regelt die Regie ueber
// das Feld "abgang" - wer nicht mitkommt, bleibt zurueck.
async function ortWechseln(beschreibung){
  if(!S.imSpiel)return;
  beschreibung=entkleide(beschreibung);
  if(!beschreibung||S.ortLaeuft)return;
  S.ortLaeuft=true;
  sysZeile('— Ortswechsel: ' + beschreibung + ' —');
  try{
    var text=await frageKI(
      'Der Schauplatz eines deutschen Dialog-Adventures wechselt. Formuliere den NEUEN Ort aus.\n\n'+
      weltKontext()+
      'BISHERIGER ORT: '+((W.ort&&W.ort.name)||'?')+' — '+((W.ort&&W.ort.geschichte)||'')+'\n'+
      'NEUER ORT laut Handlung: '+beschreibung+'\n'+
      'ANWESEND: '+W.npcs.map(function(n){return n.name;}).join(', ')+'\n\n'+
      'Antworte NUR mit einem JSON-Objekt, ohne Codeblock:\n'+
      '{"name":"Name des neuen Ortes","geschichte":"atmosphaerische deutsche Beschreibung, 3 bis 6 Saetze",'+
      '"kulisse":"english description of the surroundings for image generation: architecture, objects, light, weather",'+
      '"bild":"one English sentence: what is seen the moment the characters arrive"}',
      120000);
    var j=jsonAus(text), z=j?null:felderAus(text);
    var f=function(k,flach,ersatz){ return j?hole(j,[k],ersatz):((z&&z[flach])||ersatz); };
    if(!W.ort)W.ort={};
    W.ort.name=f('name','NAME',beschreibung.substring(0,40));
    W.ort.geschichte=f('geschichte','GESCHICHTE',beschreibung);
    W.ort.bildPrompt=f('bild','BILD',W.ort.bildPrompt||'');
    S.szeneGlobal=f('kulisse','KULISSE',S.szeneGlobal||'');
    S.szeneText=W.ort.bildPrompt;
    merkeFakt('Der Ort wechselte zu '+W.ort.name+'.');
    zeigeRaumtitel();
    baueChronikNav();
    S.bildZaehler=0;
    autosave();
    zeichneBild({});
  }catch(e){
    zeigeFehler('Ortswechsel',e);
  }
  S.ortLaeuft=false;
}
// Der Ort veraendert sich, ohne dass gewechselt wird (Licht geht aus, Regen setzt ein).
function ortNotiz(satz){
  satz=entkleide(satz);

  var g=String(W.ort.geschichte||'');

}

// Seit der Umstellung auf die Ladeschale ist die Frage berechtigt, welcher Stand
// gerade laeuft. Die Schale legt den geholten Quelltext samt Zweig und Zeitpunkt
// im localStorage ab; hier wird er nur abgelesen.
var VERSION = 'V7.34';
// Ohne Browserkonsole — etwa am Handy — muss der Generator selbst sagen koennen,
// woran es liegt, wenn ein Plugin von Perchance fehlt.
function pluginLage(){
  var L=null;
  try{ L=window.PROXIMA_LADER||null; }catch(e){}
  if(!L)return 'ohne Ladeschale';
  var teile=['Ladeschale '+(L.version||'aeltere Fassung')];
  try{
    var b=(typeof L.plugins==='function')?L.plugins():{};
    Object.keys(b).forEach(function(k){ teile.push(k+': '+b[k]); });
  }catch(e){}
  ['ai','image'].forEach(function(k){
    var da=false;
    try{ da=typeof window[k]==='function'; }catch(e){}
    teile.push(k+'() '+(da?'da':'fehlt'));
  });
  return teile.join(' · ');
}
function herkunftHtml(){
  var ueberSchale=false, zweig='', zeit=0;
  try{ ueberSchale = !!(window && window.PROXIMA_LADER); }catch(e){}
  try{
    var roh=localStorage.getItem('proxima.quelltext');
    if(roh){ var d=JSON.parse(roh)||{}; zweig=d.zweig||''; zeit=Number(d.zeit)||0; }
  }catch(e){}
  var text;
  if(ueberSchale){
    text='Diese Fassung ist '+VERSION+'. Der Quelltext kommt bei jedem Start aus GitHub'+
      (zweig?', Zweig '+escapeHtml(zweig):'')+
      (zeit?', zuletzt geladen am '+new Date(zeit).toLocaleString():'')+
      '. Eine Änderung dort steht nach spätestens einer Minute hier — neu laden genügt.';
  }else{
    text='Diese Fassung ist '+VERSION+' und steht direkt im HTML-Bereich dieses Generators. '+
      'Ohne Ladeschale kommen Änderungen aus GitHub hier nicht an.';
  }
  return '<label class="feldlabel">VERSION UND HERKUNFT</label><div class="hinweis">'+text+
    '<br><br>Plugins: '+escapeHtml(pluginLage())+'</div>';
}
// Wer den Generator benutzt, soll ohne Suchen sehen, was sein Geraet verlaesst.

// Endpunkte und Parameter beim Space erfragen und die Vorlage daraus bauen.
// Erspart das Abtippen aus "Use via API" und deckt Tippfehler sofort auf.
async function gradioErkunden(){
  leseEinstellungen();
  var pr=el('quellePruef'), info=el('gradioInfo');
  var host=String(CFG.gradioHost||'').replace(/\/+$/,'');
  if(!host){ pr.className='pruefzeile fehler'; pr.textContent='Erst die Space-Adresse eintragen.'; return; }
  var kopf={};
  if(CFG.gradioToken)kopf['Authorization']='Bearer '+CFG.gradioToken;
  pr.className='pruefzeile'; pr.textContent='Frage den Space ab...';
  try{
    var r=await fetch(host+'/gradio_api/info',{headers:kopf});
    if(!r.ok)throw new Error('HTTP '+r.status+' auf /gradio_api/info');
    var j=await r.json();
    var punkte=(j&&j.named_endpoints)||{};
    var namen=Object.keys(punkte);
    if(!namen.length)throw new Error('Der Space nennt keine benannten Endpunkte.');

    // Gewuenschten Endpunkt nehmen, sonst den ersten mit Bildausgabe.
    var wunsch=String(CFG.gradioApi||'');
    if(wunsch.charAt(0)!=='/')wunsch='/'+wunsch;
    // Nach denselben Regeln waehlen wie zur Laufzeit: der Space nennt seinen
    // ersten Endpunkt "/False", der ist ganz sicher nicht der Bildgenerator.
    var gewaehlt=waehleEndpunkt(namen.map(function(n){return {api_name:n};}),wunsch);
    var name=gewaehlt?('/'+gewaehlt.name):null;
    if(!name||!punkte[name]){
      name=namen.filter(function(n){
        return (punkte[n].returns||[]).some(function(rt){return /image/i.test(String(rt.component||rt.label||''));});
      })[0]||namen[0];
    }
    var ep=punkte[name];
    var params=ep.parameters||[];

    var feldApi=el('q_gradioApi'), feldVor=el('q_gradioVorlage'), feldFn=el('q_gradioFnIndex');
    if(feldApi)feldApi.value=name;
    if(feldVor)feldVor.value=gradioVorlageAus(params);   // vorlaeufig, ohne /config

    // fn_index und die echten Vorgabewerte aus /config nachziehen.
    var fnText='';
    try{
      var c=await (await fetch(host+'/config',{headers:kopf})).json();
      var gesucht=name.replace(/^\//,''), dep=null, gefunden=null;
      (c&&c.dependencies||[]).forEach(function(d,i){
        if(String(d.api_name||'').replace(/^\//,'')===gesucht&&gefunden===null){
          gefunden=(d.id!=null?d.id:i); dep=d;
        }
      });
      if(gefunden!==null&&feldFn){ feldFn.value=String(gefunden); fnText=', fn_index '+gefunden; }
      if(dep&&feldVor)feldVor.value=gradioVorlageAusConfig(params,dep,c&&c.components);
    }catch(e2){}

    // Vorgabewerte fuer Breite und Hoehe aus /config lesen, damit die Masse
    // von vornherein im erlaubten Bereich liegen.
    var masseText='';
    try{
      var cc=await (await fetch(host+'/config',{headers:kopf})).json();
      var werte={};
      (cc&&cc.components||[]).forEach(function(comp){
        var lab=String((comp.props&&(comp.props.label||comp.props.info))||'').toLowerCase();
        var pr=comp.props||{};
        if(pr.minimum==null&&pr.value==null)return;
        if(/width|breite/.test(lab)&&!werte.b)werte.b=Math.max(Number(pr.minimum)||0,Number(pr.value)||0);
        if(/height|h(ö|oe)he/.test(lab)&&!werte.h)werte.h=Math.max(Number(pr.minimum)||0,Number(pr.value)||0);
      });
      var fb=el('q_gradioBreite'), fh=el('q_gradioHoehe');
      if(werte.b&&fb){ fb.value=String(auf64(werte.b)); }
      if(werte.h&&fh){ fh.value=String(auf64(werte.h)); }
      if(werte.b||werte.h)masseText='  |  Maße: '+auf64(werte.b||1024)+'x'+auf64(werte.h||1024);
    }catch(e3){}

    info.textContent='Endpunkte: '+namen.join(', ')+'  |  gewählt: '+name+fnText+masseText+
      '  |  Parameter: '+params.map(function(pa,i){
        return (i+1)+'. '+(pa.parameter_name||pa.label||'?')+
               ' ('+String((pa.type&&pa.type.type)||(pa.python_type&&pa.python_type.type)||'?')+')';
      }).join(' · ');
    pr.className='pruefzeile ok';
    pr.textContent='\u2713 Vorlage gebaut. Bitte prüfen, dann ÜBERNEHMEN und QUELLE TESTEN.';
    leseEinstellungen();
  }catch(e){
    pr.className='pruefzeile fehler';
    pr.textContent='\u2715 '+((e&&e.message)||e)+' — Angaben notfalls von Hand aus "Use via API" übernehmen.';
  }
}

function leseEinstellungen(){
  CFG.quelle=el('cfgQuelle').value;
  CFG.breite=auf64(el('cfgBreite').value);
  CFG.hoehe=auf64(el('cfgHoehe').value);
  CFG.negativ=el('cfgNegativ').value.trim();
  CFG.bildTakt=Math.max(0,Math.min(20,parseInt(el('cfgTakt').value,10)||0));
  CFG.tempo=Math.max(0,Math.min(120,parseInt(el('cfgTempo').value,10)||0));
  var ah=el('cfgAutoHeld'); if(ah)CFG.autoHeld=!!ah.checked;
  var ab=el('cfgAutoBesetzung'); if(ab)CFG.autoBesetzung=!!ab.checked;
  var bb=el('cfgBildBot'); if(bb)CFG.bildBot=!!bb.checked;
  var wf=el('cfgWuerfel'); if(wf)CFG.wuerfel=!!wf.checked;
  var lk=el('cfgLektor'); if(lk)CFG.lektor=!!lk.checked;
  var q=BILDQUELLEN[CFG.quelle];
  (q.felder||[]).forEach(function(f){
    var e=el('q_'+f.k);
    if(e)CFG[f.k]=(f.typ==='zahl')?(parseInt(e.value,10)||0):e.value.trim();
  });
  speichereCfg();
}
function speichereEinstellungen(){
  leseEinstellungen();
  fuelleQuelleKurz();
  schliesseModal();
  if(S.imSpiel){
    sysZeile('⚙ Einstellungen übernommen — Bildquelle: '+quelle().label);
    zeichneBild({});
  }
}
async function quellePruefen(){
  leseEinstellungen();
  var p=el('quellePruef');
  p.className='pruefzeile';p.textContent='Teste '+quelle().label+'…';
  try{
    var src=await quelle().zeichne({
      prompt:'a single red apple on a wooden table, simple, centered',
      negativ:'text, watermark', seed:12345,
      breite:512, hoehe:512
    });
    if(!src)throw new Error('Keine Bilddaten erhalten.');
    p.className='pruefzeile ok';p.textContent='✓ Quelle antwortet. Bild erhalten.';
    if(S.imSpiel){ el('img0').src=src; S.letzteBildUrl=src; S.bildGeneriert=true; }
  }catch(e){
    p.className='pruefzeile fehler';
    p.textContent='✕ '+(e&&e.message?e.message:String(e));
  }
}
function fuelleQuelleKurz(){
  var s=el('quelleKurz'); if(!s)return;
  s.innerHTML='';
  Object.keys(BILDQUELLEN).forEach(function(k){
    var o=document.createElement('option');
    o.value=k;o.textContent=BILDQUELLEN[k].label;
    if(k===CFG.quelle)o.selected=true;
    s.appendChild(o);
  });
}
function quelleKurzGewechselt(){
  CFG.quelle=el('quelleKurz').value;
  speichereCfg();
}

// ── SPEICHERSTÄNDE ────────────────────────────
var SAVE_VERSION=7;
var SLOTS=['proxima_v7_auto','proxima_v7_1','proxima_v7_2','proxima_v7_3'];
var SLOT_NAMEN=['Automatisch','Platz 1','Platz 2','Platz 3'];

// Die Undo-Schnappschuesse enthalten jeweils den ganzen Verlauf — die kommen
// NICHT mit in den Speicherstand, sonst waechst er quadratisch.
function standObjekt(){
  var kopie={};
  Object.keys(S).forEach(function(k){ if(k!=='rueckgaengig')kopie[k]=S[k]; });
  kopie.rueckgaengig=[];
  if(kopie.verlauf&&kopie.verlauf.length>600)kopie.verlauf=kopie.verlauf.slice(-600);
  return {version:SAVE_VERSION,zeit:Date.now(),welt:W,stand:kopie};
}
function schreibeSlot(i){
  try{ localStorage.setItem(SLOTS[i],JSON.stringify(standObjekt())); return true; }
  catch(e){ zeigeFehler('Speichern',e); return false; }
}
function autosave(){ schreibeSlot(0); }
function leseSlot(i){
  try{
    var roh=localStorage.getItem(SLOTS[i]);
    if(!roh)return null;
    var d=JSON.parse(roh);
    return pruefeStand(d)?d:null;
  }catch(e){ return null; }
}
function pruefeStand(d){
  return !!(d&&d.welt&&d.stand&&d.welt.ort&&Array.isArray(d.welt.npcs)&&d.welt.npcs.length);
}
function irgendeinStand(){
  for(var i=0;i<SLOTS.length;i++){ if(leseSlot(i))return true; }
  return false;
}
// Alte Formate (V6 und aelter) mitnehmen, statt sie stumm zu verlieren.
function migriere(d){
  var w=d.welt, s=d.stand;
  if(!Array.isArray(s.verlauf))s.verlauf=[];
  if(!Array.isArray(s.stimmung))s.stimmung=w.npcs.map(function(n){return n.grundstimmung;});
  if(!Array.isArray(s.kleidung))s.kleidung=w.npcs.map(function(n){return n.kleidung;});
  if(!Array.isArray(s.regieAnweisung))s.regieAnweisung=[];
  while(s.regieAnweisung.length<w.npcs.length)s.regieAnweisung.push('');
  if(!Array.isArray(s.fakten))s.fakten=[];
  // Vor V7.33 waren Fakten blosse Zeichenketten ohne Gewicht.
  s.fakten=s.fakten.map(function(x){
    if(x&&typeof x==='object'&&typeof x.t==='string')return x;
    return {t:String(x||''),g:2,z:0};
  }).filter(function(x){ return x.t; });
  if(typeof s.zug!=='number')s.zug=0;
  if(typeof s.akt!=='number')s.akt=1;
  if(typeof s.aktZiel!=='string')s.aktZiel='';
  if(!Array.isArray(s.akteVorbei))s.akteVorbei=[];
  w.npcs.forEach(function(x){
    if(typeof x.ziel!=='string')x.ziel='';
    if(typeof x.geheimnis!=='string')x.geheimnis='';
    x.aufgedeckt=!!x.aufgedeckt;
  });
  if(typeof s.minuten!=='number')s.minuten=0;
  if(typeof s.startUhr!=='number')s.startUhr=19*60+30;
  if(typeof s.wetter!=='string')s.wetter='';
  if(typeof s.frist!=='number')s.frist=0;
  s.probe=null;
  // Vor V7.31 gab es weder Mission noch Beziehungsregister.
  if(!s.beziehungen||typeof s.beziehungen!=='object'||Array.isArray(s.beziehungen))s.beziehungen={};
  if(typeof s.missionStand!=='string')s.missionStand='';
  if(typeof w.mission!=='string')w.mission='';
  if(!Array.isArray(s.rueckgaengig))s.rueckgaengig=[];
  if(typeof s.handlung!=='string')s.handlung='';
  if(typeof s.autoRegie!=='string')s.autoRegie='';
  if(typeof s.stil!=='string')s.stil='';
  if(typeof s.stilLabel!=='string')s.stilLabel='';
  if(typeof s.szeneGlobal!=='string')s.szeneGlobal='';
  if(typeof s.szeneText!=='string')s.szeneText='';
  if(typeof s.letzterNegativ!=='string')s.letzterNegativ='';
  if(typeof s.eigenerPrompt!=='string')s.eigenerPrompt='';
  if(typeof s.eigenerNegativ!=='string')s.eigenerNegativ='';
  s.promptFesthalten=!!s.promptFesthalten;
  if(!s.seed)s.seed=(w.ort&&parseInt(w.ort.seed,10))||neuerSeed();   // V6 hielt den Seed am Ort
  if(w.perspektive!=='ich'&&w.perspektive!=='er')w.perspektive='er';
  if(w.protagonist){
    if(typeof w.protagonist.aussehen!=='string')w.protagonist.aussehen='';
    if(typeof w.protagonist.kleidung!=='string')w.protagonist.kleidung='';
  }
  // Transiente Zustaende zuruecksetzen; das Bild entsteht beim Betreten neu.
  s.wartet=false;s.bildLaeuft=false;s.bildAusstehend=null;s.npcErscheint=false;
  s.bildGeneriert=false;s.bildZaehler=0;s.imSpiel=true;
  s.autoAktiv=false;s.autoLaeuft=false;s.autoForceIdx=null;
  s.letzteBildUrl='';s.bildPauseBis=0;s.ortLaeuft=false;s.letzteRohantwort='';
  return d;
}
function oeffneSpeicher(){
  var html='';
  SLOTS.forEach(function(k,i){
    var d=leseSlot(i);
    var info=d
      ? escapeHtml((d.welt.protagonist&&d.welt.protagonist.name)||'?')+' · '+escapeHtml((d.welt.ort&&d.welt.ort.name)||'?')+
        '<small>'+new Date(d.zeit||0).toLocaleString()+' · '+(d.stand.verlauf?d.stand.verlauf.length:0)+' Zeilen</small>'
      : '<span style="color:var(--dim)">leer</span>';
    html+='<div class="slot"><div class="slotinfo"><b>'+SLOT_NAMEN[i]+'</b><br>'+info+'</div>'+
      (i>0?'<button onclick="slotSpeichern('+i+')"'+(S.imSpiel?'':' disabled')+'>SICHERN</button>':'')+
      '<button onclick="slotLaden('+i+')"'+(d?'':' disabled')+'>LADEN</button>'+
      '<button onclick="slotLoeschen('+i+')"'+(d?'':' disabled')+'>✕</button></div>';
  });
  html+='<label class="feldlabel" for="exportFeld">EXPORT / IMPORT (Textblock sichern oder einfügen)</label>'+
        '<textarea id="exportFeld" class="feld" rows="4" placeholder="Hier erscheint der Export – oder füge einen fremden Spielstand ein und drücke IMPORT."></textarea>';
  el('speicherInhalt').innerHTML=html;
  oeffneModal('mSpeicher');
}
function slotSpeichern(i){
  if(!S.imSpiel)return;
  if(schreibeSlot(i))oeffneSpeicher();
}
function slotLoeschen(i){
  try{ localStorage.removeItem(SLOTS[i]); }catch(e){}
  oeffneSpeicher();
  pruefeLadeButton();
}
function slotLaden(i){
  var d=leseSlot(i);
  if(!d){ zeigeFehler('Laden',new Error('Dieser Platz ist leer oder beschädigt.')); return; }
  uebernehmeStand(d);
}
function uebernehmeStand(d){
  migriere(d);
  W=d.welt;S=d.stand;
  tipper=null;
  schliesseModal();
  if(el('start').style.display!=='none'&&!el('start').classList.contains('aus')){
    betreteSpiel();
  }else{
    S.imSpiel=true;
    starteOrt();
  }
}
function exportAnzeigen(){
  if(!S.imSpiel){
    var d=leseSlot(0);
    if(!d){ sysZeile('Kein Spielstand zum Exportieren.'); return; }
    el('exportFeld').value=JSON.stringify(d);
    return;
  }
  el('exportFeld').value=JSON.stringify(standObjekt());
  el('exportFeld').select();
}
function importStand(){
  var t=el('exportFeld').value.trim();
  if(!t){ zeigeFehler('Import',new Error('Kein Text zum Einlesen.')); return; }
  var d;
  try{ d=JSON.parse(t); }catch(e){ zeigeFehler('Import',new Error('Das ist kein gültiger Spielstand.')); return; }
  if(!pruefeStand(d)){ zeigeFehler('Import',new Error('Spielstand unvollständig.')); return; }
  uebernehmeStand(d);
}
function pruefeLadeButton(){
  var b=el('ladebtn');
  if(b)b.style.display=irgendeinStand()?'inline-block':'none';
}

// ── HELFER ────────────────────────────────────
function setStatus(t){ var e=el('ladelabel'); if(e)e.textContent=t; }

// Einen alten V6-Stand einmalig auf Platz 1 heben, statt ihn liegenzulassen.
function uebernehmeAltstand(){
  try{
    var roh=localStorage.getItem('proxima_save_v6');
    if(!roh)return;
    if(leseSlot(1))return;
    var d=JSON.parse(roh);
    if(!pruefeStand(d))return;
    localStorage.setItem(SLOTS[1],JSON.stringify({version:6,zeit:Date.now(),welt:d.welt,stand:d.stand}));
  }catch(e){}
}

// ── START ─────────────────────────────────────
(function(){
  ladeCfg();
  zeichneKopfSchalter();
  fuelleQuelleKurz();
  uebernehmeAltstand();
  pruefeLadeButton();
})();
</script>
