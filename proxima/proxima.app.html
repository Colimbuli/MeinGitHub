// ── GESCHLECHT DES HELDEN ─────────────────────
// Es steht in der Anweisung (damit die Figuren richtig ansprechen) und im
// Bildprompt (damit der Held nicht bei jedem Panel das Geschlecht wechselt).
var GESCHLECHTER={
  maennlich:{label:'männlich',  bild:'a man',                 wort:'er'},
  weiblich: {label:'weiblich',  bild:'a woman',               wort:'sie'},
  divers:   {label:'divers',    bild:'an androgynous person', wort:'they'}
};
function geschlechtSchluessel(wert){
  var t=String(wert||'').trim().toLowerCase();
  if(/^(m|mann|maennlich|männlich|male|herr)$/.test(t))return 'maennlich';
  if(/^(w|f|frau|weiblich|female|dame)$/.test(t))return 'weiblich';
  if(/^(d|divers|nichtbinaer|nichtbinär|nonbinary|enby|neutral)$/.test(t))return 'divers';
  return '';
}
function geschlechtLabel(){
  var g=GESCHLECHTER[geschlechtSchluessel(W.protagonist.geschlecht)];
  return g?g.label:'nicht festgelegt';
}
function geschlechtFuerBild(){
  var g=GESCHLECHTER[geschlechtSchluessel(W.protagonist.geschlecht)];
  return g?g.bild:'';
}
// Fehlt eine Beschreibung, entsteht eine aus dem, was ueber den Helden
// feststeht - und sie wird festgehalten, damit sie nicht jedes Mal anders ist.
function heldAussehen(schreiben){
  var P=W.protagonist;
  var a=(P.aussehen||'').trim();
  if(a)return a;
  var teile=[geschlechtFuerBild()||'a person'];
  if(P.beruf)teile.push('a '+String(P.beruf).toLowerCase());
  teile.push('an ordinary but memorable face');
  var neu=teile.join(', ');
  if(schreiben)P.aussehen=neu;
  return neu;
}

// ── CHARAKTERBLATT ────────────────────────────
// Gesichter wandern von Panel zu Panel. Ein einmal erzeugtes Portraet gibt der
// Figur ein festes Bild: als Anhalt fuer den Spieler und als eigener Seed, der
// bei jedem weiteren Blatt dieselbe Person trifft. Die Bilder liegen NICHT im
// Spielstand -- sie waeren dort zu gross -- sondern je Figur im localStorage.
var BLATT_KEY='proxima_blatt_';
function blattSchluessel(name){ return BLATT_KEY+String(name||'').toLowerCase().replace(/[^a-z0-9]+/g,'_'); }
function blattLesen(name){
  try{ return localStorage.getItem(blattSchluessel(name))||''; }catch(e){ return ''; }
}
function blattSchreiben(name,url){
  try{
    if(!url){ localStorage.removeItem(blattSchluessel(name)); return true; }
    if(String(url).length>700000)return false;   // ein zu grosses Bild sprengt den Speicher
    localStorage.setItem(blattSchluessel(name),url);
    return true;
  }catch(e){ return false; }
}
function heldSeed(){ return ((S.seed||1)+104729)%2147483647; }
function figurSeed(i){
  // Ein eigener, aber aus dem Szenen-Seed abgeleiteter Wert: dieselbe Partie
  // ergibt dieselben Gesichter, verschiedene Figuren aber verschiedene.
  return ((S.seed||1)+ (i+1)*7919)%2147483647;
}
var BLATT_RAHMEN=', character reference sheet, head and shoulders portrait, '+
  'neutral grey background, even soft light, facing the viewer, neutral expression, ';
function blattPrompt(i){
  var a,k;
  if(i==='held'){
    a=heldAussehen(false).trim().replace(/[.\s]+$/,'');
    var g=geschlechtFuerBild();
    if(g&&a.toLowerCase().indexOf(g)<0)a=g+', '+a;
    k=(W.protagonist.kleidung||'').trim().replace(/[.\s]+$/,'');
  }else{
    var n=W.npcs[i];
    if(!n)return '';
    a=(n.aussehen||'a person').trim().replace(/[.\s]+$/,'');
    k=(S.kleidung[i]||n.kleidung||'').trim().replace(/[.\s]+$/,'');
  }
  return a+(k?', wearing '+k:'')+BLATT_RAHMEN+aktuellerStil();
}
async function zeichneBlatt(i){
  if(!S.imSpiel)return;
  var held=(i==='held');
  if(!held&&!W.npcs[i])return;
  if(held)heldAussehen(true);              // fehlende Beschreibung einmal festhalten
  var n=held?W.protagonist:W.npcs[i];
  sysZeile('✎ Charakterblatt für '+n.name+' entsteht…');
  try{
    var src=await quelle().zeichne({
      prompt:kappe(blattPrompt(i),quelle().maxPrompt||1500),
      negativ:baueNegativ(),
      ohneReferenz:true,
      seed:held?heldSeed():figurSeed(i),
      breite:auf64(CFG.breite),hoehe:auf64(CFG.hoehe)
    });
    if(!blattSchreiben(n.name,src)){
      sysZeile('Das Blatt ist zu groß für den Browserspeicher — es gilt nur für diese Sitzung.');
    }
    n.blattDa=true;
    sysZeile('✦ Charakterblatt für '+n.name+' liegt vor — im Figurenmenü zu sehen.');
    autosave();
  }catch(e){
    zeigeFehler('Charakterblatt',e);
  }
}

// ── VERDECKTE ABSICHTEN ───────────────────────
// Jede Figur will etwas fuer sich und verbirgt etwas. Der Spieler sieht davon
// nichts - die KI schon, und sie spielt danach. Erst wenn es im Gespraech
// wirklich ausgesprochen wird, gilt es als aufgedeckt.
function absichtenText(){
  var zeilen=[];
  W.npcs.forEach(function(x,i){
    var t=[];
    if(x.ziel)t.push('will: '+kappe(x.ziel,140));
    if(x.geheimnis&&!x.aufgedeckt)t.push('verbirgt: '+kappe(x.geheimnis,140));
    if(x.geheimnis&&x.aufgedeckt)t.push('bereits offen: '+kappe(x.geheimnis,140));
    if(t.length)zeilen.push('- '+x.name+' (NPC'+(i+1)+') '+t.join(' | '));
  });
  if(!zeilen.length)return '';
  return 'NUR FUER DICH — VERDECKTE ABSICHTEN (der Spieler kennt sie nicht):\n'+zeilen.join('\n')+'\n'+
    'Spiele danach: Andeutungen, Ausweichen, kleine Widersprueche. Sage nichts davon geradeheraus, '+
    'solange es nicht wirklich verdient ist. Wird ein Geheimnis JETZT ausgesprochen, trage es in "aufdeckung" ein.\n';
}
function deckeAuf(text){
  var t=entkleide(String(text||'')).trim();
  if(!t||leerAngabe(t))return false;
  var m=t.match(/^\s*([^:]{1,44}?)\s*:\s*(.+)$/);
  var name=m?m[1]:t, was=m?m[2]:'';
  var i=findeNpc(name);
  if(i<0)return false;
  if(W.npcs[i].aufgedeckt)return false;
  W.npcs[i].aufgedeckt=true;
  sysZeile('✦ '+W.npcs[i].name+' hat etwas preisgegeben ✦');
  merkeFakt(W.npcs[i].name+' hat offengelegt: '+(was||W.npcs[i].geheimnis||'etwas Verborgenes'),3);
  return true;
}

// ── AKTE ──────────────────────────────────────
// Eine Szene, die nie endet, franst aus. Die Mission zerfaellt deshalb in
// Etappen: Ist eine erreicht, wird sie sichtbar abgeschlossen und die naechste
// ausgerufen.
function aktText(){
  if(!W.mission)return '';
  return 'AKT '+(S.akt||1)+(S.aktZiel?' — JETZT ANSTEHENDE ETAPPE: '+kappe(S.aktZiel,200):'')+'\n'+
    (S.akteVorbei&&S.akteVorbei.length?'ERLEDIGTE ETAPPEN: '+S.akteVorbei.map(function(x){return kappe(x,90);}).join(' · ')+'\n':'')+
    'Ist die Etappe in diesem Zug WIRKLICH erreicht (oder endgueltig gescheitert), trage die naechste in "etappe" ein — sonst lass das Feld leer.\n';
}
function naechsteEtappe(text){
  var t=entkleide(String(text||'')).trim();
  if(!t||leerAngabe(t))return false;
  if(S.aktZiel){
    S.akteVorbei=(S.akteVorbei||[]).concat([S.aktZiel]);
    if(S.akteVorbei.length>8)S.akteVorbei=S.akteVorbei.slice(-8);
    merkeFakt('Erledigt: '+S.aktZiel,3);
  }
  S.akt=(S.akt||1)+1;
  S.aktZiel=kappe(t,240);
  S.aktBild='';                    // neuer Akt, neuer Anker
  sysZeile('— AKT '+S.akt+' — '+S.aktZiel+' —');
  S.bildZaehler=0;
  return true;
}

// ── PROBEN ────────────────────────────────────
// Ohne Widerstand gelingt alles, und dann ist nichts eine Entscheidung. Eine
// Handlung des Helden in eckigen Klammern wird deshalb gewuerfelt - und wie
// die Figur zu ihm steht, hilft oder steht im Weg.
var BEZ_BONUS=[
  [/verlieb|vertraut|liebevoll|dankbar|treu|innig|zugetan/i, 4],
  [/freund|warm|neugierig|zugewandt|offen|belustigt|interessiert|versoehn/i, 2],
  [/skeptisch|kuehl|kühl|reserviert|distanziert|misstrauisch|genervt/i, -2],
  [/eisig|feindselig|wuetend|wütend|veraecht|verächt|hasst|abweisend/i, -4]
];
function beziehungsBonus(name){
  var w=beziehungZu(name,heldName());
  for(var i=0;i<BEZ_BONUS.length;i++){ if(BEZ_BONUS[i][0].test(w))return BEZ_BONUS[i][1]; }
  return 0;
}
// Eine Handlung steht in eckigen Klammern; blosses Reden wird nicht gewuerfelt.
function wagnisAus(text){
  var m=String(text||'').match(/\x5B([^\x5D]{4,})\x5D/);
  return m?m[1].trim():'';
}
function letzterNpcIdx(){
  for(var i=S.verlauf.length-1;i>=0;i--){
    var v=S.verlauf[i];
    if(v.rolle==='npc'&&v.idx>=0&&v.idx<W.npcs.length&&anwesendNpc(v.idx))return v.idx;
  }
  var da=anwesendeNpcs();
  return da.length?da[0]:-1;
}
function wuerfle(versuch,idx){
  var name=(idx>=0&&W.npcs[idx])?W.npcs[idx].name:'';
  var bonus=name?beziehungsBonus(name):0;
  var wurf=1+Math.floor(Math.random()*20);
  var schwelle=11;
  var gesamt=wurf+bonus;
  var gelungen=(wurf===20)||(wurf!==1&&gesamt>=schwelle);
  return {versuch:versuch,gegenueber:name,wurf:wurf,bonus:bonus,schwelle:schwelle,gesamt:gesamt,
          gelungen:gelungen,knapp:Math.abs(gesamt-schwelle)<=1,patzer:wurf===1,glanz:wurf===20};
}
function probeText(p){
  if(!p)return '';
  return 'PROBE auf den Versuch des Helden: „'+kappe(p.versuch,120)+'\u201c — Wurf '+p.wurf+
    (p.bonus?(p.bonus>0?' + '+p.bonus:' '+p.bonus)+' (Haltung von '+p.gegenueber+')':'')+
    ' gegen '+p.schwelle+' → '+(p.gelungen?'GELUNGEN':'MISSLUNGEN')+'.\n'+
    (p.gelungen
      ? (p.glanz?'Es gelingt besser als erhofft; gib dem Moment etwas Zusaetzliches.\n'
               :'Der Versuch gelingt. Schreibe die Folge, ohne sie zu ueberhoehen.\n')
      : (p.patzer?'Es geht gruendlich schief und macht etwas kaputt oder peinlich. Das bleibt stehen.\n'
                :'Der Versuch MISSLINGT spuerbar: Die Figur weicht aus, versteht falsch, lehnt ab oder es kommt etwas dazwischen. Schreibe das Scheitern aus, statt es abzumildern.\n'))+
    'Das Ergebnis steht fest. Erfinde keinen anderen Ausgang.\n';
}
function sysProbe(p){
  sysZeile('⚄ '+p.wurf+(p.bonus?(p.bonus>0?' + '+p.bonus:' − '+Math.abs(p.bonus)):'')+
    ' gegen '+p.schwelle+' — '+
    (p.patzer?'Patzer':p.glanz?'Glanzwurf':p.gelungen?(p.knapp?'knapp gelungen':'gelungen'):(p.knapp?'knapp misslungen':'misslungen')));
}

// ── ZEIT UND WETTER ───────────────────────────
// Eine Szene, in der nie etwas vergeht, hat keinen Druck. Die Uhr laeuft mit
// den Zuegen, das Wetter steht im Bild, und eine Frist macht aus einem Ziel
// eine Aufgabe.
function uhrzeit(){
  var m=((S.startUhr||0)+(S.minuten||0))%1440;
  if(m<0)m+=1440;
  return ('0'+Math.floor(m/60)).slice(-2)+':'+('0'+(m%60)).slice(-2);
}
function tageszeit(){
  var st=Math.floor((((S.startUhr||0)+(S.minuten||0))%1440)/60);
  if(st<5)return 'deep night';
  if(st<9)return 'early morning';
  if(st<12)return 'late morning';
  if(st<15)return 'midday';
  if(st<18)return 'afternoon';
  if(st<21)return 'evening, golden hour fading';
  return 'night';
}
function restFrist(){
  if(!S.frist)return null;
  return S.frist-(S.minuten||0);
}
function zeitText(){
  var t='ZEIT: '+uhrzeit()+(S.wetter?', '+S.wetter:'')+'.';
  var rest=restFrist();
  if(rest!==null){
    t+=rest>0
      ? ' FRIST: noch '+rest+' Minuten, dann ist es zu spaet. Die Figuren spueren den Druck.'
      : ' FRIST ABGELAUFEN: Die Zeit ist um — das hat Folgen, und die Szene zeigt sie.';
  }
  return t+'\n';
}
// Was die Uhr fuer das Bild bedeutet, auf Englisch.
function zeitFuerBild(){
  return tageszeit()+(S.wetter?', '+S.wetter.toLowerCase():'');
}
function zeitWeiter(minuten){
  var m=parseInt(minuten,10);
  if(!isFinite(m)||m<0)m=3;
  S.minuten=(S.minuten||0)+Math.min(120,m);
}
function missionText(){
  if(!W.mission)return '';
  return 'MISSION (das uebergeordnete Ziel dieser Geschichte): '+kappe(W.mission,S.kurzKontext?200:320)+'\n'+
    (S.missionStand?'STAND DER MISSION: '+kappe(S.missionStand,S.kurzKontext?160:260)+'\n':'');
}
function weltKontext(){
  var k='WELT: Das Geschehen spielt in '+W.stadt+'.\n'+
    'HELD: '+W.protagonist.name+', '+W.protagonist.beruf+' aus '+W.protagonist.herkunft+
      (geschlechtSchluessel(W.protagonist.geschlecht)?', '+geschlechtLabel():'')+
      '. Eigenart: '+W.protagonist.eigenart+'.\n';
  if(W.rahmenhandlung)k+='VORGESCHICHTE: '+kappe(W.rahmenhandlung,S.kurzKontext?260:400)+'\n';
  k+=(W.perspektive==='ich')
    ? 'ERZAEHLWEISE: Ich-Perspektive. Handlungen des Helden werden in der ICH-Form geschrieben ("\x5Bich greife nach dem Glas\x5D"). Die Figuren sprechen ihn direkt an. Das Geschehen wird durch SEINE Augen erlebt.\n'
    : 'ERZAEHLWEISE: Er-Perspektive. Handlungen des Helden werden mit seinem NAMEN geschrieben ("\x5B'+W.protagonist.name+' greift nach dem Glas\x5D"). Das Geschehen wird von aussen beobachtet.\n';
  // Nur die juengsten Fakten mitschicken - gespeichert bleiben alle.
  var f=wichtigsteFakten(S.kurzKontext?8:14);
  if(f.length)k+='WAS BISHER FESTSTEHT:\n- '+f.map(function(x){return kappe(x,140);}).join('\n- ')+'\n';
  if(S.handlung)k+='BISHERIGE HANDLUNG: '+kappe(S.handlung,S.kurzKontext?220:360)+'\n';
  k+=zeitText();
  k+=missionText();
  k+=aktText();
  var bez=beziehungText();
  if(bez)k+='BEZIEHUNGEN (Haltung jeder Figur zu jeder anderen — so spricht sie mit ihr):\n'+bez+'\n';
  k+=raeumeText();
  return k;
}
// Wer wo steht - damit die Regie weiss, wohin jemand gehen kann und wer
// gerade gar nichts mitbekommt.
function raeumeText(){
  var liste=raumListe();
  if(liste.length<2)return '';
  var belegung=raumBelegung();
  return 'RAEUME (wer wo ist; nur wer im selben Raum steht, hoert einander):\n'+
    belegung.map(function(r,k){
      return '- '+r.name+(k===kameraRaum()?' [hier]':'')+': '+
             (r.leute.length?r.leute.map(function(p){return p.name;}).join(', '):'leer');
    }).join('\n')+'\n';
}
// ── GEDAECHTNIS ───────────────────────────────
// Frueher fiel der aelteste Fakt heraus, egal wie wichtig er war - ein
// Versprechen verschwand hinter Small Talk. Jetzt traegt jeder Fakt ein
// Gewicht und den Zug seiner letzten Erwaehnung; verdraengt wird der mit dem
// kleinsten Wert.
var FAKT_SCHWER=/verspr|schwoer|schwör|geschworen|verabred|abgemacht|vereinbart|geheim|droh|streit|gestand|zugesagt|verraten|vertrag|frist|bedingung|schuld|liebt|hasst/i;
function faktGewicht(t){
  if(FAKT_SCHWER.test(t))return 3;
  return String(t).length>60?2:1;
}
function faktObjekt(x){
  if(x&&typeof x==='object')return x;
  return {t:String(x||''),g:faktGewicht(x),z:0};
}
// Gewicht mal 40 gegen das Alter in Zuegen: Ein Versprechen ueberlebt rund
// achtzig Zuege Vernachlaessigung, eine Beilaeufigkeit rund vierzig.
function faktWert(x){
  x=faktObjekt(x);
  return (x.g||1)*40-Math.max(0,(S.zug||0)-(x.z||0));
}
function faktenTexte(){ return S.fakten.map(function(x){ return faktObjekt(x).t; }); }
// Fuer die Anweisung: die wichtigsten, aber wieder in Erzaehlreihenfolge.
function wichtigsteFakten(anzahl){
  // Bei gleichem Wert gewinnt der juengere Fakt; ausgegeben wird wieder in
  // Erzaehlreihenfolge, damit die Anweisung lesbar bleibt.
  var mit=S.fakten.map(function(x,i){ return {x:x,i:i}; });
  mit.sort(function(a,b){ return (faktWert(b.x)-faktWert(a.x))||(b.i-a.i); });
  return mit.slice(0,anzahl)
    .sort(function(a,b){ return a.i-b.i; })
    .map(function(e){ return faktObjekt(e.x).t; });
}
function merkeFakt(f,gewicht){
  f=entkleide(f);
  if(!f||f.length<4)return;
  if(/^(kein|keine|nichts|none|n\/a|-)$/i.test(f))return;
  var klein=f.toLowerCase();
  var schon=null;
  S.fakten.forEach(function(x,i){ if(faktObjekt(x).t.toLowerCase()===klein)schon=i; });
  if(schon!==null){                      // schon bekannt: nur auffrischen
    var alt=faktObjekt(S.fakten[schon]);
    alt.z=S.zug||0;
    if(gewicht&&gewicht>alt.g)alt.g=gewicht;
    S.fakten[schon]=alt;
    return;
  }
  S.fakten.push({t:f,g:gewicht||faktGewicht(f),z:S.zug||0});
  faktenEinkuerzen();
}
function faktenEinkuerzen(){
  while(S.fakten.length>MAX_FAKTEN){
    var schwaechster=0;
    for(var i=1;i<S.fakten.length;i++){
      if(faktWert(S.fakten[i])<faktWert(S.fakten[schwaechster]))schwaechster=i;
    }
    S.fakten.splice(schwaechster,1);
  }
}
// Wird ein Fakt im Gespraech beruehrt, altert er nicht weiter.
function frischeFakten(text){
  var t=' '+String(text||'').toLowerCase()+' ';
  S.fakten.forEach(function(x,i){
    var o=faktObjekt(x);
    var kern=o.t.toLowerCase().split(/[^a-zäöüß0-9]+/).filter(function(w){return w.length>5;});
    if(kern.some(function(w){ return t.indexOf(w)>=0; })){ o.z=S.zug||0; S.fakten[i]=o; }
  });
}

// Der Verlauf ist der groesste Block in der Anweisung. Zeilenzahl UND
// Zeilenlaenge deckeln, sonst waechst er mit jedem Zug weiter.
function verlaufText(n,maxZeile){
  var m=maxZeile||(S.kurzKontext?140:240);
  return S.verlauf.slice(-n).map(function(v){
    var wer=(v.rolle==='npc'?(v.name||(W.npcs[v.idx]&&W.npcs[v.idx].name)||'NPC'):(v.name||W.protagonist.name));
    var t=String(v.text||'');
    if(t.length>m)t=t.substring(0,m)+'…';
    return wer+': '+t;
  }).join('\n');
}
function kappe(t,max){
  t=String(t||'');
  return t.length>max?(t.substring(0,max)+'…'):t;
}

// ── WIE DIE FIGUREN REDEN ─────────────────────
// Der haeufigste Fehler einer KI im Dialog ist nicht der falsche Inhalt,
// sondern der falsche Klang: gestelzte Bilder, erfundene Fachwoerter, Saetze,
// die niemand ausspricht. Dagegen stehen zwei Bloecke in jeder Anweisung -
// der Tonfall, den der Spieler waehlt, und die Sprachregeln, die immer gelten.
var TON_MAX=400;   // laenger liest die KI ohnehin nicht mehr mit
var TONFAELLE={
  natuerlich:{label:'Natürlich — wie Menschen wirklich reden',
    roh:'Warm, freundlich und respektvoll — vor allem aber alltagsnah. Necken, Ironie und ein trockener Spruch sind willkommen, solange sie klingen wie gesprochene Sprache. KEINE Beleidigungen, keine Herablassung, keine Feindseligkeit.'},
  frivol:{label:'Frivol — frech und anzüglich',
    roh:'Der Ton ist warm, freundlich und offen. Frivole, freche und anzuegliche Sprueche sind erlaubt und erwuenscht, solange sie SPIELERISCH und gutmuetig bleiben und wie gesprochene Sprache klingen. KEINE Beleidigungen, keine Herablassung, keine Feindseligkeit — necken ja, verletzen nein.'},
  sachlich:{label:'Sachlich — knapp und nüchtern',
    roh:'Nuechtern und knapp. Die Figuren reden zur Sache, ohne Flirt und ohne Ausschmueckung. Hoeflich, aber sparsam mit Gefuehlen.'}
};
function tonSchluessel(t){
  var k=String(t||'').toLowerCase().trim();
  if(k==='eigen')return 'eigen';
  return TONFAELLE[k]?k:'natuerlich';
}
// Der Wortlaut ohne Vorspann - so steht er auch im Feld, wenn man ihn von Hand
// nachbessern will.
function tonText(){
  var k=tonSchluessel(CFG.ton);
  if(k==='eigen'){
    var t=String(CFG.tonText||'').trim();
    return t||TONFAELLE.natuerlich.roh;
  }
  return TONFAELLE[k].roh;
}
function tonLabel(){
  var k=tonSchluessel(CFG.ton);
  return (k==='eigen')?'eigener Ton':TONFAELLE[k].label;
}
function registerText(){ return 'REGISTER: '+kappe(tonText(),TON_MAX)+'\n'; }
// /ton: nimmt entweder eine Vorgabe beim Namen oder gleich den eigenen Wortlaut.
function tonBefehl(raw){
  var t=entkleide(String(raw==null?'':raw)).trim();
  if(!t){ sysZeile('❖ Tonfall: '+tonLabel()+' — '+kappe(tonText(),160)); return; }
  var k=t.toLowerCase();
  if(TONFAELLE[k]){
    CFG.ton=k;
  }else{
    CFG.ton='eigen';
    CFG.tonText=kappe(t,TON_MAX);
  }
  speichereCfg();
  sysZeile('❖ Tonfall: '+tonLabel()+' — '+kappe(tonText(),160));
}
function sprachRegeln(){
  return 'SPRACHE — hier geht am meisten schief, also lies es zweimal:\n'+
    '- Schreib GESPROCHENE Sprache: einfache Woerter, kurze Saetze, auch mal ein halber. So, wie Menschen wirklich reden.\n'+
    '- Pruefe jeden Satz, bevor du ihn abschickst: Wuerde ein Mensch in DIESER Lage das wirklich so sagen? Wenn nein, schreib ihn schlichter. Ein banaler echter Satz ist besser als ein origineller, den niemand sagt.\n'+
    '- Hoechstens EIN Bild oder Vergleich pro Zeile, meistens gar keines. Keine Metapher auf der Metapher, nichts, was etwas "fast schon" tut.\n'+
    '- Keine erfundenen Fachbegriffe und kein Vokabular, das diese Figur nicht kennen kann.\n'+
    '- Konkret statt geheimnisvoll: was die Figur SIEHT, TUT und WILL.\n'+
    '- Auch Ungeduld, Drohung und Scherz bleiben alltaeglich — "Jetzt mach schon" statt einer ausgedachten Bildrede.\n';
}

// ── EIN ZUG: Regie + Schauspiel + Bildidee in EINEM Aufruf ──
async function naechsterZug(erzwinge,autoModus){
  // Spielbar ist, wer im Raum der Kamera steht - und nicht die Figur, die der
  // Mensch am Bildschirm selbst spricht.
  var spielbar=anwesendeNpcs().filter(function(i){ return i!==S.spieltIdx; });
  // Der Held antwortet automatisch, sobald der Mensch eine Figur spielt; im
  // Auto-Modus zusaetzlich, wenn er dort mitspielen soll.
  var heldSpielt=heldAnwesend()&&((S.spieltIdx!=null)||!!(autoModus&&CFG.autoHeld));
  if(!spielbar.length&&!heldSpielt)return {stop:true,leer:true};
  var mehrere=(spielbar.length+(heldSpielt?1:0))>1;
  var liste=spielbar.map(function(i,pos){
    var n=W.npcs[i];
    return '- NPC'+(pos+1)+' = '+n.name+' ('+n.rolle+'). Persoenlichkeit: '+n.person+
           '. Aktuelle Stimmung: '+S.stimmung[i]+
           '. Traegt gerade: '+(S.kleidung[i]||n.kleidung||'unbestimmt')+'.';
  }).join('\n');
  var regieZeilen='';
  spielbar.forEach(function(i,pos){
    if(S.regieAnweisung[i]){
      regieZeilen+='VERDECKTE REGIE fuer '+W.npcs[i].name+' (NPC'+(pos+1)+'): '+S.regieAnweisung[i]+'. Setze das in Rede/Handlung um, ohne es zu erwaehnen oder zu zitieren.\n';
      S.regieAnweisung[i]='';
    }
  });
  var szeneRegie=S.autoRegie?('STEHENDE REGIE (szenenweit, ALLE Figuren beachten sie dauerhaft): '+S.autoRegie+'. Baue das laufend in Rede/Handlung ein, ohne es zu zitieren.\n'):'';
  var zwangPos=spielbar.indexOf(erzwinge);
  var zwang=(zwangPos>=0)?('WICHTIG: In DIESEM Zug MUSS NPC'+(zwangPos+1)+' ('+W.npcs[erzwinge].name+') sprechen.\n'):'';
  var letzterWar='';
  for(var j=S.verlauf.length-1;j>=0;j--){
    if(S.verlauf[j].rolle==='npc'){letzterWar=S.verlauf[j].name||(W.npcs[S.verlauf[j].idx]&&W.npcs[S.verlauf[j].idx].name)||'';break;}
    if(S.verlauf[j].rolle==='ich'){letzterWar=S.verlauf[j].name||W.protagonist.name;break;}
  }
  var altern=(autoModus&&erzwinge<0&&letzterWar&&mehrere)
    ?('Zuletzt sprach '+letzterWar+'. Lass nun bevorzugt jemand ANDEREN zu Wort kommen, damit sich alle abwechseln.\n'):'';
  var werOpt=spielbar.map(function(i,pos){return 'NPC'+(pos+1);}).join(' oder ');
  if(heldSpielt)werOpt=(werOpt?werOpt+' oder ':'')+'HELD';
  // Spielt der Mensch eine Figur, ist der Held eine Rolle der KI - und die
  // gespielte Figur gehoert ihr nicht.
  var rollenZeile=(S.spieltIdx!=null)
    ? ('ROLLENTAUSCH: Der Mensch am Bildschirm spielt '+gespielterName()+'. Diese Figur sprichst du NIE. '+
       (heldAnwesend()?('Dafuer spielst du '+heldName()+' (HELD) eigenstaendig: '+
        (W.protagonist.beruf||'ohne Beruf')+' aus '+(W.protagonist.herkunft||'unbekannter Herkunft')+
        ', Eigenart: '+(W.protagonist.eigenart||'—')+'. Er antwortet, fragt nach und verfolgt eigene Absichten.\n')
                      :(heldName()+' ist gerade nicht im Raum.\n')))
    : '';

  var instruction=
    'Du fuehrst Regie UND spielst die Figuren in einem deutschen Dialog-Adventure. Im Raum sind '+(spielbar.length+(heldSpielt?1:0))+' Person(en), die du spielst. Du entscheidest, wer als Naechstes spricht, und schreibst diese EINE Zeile voll in der Rolle dieser Figur.\n\n'+
    weltKontext()+
    'RAUM: '+W.ort.name+' — '+kappe(W.ort.geschichte,S.kurzKontext?260:420)+'\n'+
    rollenZeile+
    'ANWESENDE FIGUREN:\n'+(liste||'- keine')+'\n'+
    abwesendeText()+'\n'+
    (mehrere?'Die Figuren duerfen sich auch GEGENSEITIG ansprechen und die Handlung gemeinsam vorantreiben. Jede Figur handelt eigenstaendig, mit eigener Stimme.\n':'')+
    (autoModus&&!heldSpielt?'AUTO-MODUS: Der Held schweigt gerade. Die Figuren treiben die Szene EIGENSTAENDIG voran, reden miteinander und handeln.\n':'')+
    (heldSpielt&&S.spieltIdx==null?('AUTO-MODUS MIT MITSPIELENDEM HELDEN: Auch '+W.protagonist.name+' handelt jetzt eigenstaendig. Du darfst ihn sprechen und handeln lassen, dann ist WER = HELD. Er bleibt dabei ganz er selbst: '+
                 W.protagonist.beruf+' aus '+W.protagonist.herkunft+', Eigenart: '+W.protagonist.eigenart+'. Er ist kein blosser Stichwortgeber, sondern verfolgt eigene Absichten, fragt nach, widerspricht auch mal und ergreift die Initiative.\n'):'')+
    (autoModus&&!mehrere?'Es ist nur EINE Figur anwesend: sie handelt allein weiter – denkt laut, beschaeftigt sich, kommentiert die Umgebung, geht ihrer Taetigkeit nach und treibt die Szene voran, auch ohne Gegenueber.\n':'')+
    'WORAUF DIE SZENE ZULAEUFT:\n'+
    (W.mission
      ? '- Die MISSION steht ueber allem. Jede Figur weiss, worum es geht; auch beim Plaudern kehrt das Gespraech dorthin zurueck, und jeder Zug bringt sie voran, verkompliziert sie oder zeigt, was ihr im Weg steht.\n'
      : '- Es gibt kein festes Ziel. Dann verfolgt jede Figur eigene Absichten am Ort und treibt die Szene damit voran.\n')+
    '- Die BEZIEHUNGEN oben sind verbindlich: Jede Figur spricht mit jeder anderen genau so, wie es dort steht — vertraut, skeptisch, verliebt, dankbar. Wer den Helden kennt, behandelt ihn nicht wie einen Fremden.\n'+
    '- ANNAEHERUNG: Zuneigung, Flirt und Begehren duerfen entstehen, sind aber weder das Thema noch eine Abkuerzung. Sie wachsen langsam aus gemeinsamem Tun und Vertrauen, in kleinen Schritten und nur, wenn BEIDE Seiten sie tragen. Ueberspringe keine Stufe: aus "hoeflich" wird nicht im naechsten Zug "verliebt". Nimmt die Szene eine amouroese Wendung, laeuft alles andere trotzdem weiter — die Mission, die uebrigen Anwesenden, der Ort.\n'+
    registerText()+sprachRegeln()+
    '- Text des Helden in eckigen Klammern sind seine HANDLUNGEN. Figuren antworten mit EIGENEN Handlungen (in eckigen Klammern) und Rede.\n'+
    '- Reagiere KONKRET auf das zuletzt Gesagte. Wiederhole keine Formulierungen aus frueheren Zeilen.\n'+
    '- Widersprich nichts, was unter WAS BISHER FESTSTEHT aufgefuehrt ist.\n'+
    '- Stimmungen duerfen sich durch das Gespraech aendern, zum Guten wie zum Schlechten.\n\n'+
    absichtenText()+szeneRegie+regieZeilen+altern+zwang+probeText(S.probe)+
    'BISHERIGES GESCHEHEN:\n'+verlaufText(S.kurzKontext?6:10)+'\n\n'+
    'Antworte NUR mit einem gueltigen JSON-Objekt, ohne Codeblock, ohne Kommentare, ohne Text davor oder danach:\n'+
    '{\n'+
    '  "wer": "'+werOpt+(autoModus?'':' oder STOP')+'",\n'+
    '  "antwort": "die gesprochene Reaktion dieser Figur auf Deutsch, 1 bis 3 Saetze, Handlungen in eckigen Klammern",\n'+
    '  "stimmung": "Stimmung DIESER Figur nach dem Moment, EIN deutsches Wort",\n'+
    '  "beziehungen": "nur was sich JETZT wirklich geaendert hat, Format Figur > Ziel: Haltung, mehrere durch Semikolon getrennt. Kleine Schritte, keine Spruenge. Sonst leer.",\n'+
    '  "mission": "ein kurzer Satz, was die Mission JETZT vorangebracht, verzoegert oder verkompliziert hat. Sonst leer.",\n'+
    '  "minuten": 3,\n'+
    '  "wetter": "nur wenn sich Wetter oder Licht JETZT merklich aendern, in zwei bis drei deutschen Woertern. Sonst leer.",\n'+
    '  "aufdeckung": "Name: was diese Figur JETZT wirklich preisgegeben hat. Sonst leer.",\n'+
    '  "etappe": "die naechste Etappe, wenn die jetzige in diesem Zug erreicht oder endgueltig gescheitert ist. Sonst leer.",\n'+
    '  "weiter": false,\n'+
    '  "auftritt": "Person, die JETZT dazustoesst: Name und Rolle. Sonst leer.",\n'+
    '  "abgang": "Anwesende Person, die JETZT weggeht: ihr Name. Sonst leer.",\n'+
    '  "ortwechsel": "Neuer Ort mit kurzer Beschreibung, wenn ALLE Anwesenden JETZT gemeinsam den Schauplatz wechseln. Sonst leer.",\n'+
    '  "raumwechsel": "Wenn EINZELNE den Raum wechseln: Name > Raum, mehrere durch Semikolon. Auch der Held. Sonst leer.",\n'+
    '  "motiv": "was das Bild zeigen soll: alle, figuren, held oder ort (ein Ding aus naechster Naehe, ohne Person)",\n'+
    '  "kleidung": "Name: neues Outfit auf ENGLISCH, wenn sich jemand JETZT umzieht. Sonst leer.",\n'+
    '  "ortaenderung": "kurzer Satz, wenn sich am Ort etwas dauerhaft aendert. Sonst leer.",\n'+
    '  "bild": "one English sentence, PURELY VISUAL: what the characters do, posture, expression, gaze, setting, light, camera framing. No names, no art style.",\n'+
    '  "handlung": "1 bis 2 Saetze, die die Handlung fortschreiben",\n'+
    '  "fakt": "ein kurzer neuer Fakt, der spaeter gelten soll, sonst leer"\n'+
    '}\n\n'+
    '"minuten": wie viel Zeit dieser Moment gekostet hat, meist 1 bis 5 — ein langes Gespraech oder ein Weg auch mehr.\n'+
    'Die vier Felder auftritt, abgang, ortwechsel und kleidung veraendern das Spiel wirklich: Was dort nicht steht, geschieht nicht. Kommt in deiner Antwort jemand herein, MUSST du "auftritt" ausfuellen. Eine blosse Ankuendigung gehoert nicht hinein.\n'+
    'Anwesend: '+(spielbar.map(function(i){return W.npcs[i].name;}).concat(heldAnwesend()?[heldName()]:[]).join(', ')||'niemand')+'. '+
    'Wer laut ANWESENDE FIGUREN nicht im Raum steht, kann weder sprechen noch gesehen werden. '+
    (autoModus?'"wer": Es MUSS eine Figur sprechen, niemals STOP.':'"wer": STOP heisst, der Held ist wieder dran.')+
    ' "weiter": true, wenn sofort noch eine ANDERE Figur reagieren sollte.';

  var tText=Date.now();
  var text=await frageKI(instruction,150000);
  S.msText=Date.now()-tText;
  S.msAnweisung=instruction.length;
  var j2=jsonAus(text), z=j2?null:felderAus(text);
  // Fuer /roh aufheben: ohne Blick auf die Rohantwort ist nicht zu erkennen,
  // ob ein Feld fehlte, leer war oder die Antwort abgeschnitten wurde.
  S.letzteRohantwort=String(text||'');
  S.letzteJsonOk=!!j2;
  var wer      = j2?hole(j2,['wer'],''):(z['WER']||'');
  var antwort  = entkleide(j2?hole(j2,['antwort'],''):(z['ANTWORT']||''));
  var stimmung = einWort(j2?hole(j2,['stimmung'],''):(z['STIMMUNG']||''));
  var bild     = entkleide(j2?hole(j2,['bild'],''):(z['BILD']||z['SZENE']||''));
  var handlung = entkleide(j2?hole(j2,['handlung'],''):(z['HANDLUNG']||''));
  var fakt     = entkleide(j2?hole(j2,['fakt'],''):(z['FAKT']||''));
  var ortwechsel  = entkleide(j2?hole(j2,['ortwechsel'],''):(z['ORTWECHSEL']||''));
  var ortaenderung= entkleide(j2?hole(j2,['ortaenderung'],''):(z['ORTAENDERUNG']||''));
  var kleidungNeu = entkleide(j2?hole(j2,['kleidung'],''):(z['KLEIDUNG']||''));
  var bezRoh   = j2?(j2.beziehungen==null?'':j2.beziehungen):(z['BEZIEHUNGEN']||'');
  var minutenRoh=j2?hole(j2,['minuten'],''):(z['MINUTEN']||'');
  var aufdeckRoh=entkleide(j2?hole(j2,['aufdeckung'],''):(z['AUFDECKUNG']||''));
  var etappeRoh =entkleide(j2?hole(j2,['etappe'],''):(z['ETAPPE']||''));
  var wetterRoh=entkleide(j2?hole(j2,['wetter'],''):(z['WETTER']||''));
  var missionRoh=entkleide(j2?hole(j2,['mission'],''):(z['MISSION']||''));
  var auftritt = entkleide(j2?hole(j2,['auftritt'],''):(z['AUFTRITT']||''));
  var abgang   = entkleide(j2?hole(j2,['abgang'],''):(z['ABGANG']||''));
  var raumwechsel=entkleide(j2?hole(j2,['raumwechsel'],''):(z['RAUMWECHSEL']||''));
  S.motivZug=motivSchluessel(j2?hole(j2,['motiv'],''):(z['MOTIV']||''));
  var weiterRoh= j2?j2.weiter:(z['WEITER']||'');
  var weiter   = (weiterRoh===true)||/^(ja|yes|true)/i.test(String(weiterRoh||''));

  if(!antwort||(!autoModus&&/STOP/i.test(wer)))return {stop:true};
  if(heldSpielt&&/\bHELD\b|PROTAGONIST/i.test(wer)){
    if(handlung)S.handlung=handlung;
    if(fakt)merkeFakt(fakt);
    if(bild)S.szeneText=bild;
    antwort=await lektor(antwort,W.protagonist.name);
    folgeBeziehungen(bezRoh,missionRoh);
    folgeZug(minutenRoh,wetterRoh,antwort,aufdeckRoh,etappeRoh);
    return {stop:false,held:true,text:antwort,weiter:false,auftritt:auftritt,abgang:abgang,
            ortwechsel:ortwechsel,ortaenderung:ortaenderung,kleidung:kleidungNeu,raumwechsel:raumwechsel};
  }
  // "NPC2" meint die zweite Figur der ANWESENDEN LISTE, nicht die zweite Figur
  // der Welt - sonst spraeche jemand aus einem anderen Raum.
  var pos=0;
  var m=String(wer).match(/(\d+)/);
  if(m)pos=parseInt(m[1],10)-1;
  if(pos<0||pos>=spielbar.length)pos=0;
  var idx=(spielbar.indexOf(erzwinge)>=0)?erzwinge:spielbar[pos];
  if(!(idx>=0&&idx<W.npcs.length))return {stop:true,leer:true};

  if(handlung)S.handlung=handlung;
  if(fakt)merkeFakt(fakt);
  if(bild)S.szeneText=bild;
  antwort=await lektor(antwort,(W.npcs[idx]&&W.npcs[idx].name)||'die Figur');
  folgeBeziehungen(bezRoh,missionRoh);
  folgeZug(minutenRoh,wetterRoh,antwort,aufdeckRoh,etappeRoh);

  return {stop:false,idx:idx,text:antwort,stimmung:stimmung,weiter:(weiter&&mehrere),
          auftritt:auftritt,abgang:abgang,ortwechsel:ortwechsel,ortaenderung:ortaenderung,
          kleidung:kleidungNeu,raumwechsel:raumwechsel};
}

// Eine Zeitueberschreitung heisst meist: die Anweisung war zu lang oder der
// Dienst ueberlastet. Ab dann kuerzer fragen, statt weiter aufzulaufen.
function pruefeZeitueberschreitung(e){
  var m=String((e&&e.message)||e);
  if(!/Timeout|Zeitüberschreitung|Zeitueberschreitung/i.test(m))return false;
  if(!S.kurzKontext){
    S.kurzKontext=true;
    sysZeile('⧖ Die KI hat nicht rechtzeitig geantwortet. Ab jetzt wird der Kontext kürzer gehalten — '+
             'mit /nochmal kannst du den Zug wiederholen.');
    autosave();
  }else{
    sysZeile('⧖ Wieder keine Antwort. Der Textdienst ist vermutlich überlastet — /nochmal versucht es erneut.');
  }
  return true;
}
// Leere Angaben kommen in vielen Verkleidungen zurueck.
function leerAngabe(t){
  return !t||/^(nein|kein|keine[rn]?|niemand|none|null|nichts|-|\u2014)$/i.test(String(t).trim());
}
function findeNpc(name){
  var n=String(name||'').toLowerCase().trim();
  if(!n)return -1;
  var erstes=n.split(/[\s,]+/)[0];
  var idx=-1;
  W.npcs.forEach(function(f,i){
    if(idx>=0)return;
    var fn=String(f.name||'').toLowerCase();
    if(!fn)return;
    if(fn===n||n.indexOf(fn)>=0||fn.split(/\s+/)[0]===erstes)idx=i;
  });
  return idx;
}
// Die Handlung entscheidet mit, wer am Ort ist: kuendigt sie jemanden an oder
// laesst jemanden gehen, zieht die Besetzung nach.
// "Ida: a red silk dress" - auch mehrere, mit Semikolon getrennt. Gilt fuer
// die Figuren wie fuer den Helden. Unveraenderte Angaben werden verworfen,
// damit nicht bei jedem Zug dasselbe Bild neu entsteht.
function kleidungAendern(eintrag){
  var geaendert=false;
  String(eintrag||'').split(/\s*;\s*/).forEach(function(teil){
    var m=teil.match(/^([^:]{1,48}):\s*([\s\S]+)$/);
    if(!m)return;
    var name=entkleide(m[1]), outfit=entkleide(m[2]);
    if(leerAngabe(outfit)||outfit.length<3)return;
    var pn=String(W.protagonist.name||'').toLowerCase().split(/\s+/)[0];
    if(pn&&name.toLowerCase().indexOf(pn)>=0){
      if(String(W.protagonist.kleidung||'').toLowerCase()===outfit.toLowerCase())return;
      W.protagonist.kleidung=outfit;
      sysZeile('✦ '+W.protagonist.name+' trägt jetzt: '+outfit+' ✦');
      geaendert=true;return;
    }
    var i=findeNpc(name);
    if(i<0)return;
    if(String(S.kleidung[i]||'').toLowerCase()===outfit.toLowerCase())return;
    S.kleidung[i]=outfit;
    W.npcs[i].kleidung=outfit;   // damit es auch im Figurenmenü steht
    sysZeile('✦ '+W.npcs[i].name+' trägt jetzt: '+outfit+' ✦');
    geaendert=true;
  });
  return geaendert;
}
// Reihenfolge: erst der Ort, dann wer bleibt und wer dazukommt. Sonst
// tritt die neue Person noch am alten Schauplatz auf.
// Spricht der Held, haengt es an der gespielten Rolle, wie die Zeile aussieht:
// spielt der Mensch den Helden, ist es seine eigene Zeile - spielt er eine
// Figur, ist der Held eine Rolle der KI wie jede andere.
function antwortDesHelden(text){
  if(S.spieltIdx==null){
    ichSage(text,heldName());
    S.verlauf.push({rolle:'ich',text:text,name:heldName()});
  }else{
    npcSagt(-1,text,heldName());
    S.verlauf.push({rolle:'npc',idx:-1,text:text,name:heldName()});
  }
}
async function folgeHandlung(res){
  if(!res)return;
  if(CFG.autoBesetzung&&!leerAngabe(res.raumwechsel))folgeRaumwechsel(res.raumwechsel);
  if(CFG.autoBesetzung&&!leerAngabe(res.ortaenderung))ortNotiz(res.ortaenderung);
  if(CFG.autoBesetzung&&!leerAngabe(res.ortwechsel)&&!S.ortLaeuft)await ortWechseln(res.ortwechsel);
  await besetzungAendern(res);
  // Ein Kleiderwechsel ist sichtbar - deshalb sofort neu zeichnen, nicht erst
  // beim naechsten Bildtakt.
  if(CFG.autoBesetzung&&!leerAngabe(res.kleidung)&&kleidungAendern(res.kleidung)){
    S.bildZaehler=0;
    autosave();
    zeichneBild({});
  }
}
async function besetzungAendern(res){
  if(!CFG.autoBesetzung||!res)return;
  if(!leerAngabe(res.abgang)){
    var i=findeNpc(res.abgang);
    if(i>=0&&W.npcs.length>1)entferneNPC(i);
  }
  if(!leerAngabe(res.auftritt)&&W.npcs.length<MAX_NPCS&&!S.npcErscheint){
    await erscheineNPC(res.auftritt,true);
  }
}

// ── SCHLAGABTAUSCH ────────────────────────────
async function fuehreSchlagabtausch(erzwungenerIdx){
  if(S.wartet&&erzwungenerIdx<0)return;
  setWartet(true);
  var cap=W.npcs.length>1?Math.min(MAX_ZUEGE,W.npcs.length):1;
  var erzwinge=(typeof erzwungenerIdx==='number')?erzwungenerIdx:-1;
  var zuege=0;
  while(zuege<cap){
    var res=null;
    try{ res=await naechsterZug(erzwinge); }
    catch(e){ if(!pruefeZeitueberschreitung(e))zeigeFehler('NPC-Zug',e); break; }
    erzwinge=-1;
    if(!res||res.stop){
      if(res&&res.leer)sysZeile('— Hier ist niemand, der antworten könnte —');
      break;
    }
    if(res.held){
      antwortDesHelden(res.text);
    }else{
      npcSagt(res.idx,res.text);
      S.verlauf.push({rolle:'npc',idx:res.idx,text:res.text,name:W.npcs[res.idx].name});
      if(res.stimmung){ S.stimmung[res.idx]=res.stimmung; zeigeStimmung(); }
    }
    await folgeHandlung(res);
    zuege++;
    if(!res.weiter)break;
  }
  bildTakt();
  autosave();
  setWartet(false);
}
function bildTakt(){
  if(!CFG.bildTakt)return;
  S.bildZaehler=(S.bildZaehler||0)+1;
  if(S.bildZaehler<CFG.bildTakt)return;
  S.bildZaehler=0;
  if(S.bildPauseBis&&Date.now()<S.bildPauseBis)return;   // Dienst drosselt gerade
  if(S.eigenerPrompt){
    // Festgehalten: das Bild soll bewusst stehenbleiben, also gar nicht erst
    // dieselbe Anfrage noch einmal stellen.
    if(S.promptFesthalten)return;
    // Sonst hat die Handlung Vorrang: ab hier folgt das Bild wieder der Szene.
    S.eigenerPrompt='';S.eigenerNegativ='';
  }
  zeichneBild({});
}

// ── AUTO-MODUS ────────────────────────────────
function warte(ms){ return new Promise(function(r){setTimeout(r,ms);}); }
function autoUmschalten(){
  if(!S.imSpiel)return;
  S.autoAktiv=!S.autoAktiv;
  aktualisiereUI();
  if(S.autoAktiv){
    sysZeile('▶︎ Auto-Modus an — '+(CFG.autoHeld?(W.protagonist.name+' und die Figuren übernehmen'):'die Figuren übernehmen')+
             '. Deine Eingaben sind jetzt Regie (mit /sag: sprichst du selbst).');
    autoSchleife();
  }else{
    sysZeile('■ Auto-Modus aus.');
  }
}
async function autoSchleife(){
  if(S.autoLaeuft)return;
  S.autoLaeuft=true;
  var fehler=0;
  while(S.autoAktiv){
    var erzwinge=(S.autoForceIdx!=null)?S.autoForceIdx:-1;
    S.autoForceIdx=null;
    var res=null;
    try{
      res=await naechsterZug(erzwinge,true);
      fehler=0;
    }catch(e){
      // Nicht sofort aufgeben: kurze Pause, dann erneut. Erst nach drei
      // Fehlschlaegen abschalten – und dann auch sichtbar, nicht stumm.
      fehler++;
      if(!pruefeZeitueberschreitung(e))zeigeFehler('Auto-Zug',e);
      if(fehler>=3){
        S.autoAktiv=false;
        sysZeile('■ Auto-Modus nach mehreren Fehlern beendet.');
        break;
      }
      await warte(2000*fehler);
      continue;
    }
    if(!S.autoAktiv)break;
    if(res&&!res.stop){
      if(res.held){
        antwortDesHelden(res.text);
      }else{
        npcSagt(res.idx,res.text);
        S.verlauf.push({rolle:'npc',idx:res.idx,text:res.text,name:W.npcs[res.idx].name});
        if(res.stimmung){ S.stimmung[res.idx]=res.stimmung; zeigeStimmung(); }
      }
      await folgeHandlung(res);
      bildTakt();
      autosave();
      await warte(Math.min(6000,900+String(res.text).length*Math.max(8,CFG.tempo)));
    }else{
      await warte(1500);
    }
  }
  S.autoLaeuft=false;
  aktualisiereUI();
}
function setzeAutoRegie(txt){
  S.autoRegie=txt;
  sysZeile('❖ Stehende Regie: '+txt);
  autosave();
}

// ── BILD-PIPELINE ─────────────────────────────
// Der Prompt wird aus Bausteinen gebaut, damit beim Kuerzen nicht ausgerechnet
// das Ende verlorengeht: dort stehen Stil und Bildaufbau, und die bestimmen,
// wie das Bild ueberhaupt aussieht. Gekuerzt wird in der Mitte.
function bauePrompt(opts,max){
  var figurenArr=[];
  var P=W.protagonist;
  var ichSicht=(W.perspektive==='ich');
  var motiv=motivSchluessel(opts&&opts.motiv)||bildMotiv();
  // Wer im Bild erscheint, haengt an drei Dingen: am Motiv, am Raum (wer
  // anderswo ist, ist nicht zu sehen) und an der Kamera - in der
  // Ich-Perspektive ist die gespielte Figur der Blick und daher unsichtbar.
  var heldRein=(motiv==='alle'||motiv==='held')&&heldAnwesend()&&
               !(ichSicht&&S.spieltIdx==null);
  if(heldRein&&P&&(P.aussehen||'').trim()){
    var pa=P.aussehen.trim().replace(/[.\s]+$/,'');
    var pg=geschlechtFuerBild();
    if(pg&&pa.toLowerCase().indexOf(pg)<0)pa=pg+', '+pa;
    var pk=(P.kleidung||'').trim().replace(/[.\s]+$/,'');
    figurenArr.push(pa+(pk?', wearing '+pk:''));
  }
  if(motiv==='alle'||motiv==='figuren'){
    W.npcs.forEach(function(n,i){
      if(!anwesendNpc(i))return;
      if(ichSicht&&S.spieltIdx===i)return;
      var a=(n.aussehen||'a person').trim().replace(/[.\s]+$/,'');
      var k=(S.kleidung[i]||n.kleidung||'').trim().replace(/[.\s]+$/,'');
      figurenArr.push(a+(k?', wearing '+k:''));
    });
  }
  var figuren=figurenArr.join(' AND ');
  var figCount=figurenArr.length;
  var szene=(opts.szene||S.szeneText||(W.ort&&W.ort.bildPrompt)||'').trim();
  var setting=(S.szeneGlobal||'').trim().replace(/[.\s]+$/,'');
  var stimmungen=W.npcs.map(function(n,i){return anwesendNpc(i)?S.stimmung[i]:'';}).filter(Boolean).join(' and ');
  var anzahl=figCount>1
    ? (figCount+' distinct characters together in the scene, interacting')
    : (figCount===1?'single character in the foreground'
                   :'no people in frame, nobody visible, extreme close-up detail shot of an object');

  var sicht=(ichSicht||(figCount===0&&motiv==='ort'))
    ? ', first person point of view, seen through the eyes of the protagonist, the viewer is the protagonist, protagonist himself not visible'
    : '';
  var schwanz=', '+aktuellerStil()+', '+anzahl+sicht+', '+zeitFuerBild()+', comic panel composition, dramatic lighting, detailed background';
  var mitte=(setting?'. Setting: '+setting:'')+(szene?'. Scene: '+szene:'')+(stimmungen?', mood: '+stimmungen:'');
  // Ohne Figur beginnt der Prompt sonst mit einem Punkt.
  var ganz=(figuren?figuren:'an empty scene')+mitte+schwanz;
  if(!max||ganz.length<=max)return ganz;

  // Zu lang: Stil und Bildaufbau bleiben unangetastet, der Rest teilt sich den Platz.
  var frei=Math.max(80,max-schwanz.length);
  var figurAnteil=Math.floor(frei*0.55);
  if(figuren.length>figurAnteil)figuren=kuerzeText(figuren,figurAnteil);
  mitte=kuerzeText(mitte,Math.max(0,frei-figuren.length));
  return figuren+mitte+schwanz;
}
// ── BILDREGIE-BOT ─────────────────────────────
// Normalerweise faellt die Bildbeschreibung im selben KI-Aufruf ab wie die
// Dialogzeile (Feld "bild") - schnell und billig, aber die KI hat dabei den
// Kopf beim Reden. Ist der Bot eingeschaltet, fragt ein eigener Aufruf nur
// nach dem Bild: Er liest den letzten Verlauf und sagt, was zu sehen ist.
// Aussehen der Figuren, Stil und Bildaufbau kommen weiterhin aus bauePrompt --
// der Bot liefert nur die Szene, sonst wuerde er die Figuren jedes Mal neu
// erfinden.
var BILDBOT_MAX=320;
function letzteZeilen(n){
  var raus=[];
  for(var i=Math.max(0,S.verlauf.length-n);i<S.verlauf.length;i++){
    var v=S.verlauf[i];
    if(!v||!v.text)continue;
    raus.push((v.rolle==='ich'?(v.name||(W.protagonist&&W.protagonist.name)||'Held'):(v.name||'Figur'))+': '+v.text);
  }
  return raus.join('\n');
}
function baueBildRegieAnweisung(){
  var wer=anwesendeNpcs().map(function(i){
    var n=W.npcs[i];
    return (n.name||('Figur '+(i+1)))+(S.stimmung[i]?' ('+S.stimmung[i]+')':'');
  }).concat(heldAnwesend()?[heldName()]:[]).join(', ')||'niemand';
  return 'Du bist die Bildregie eines Comics. Lies den Ausschnitt und sage, WAS IN DIESEM MOMENT ZU SEHEN IST.\n\n'+
    'Schauplatz: '+((S.szeneGlobal||(W.ort&&W.ort.name)||'unbekannt'))+'\n'+
    (wer?'Anwesend: '+wer+'\n':'')+
    (S.handlung?'Bisher: '+kuerzeText(S.handlung,400)+'\n':'')+
    '\nLetzte Zuege:\n'+(letzteZeilen(4)||'(noch nichts gesprochen)')+'\n\n'+
    'Antworte mit EINEM englischen Satz, hoechstens 40 Woerter: Handlung, Koerperhaltung, Blickrichtung, '+
    'Kameraeinstellung (close-up, medium shot, wide shot) und Licht. '+
    'KEINE Namen, KEINE Beschreibung von Gesicht, Haaren oder Kleidung - die stehen schon fest. '+
    'Kein Bildstil, keine Anfuehrungszeichen, keine Erklaerung. Nur der Satz.';
}
// Die KI haengt gern Anfuehrungszeichen, Codebloecke oder ein "Sure!" davor.
function saeubereBildIdee(roh){
  var t=String(roh==null?'':roh).trim();
  t=t.replace(/^```[a-z]*\s*/i,'').replace(/```\s*$/,'').trim();
  t=t.split(/\n+/).filter(function(z){return z.trim();}).pop()||'';
  t=t.replace(/^(scene|image|prompt|bild|szene)\s*[:\-]\s*/i,'').trim();
  t=entkleide(t).trim().replace(/^[\s"'\u201c\u201e]+|[\s"'\u201d\u201c]+$/g,'');
  if(t.length>BILDBOT_MAX)t=kuerzeText(t,BILDBOT_MAX);
  return t;
}
async function bildRegie(){
  var tRegie=Date.now();
  try{
    var roh=await frageKI(baueBildRegieAnweisung(),45000);
    S.msRegie=Date.now()-tRegie;
    var idee=saeubereBildIdee(roh);
    return idee.length>=8?idee:null;
  }catch(e){
    // Faellt der Bot aus, uebernimmt die alte Methode - lieber ein Bild aus
    // der Dialogregie als gar keines.
    S.msRegie=Date.now()-tRegie;
    console.warn('Bildregie-Bot ohne Antwort:',e);
    return null;
  }
}
function baueNegativ(){
  var extra=STIL_NEGATIV[aktuellerStilSchluessel()];
  return CFG.negativ+(extra?', '+extra:'');
}
async function zeichneBild(opts){
  opts=opts||{};
  // Laeuft schon eines? Dann NICHT verwerfen, sondern vormerken —
  // sonst bleibt das Bild bei langsamen Diensten minutenlang stehen.
  if(S.bildLaeuft){ S.bildAusstehend=opts; return; }
  S.bildLaeuft=true;
  el('szenelade').classList.add('an');
  try{
    // Der Bot fragt nur, wenn nichts Konkreteres vorliegt: ein eigener Prompt,
    // ein Override oder eine von Hand gegebene Szene haben Vorrang.
    if(CFG.bildBot&&opts.promptOverride==null&&!S.eigenerPrompt&&!opts.szene){
      var idee=await bildRegie();
      if(idee){ S.szeneText=idee; opts=Object.assign({},opts,{szene:idee}); }
    }
    // Rangfolge: einmaliger Override → eigener Prompt (überdauert Quellenwechsel)
    // → automatisch aus der Szene gebaut.
    var max=quelle().maxPrompt;
    var prompt = (opts.promptOverride!=null) ? String(opts.promptOverride).trim()
               : (S.eigenerPrompt ? S.eigenerPrompt : bauePrompt(opts,max));
    if(max&&prompt.length>max)prompt=kuerzeText(prompt,max);   // greift nur bei eigenen Prompts
    var negativ= (opts.negativOverride!=null)?String(opts.negativOverride).trim():(S.eigenerNegativ||baueNegativ());
    var seed   = (opts.seedOverride!=null&&String(opts.seedOverride).trim()!=='')
                 ?(parseInt(opts.seedOverride,10)||S.seed)
                 :(S.seed||(S.seed=neuerSeed()));
    S.seed=seed;
    var tBild=Date.now();
    var guid=guidanceWert(opts.guidanceOverride);
    S.guidance=guid;
    var src=await quelle().zeichne({prompt:prompt,negativ:negativ,seed:seed,guidance:guid,
                                    breite:auf64(CFG.breite),hoehe:auf64(CFG.hoehe)});
    S.msBild=Date.now()-tBild;
    if(S.letzteBildUrl&&S.letzteBildUrl.indexOf('blob:')===0&&S.letzteBildUrl!==src){
      try{ URL.revokeObjectURL(S.letzteBildUrl); }catch(e1){}
    }
    el('img0').src=src;
    S.letzteBildUrl=src;
    if(!S.aktBild)S.aktBild=src;   // erstes Bild des Akts als Rueckfall-Anker
    S.bildGeneriert=true;
    S.letzterPrompt=prompt;
    S.letzterNegativ=negativ;
  }catch(e){
    if(typeof tBild==='number')S.msBild=Date.now()-tBild;
    var m=String((e&&e.message)||e);
    var gedrosselt=/HTTP 429/.test(m);
    // Ein erschöpftes Kontingent meldet nicht jeder Dienst als 429 — ZeroGPU
    // etwa schreibt es in die Antwort. Auch dann nicht weiter anklopfen.
    var kontingent=/zerogpu|quota|rate.?limit|exceeded|kontingent/i.test(m);
    if(!gedrosselt&&!kontingent&&istServerPanne(m)){
      S.bildPauseBis=Date.now()+90000;
      errZeile('⚠︎ '+quelle().label+' ist auf einen GPU-Fehler gelaufen — das passiert auf dem Server, '+
               'nicht in deiner Anfrage. Zweiter Anlauf ist schon gescheitert, daher 90s Pause. '+
               'Bleibt es dabei, ist der Space gerade defekt; Perchance zeichnet weiter.');
    }else if(gedrosselt||kontingent){
      var sek=gedrosselt?60:300, ra=m.match(/in (\d+)s/);
      if(ra)sek=Math.max(15,Math.min(600,parseInt(ra[1],10)||60));
      S.bildPauseBis=Date.now()+sek*1000;
      errZeile('⚠︎ '+quelle().label+(kontingent?' — Kontingent erschöpft':' drosselt (HTTP 429)')+
               '. Keine Bildanfragen für '+sek+'s. '+
               (/token/i.test(m)?'Ein Hugging-Face-Token im Feld „Token" (⚙︎) hebt das Kontingent deutlich an. ':'')+
               'Sonst: Bild-Takt in ⚙︎ erhöhen oder zurück auf Perchance.');
    }else{
      zeigeFehler('Bild ('+quelle().label+')',e);
    }
  }
  el('szenelade').classList.remove('an');
  S.bildLaeuft=false;
  if(S.bildAusstehend){ var n=S.bildAusstehend; S.bildAusstehend=null; zeichneBild(n); }
}

function befehlVerarbeitet(txt){
  for(var i=0;i<BEFEHLE.length;i++){
    var m=txt.match(BEFEHLE[i].muster);
    if(m){ BEFEHLE[i].fn(m); return true; }
  }
  return false;
}
// Zeigt, was die Regie zuletzt wirklich geantwortet hat, und was davon
// angekommen ist. Damit laesst sich unterscheiden: Feld fehlte, Feld war leer,
// oder die Antwort brach ab.
function zeigeRohantwort(){
  var roh=S.letzteRohantwort||'';
  if(!roh){ sysZeile('Noch keine Antwort der Regie da.'); return; }
  var j=jsonAus(roh);
  var felder=['wer','antwort','stimmung','weiter','auftritt','abgang','ortwechsel','kleidung','ortaenderung','bild','handlung','fakt'];
  var zeilen=felder.map(function(f){
    var wert=j?j[f]:undefined;
    var da=(wert!==undefined&&wert!==null&&String(wert).trim()!=='');
    return (da?'✓ ':(wert===undefined?'— ':'· '))+f+(da?': '+String(wert).substring(0,60):'');
  });
  var g=el('gespraech');
  var z=document.createElement('div');
  z.className='zeile hilfe';
  z.innerHTML='<div class="txt"><b>LETZTE ANTWORT DER REGIE</b><br>'+
    'Als JSON lesbar: '+(S.letzteJsonOk?'ja':'nein — der Zeilenparser hat übernommen')+'<br>'+
    'Kontext: '+(S.kurzKontext?'gekürzt (nach Zeitüberschreitung)':'normal')+'<br>'+
    'Länge: '+roh.length+' Zeichen'+(/\}\s*$/.test(roh.trim())?'':' · <b>endet nicht mit }</b> — vermutlich abgeschnitten')+'<br><br>'+
    zeilen.map(escapeHtml).join('<br>')+
    '<br><br><b>ORIGINAL</b><br>'+escapeHtml(roh.substring(0,900))+(roh.length>900?' …':'')+'</div>';
  g.appendChild(z);scrolle();
}
// Die Liste baut sich aus der Befehls-Registry auf: ein neuer Befehl steht

    'zum Beispiel <i>\x5Bich lege die Hand auf den Tisch\x5D Und jetzt?</i><br><br>'+
    'Läuft der <b>Auto-Modus</b>, wird jede Eingabe ohne Schrägstrich zur <b>stehenden Regie</b> '+
    'für die ganze Szene. Selbst sprechen kannst du dann mit <b>/sag:</b>.</div>'+
    '<div class="hilfeabschnitt">BEFEHLE</div>';
  BEFEHLE.forEach(function(b){
    h+='<div class="hilfezeile"><div class="hilfebefehl">'+escapeHtml(b.hilfe[0])+'</div>'+
       '<div class="hilfetext">'+escapeHtml(b.hilfe[1])+'</div></div>';
  });

function sendeFreitext(){
  var feld=el('freitext');
  var txt=feld.value.trim();
  if(!txt)return;
  if(befehlVerarbeitet(txt)){ feld.value=''; return; }
  if(S.autoAktiv){ feld.value=''; setzeAutoRegie(txt); return; }
  if(S.wartet)return;
  feld.value='';
  spielerSagt(txt);
}
function spielerSagt(txt){
  merkeSchnappschuss();
  var name=gespielterName();
  ichSage(txt,name);
  S.verlauf.push({rolle:'ich',text:txt,name:name});
  var versuch=CFG.wuerfel?wagnisAus(txt):'';
  if(versuch){
    S.probe=wuerfle(versuch,letzterNpcIdx());
    sysProbe(S.probe);
  }
  fuehreSchlagabtausch(-1);
}
function regieBefehl(idx,hintRaw){
  if(!S.imSpiel)return;
  var hint=entkleide(hintRaw);
  if(idx===W.npcs.length&&idx<MAX_NPCS){ erscheineNPC(hint); return; }   // naechste freie Nummer = neue Figur
  if(idx<0||idx>=W.npcs.length){ sysZeile('Diese Figur gibt es nicht (1 bis '+W.npcs.length+').'); return; }
  if(!hint){ sysZeile('/npc'+(idx+1)+': gib nach dem Doppelpunkt eine Regieanweisung an.'); return; }
  if(S.autoAktiv){
    S.regieAnweisung[idx]=hint;
    S.autoForceIdx=idx;
    sysZeile('❖ Regie an '+W.npcs[idx].name+': '+hint);
    autosave();
    return;
  }
  if(S.wartet){ sysZeile('— Bitte kurz warten —'); return; }
  merkeSchnappschuss();
  S.regieAnweisung[idx]=hint;
  sysZeile('❖ Regie an '+W.npcs[idx].name+': '+hint);
  fuehreSchlagabtausch(idx);
}
function kleidungBefehl(idx,outfitRaw){
  if(!S.imSpiel)return;
  if(idx<0||idx>=W.npcs.length){ sysZeile('Diese Figur gibt es nicht.'); return; }
  var outfit=entkleide(outfitRaw);
  if(!outfit){ sysZeile('/kleidung'+(idx+1)+': gib nach dem Doppelpunkt ein Outfit an.'); return; }
  S.kleidung[idx]=outfit;
  sysZeile('✦ Neues Outfit für '+W.npcs[idx].name+': '+outfit+' ✦');
  if(S.eigenerPrompt)sysZeile('Hinweis: Ein eigener Prompt ist aktiv, das Outfit wirkt erst nach „AUS SZENE" im Bildmenü.');
  autosave();
  zeichneBild({});
}
function bildBefehl(descRaw){
  if(!S.imSpiel)return;
  var beschreibung=entkleide(descRaw);
  if(!beschreibung){ sysZeile('/bild: gib nach dem Doppelpunkt eine Bildbeschreibung an.'); return; }
  S.szeneText=beschreibung;
  S.bildZaehler=0;
  S.eigenerPrompt='';S.eigenerNegativ='';S.promptFesthalten=false;   // ausdrueckliche Neubeschreibung schlaegt den eigenen Prompt
  sysZeile('✦ Neues Bild: '+beschreibung+' ✦');
  zeichneBild({szene:beschreibung});
}
function stilBefehl(raw){
  if(!S.imSpiel)return;
  var t=entkleide(raw);
  if(!t){
    var akt=S.stil?S.stilLabel:('Start-Auswahl ('+(el('stilwahl')?el('stilwahl').value:'?')+')');
    sysZeile('Aktueller Stil: '+akt+'. Presets: '+Object.keys(STILE).join(', ')+' — oder /stil: <eigener Text>.');
    return;
  }
  var key=t.toLowerCase();
  if(STILE[key]){ S.stil=STILE[key]; S.stilLabel=key; }
  else{ S.stil=t; S.stilLabel=t; }
  sysZeile('✦ Bildstil: '+S.stilLabel+' ✦');
  if(S.eigenerPrompt)sysZeile('Hinweis: Ein eigener Prompt ist aktiv, der Stil wirkt erst nach „AUS SZENE" im Bildmenü.');
  autosave();
  zeichneBild({});
}
function perspektiveBefehl(raw){
  if(!S.imSpiel)return;
  var t=entkleide(raw).toLowerCase();
  if(!t){
    sysZeile('Erzählweise: '+(W.perspektive==='ich'?'Ich-Perspektive (du siehst durch seine Augen)'
                                                   :'Er-Perspektive ('+W.protagonist.name+' ist im Bild)')+
             ' — umschalten mit /perspektive: ich  oder  /perspektive: er');
    return;
  }
  var neu=/^(ich|first|1|ego)/.test(t)?'ich':(/^(er|sie|third|3)/.test(t)?'er':'');
  if(!neu){ sysZeile('Unbekannt. Möglich: /perspektive: ich  oder  /perspektive: er'); return; }
  W.perspektive=neu;
  sysZeile(neu==='ich'?'✦ Ab jetzt durch deine Augen ✦':'✦ Ab jetzt aus der Beobachterperspektive ✦');
  autosave();
  zeichneBild({});
}
function quelleBefehl(raw){
  var t=entkleide(raw).toLowerCase();
  if(t&&BILDQUELLEN[t]){
    CFG.quelle=t;speichereCfg();
    sysZeile('✦ Bildquelle: '+BILDQUELLEN[t].label+' ✦');
    zeichneBild({});
    return;
  }
  if(t)sysZeile('Unbekannte Quelle. Möglich: '+Object.keys(BILDQUELLEN).join(', '));
  oeffneEinstellungen();
}

// ── UNDO / NOCHMAL ────────────────────────────
function merkeSchnappschuss(){
  S.rueckgaengig.push(JSON.stringify({
    verlauf:S.verlauf, stimmung:S.stimmung, kleidung:S.kleidung,
    handlung:S.handlung, fakten:S.fakten, szeneText:S.szeneText
  }));
  while(S.rueckgaengig.length>MAX_UNDO)S.rueckgaengig.shift();
}
function stelleZurueck(){
  var roh=S.rueckgaengig.pop();
  if(!roh)return null;
  var d=JSON.parse(roh);
  S.verlauf=d.verlauf;S.stimmung=d.stimmung;S.kleidung=d.kleidung;
  S.handlung=d.handlung;S.fakten=d.fakten;S.szeneText=d.szeneText;
  return d;
}
function undo(){
  if(!S.imSpiel)return;
  if(S.wartet){ sysZeile('— Bitte kurz warten —'); return; }
  if(!S.rueckgaengig.length){ sysZeile('Nichts mehr zurückzunehmen.'); return; }
  stelleZurueck();
  zeichneVerlaufNeu();
  sysZeile('⟲ Zug zurückgenommen.');
  autosave();
}
function nochmal(){
  if(!S.imSpiel)return;
  if(S.wartet){ sysZeile('— Bitte kurz warten —'); return; }
  if(!S.rueckgaengig.length){ sysZeile('Es gibt keinen Zug zum Wiederholen.'); return; }
  var vorher=JSON.parse(S.rueckgaengig[S.rueckgaengig.length-1]);
  // Letzte Spielereingabe suchen, um sie erneut zu senden.
  var letzte=null;
  for(var i=S.verlauf.length-1;i>=vorher.verlauf.length;i--){
    if(S.verlauf[i].rolle==='ich'){ letzte=S.verlauf[i].text; break; }
  }
  stelleZurueck();
  zeichneVerlaufNeu();
  sysZeile('⟲ Noch einmal…');
  if(letzte)spielerSagt(letzte);
  else fuehreSchlagabtausch(-1);
}
function zeichneVerlaufNeu(){
  tippenFertig();
  var g=el('gespraech');g.innerHTML='';
  S.verlauf.forEach(function(v){
    if(v.rolle==='npc')npcZeileSofort(v.idx,v.text,v.name); else ichSage(v.text,v.name);
  });
  zeigeStimmung();
  aktualisiereUI();
}

// ── FIGUREN AUFTRETEN / ABTRETEN ──────────────
// ── NEUE FIGUR ────────────────────────────────
// Der Knopf fuehrt zuerst in ein leeres Formular: Was der Spieler eintraegt,
// gilt unveraendert; die Luecken fuellt die KI. Wer nichts eintraegt, bekommt
// wie bisher eine frei erfundene Figur.
var NF_FELDER=['name','rolle','aussehen','kleidung','person','stimmung','beziehung','ziel','geheimnis','eroeffnung','hinweis'];
function oeffneNeueFigur(){
  if(!S.imSpiel)return;
  if(W.npcs.length>=MAX_NPCS){ sysZeile('Mehr als '+MAX_NPCS+' Personen werden hier nicht gleichzeitig gespielt.'); return; }
  NF_FELDER.forEach(function(k){ var e=el('nf_'+k); if(e)e.value=''; });
  oeffneModal('mNeueFigur');
}
function neueFigurVorgabe(){
  var v={};
  NF_FELDER.forEach(function(k){ var e=el('nf_'+k); v[k]=e?e.value.trim():''; });
  return v;
}
// Was der Spieler vorgegeben hat, in Worte fuer die Anweisung.
function vorgabeText(v){
  if(!v)return '';
  var zeilen=[];
  var namen={name:'Name',rolle:'Rolle',aussehen:'Aussehen (englisch)',kleidung:'Kleidung (englisch)',
             person:'Persoenlichkeit',stimmung:'Stimmung',beziehung:'Haltung zum Helden',
             ziel:'Was sie will',geheimnis:'Was sie verbirgt',eroeffnung:'Erster Satz'};
  Object.keys(namen).forEach(function(k){ if(v[k])zeilen.push('- '+namen[k]+': '+v[k]); });
  if(v.hinweis)zeilen.push('- Hinweis: '+v.hinweis);
  if(!zeilen.length)return '';
  return 'VORGABEN DES SPIELERS — diese Angaben sind verbindlich und werden WOERTLICH uebernommen. '+
    'Fuelle nur, was fehlt, und richte es nach den Vorgaben:\n'+zeilen.join('\n')+'\n';
}
// Vorgabe schlaegt KI: nur leere Felder werden von der Antwort gefuellt.
function mischeFigur(v,ki){
  var raus={};
  Object.keys(ki).forEach(function(k){ raus[k]=ki[k]; });
  if(!v)return raus;
  if(v.name)raus.name=v.name;
  if(v.rolle)raus.rolle=v.rolle;
  if(v.aussehen)raus.aussehen=v.aussehen;
  if(v.kleidung)raus.kleidung=v.kleidung;
  if(v.person)raus.person=v.person;
  if(v.stimmung)raus.grundstimmung=einWort(v.stimmung);
  if(v.ziel)raus.ziel=v.ziel;
  if(v.geheimnis)raus.geheimnis=v.geheimnis;
  if(v.eroeffnung)raus.eroeffnung=v.eroeffnung;
  return raus;
}
// Der gemeinsame Weg ins Spiel - mit KI erfunden oder von Hand eingetragen.
function figurEinfuegen(npc,bez,bezAndere){
  var idx=W.npcs.length;
  npc.aufgedeckt=false;
  W.npcs.push(npc);
  S.stimmung.push(npc.grundstimmung);
  S.kleidung.push(npc.kleidung);
  S.regieAnweisung.push('');
  S.raumNpc.push(kameraRaum());   // wer auftritt, tritt dort auf, wo gespielt wird
  if(bez)setzeBeziehung(npc.name,heldName(),bez);
  if(bezAndere)uebernimmBeziehungen(bezAndere,npc.name);
  sysZeile('— '+npc.name+' erscheint —');
  npcSagt(idx,npc.eroeffnung);
  S.verlauf.push({rolle:'npc',idx:idx,text:npc.eroeffnung,name:npc.name});
  merkeFakt(npc.name+' ist am Ort dazugekommen ('+npc.rolle+').');
  aktualisiereUI();
  S.bildZaehler=0;
  return idx;
}
function neueFigurUebernehmen(mitKi){
  var v=neueFigurVorgabe();
  schliesseModal();
  if(mitKi){ erscheineNPC(v.hinweis,false,v); return; }
  if(W.npcs.length>=MAX_NPCS){ sysZeile('Mehr als '+MAX_NPCS+' Personen werden hier nicht gleichzeitig gespielt.'); return; }
  var npc={
    name:         v.name||'Ein Fremder',
    rolle:        v.rolle||'Gast',
    aussehen:     v.aussehen||'an adult with a memorable face',
    kleidung:     v.kleidung||'simple clothing',
    person:       v.person||'zurueckhaltend',
    grundstimmung:einWort(v.stimmung||'neugierig'),
    ziel:         v.ziel||'',
    geheimnis:    v.geheimnis||'',
    eroeffnung:   v.eroeffnung||'\x5Btritt ein\x5D Störe ich?'
  };
  figurEinfuegen(npc,v.beziehung,'');
  autosave();
  zeichneBild({});
}
async function erscheineNPC(hint,still,vorgabe){
  if(!S.imSpiel)return;
  if(W.npcs.length>=MAX_NPCS){ sysZeile('Mehr als '+MAX_NPCS+' Personen werden hier nicht gleichzeitig gespielt.'); return; }
  if(S.npcErscheint||(S.wartet&&!still)){ if(!still)sysZeile('— Bitte kurz warten —'); return; }
  hint=entkleide(hint);
  S.npcErscheint=true;
  if(!still)setWartet(true);
  var anwesend=W.npcs.map(function(n){return n.name+' ('+n.rolle+')';}).join(', ');
  var instruction=
    'Erfinde spontan eine WEITERE Person, die JETZT am Ort dazustoesst, passend zur Situation.\n\n'+
    weltKontext()+
    'ORT: '+W.ort.name+' — '+W.ort.geschichte+'\n'+
    'BEREITS ANWESEND: '+anwesend+'.\n'+
    'BISHERIGES GESCHEHEN:\n'+verlaufText(10)+'\n'+
    (hint?'VORGABE fuer die neue Person: '+hint+'\n':'')+
    vorgabeText(vorgabe)+
    '\nAntworte NUR mit einem JSON-Objekt, ohne Codeblock:\n'+
    '{"name":"","rolle":"","aussehen":"constant English visual IDENTITY only, no clothing, no art style","kleidung":"english default outfit","person":"deutscher Satz, warm, frech, frivol, aber respektvoll","stimmung":"EIN deutsches Wort","ziel":"was sie hier fuer sich erreichen will, ein deutscher Satz","geheimnis":"was sie verbirgt, ein deutscher Satz","beziehung":"Haltung dieser Person zum Helden in ein bis drei deutschen Woertern","beziehungen":"Haltung zu den bereits Anwesenden, Format Name: Haltung; Name: Haltung, sonst leer","eroeffnung":"erster deutscher Satz beim Hereinkommen, Handlungen in eckigen Klammern erlaubt"}';
  try{
    var text=await frageKI(instruction);
    var j=jsonAus(text), z=j?null:felderAus(text);
    var f=function(k,flach,ersatz){ return j?hole(j,[k],ersatz):(z[flach]||ersatz); };
    var npc=mischeFigur(vorgabe,{
      name:         f('name','NAME','Ein Fremder'),
      rolle:        f('rolle','ROLLE','Bewohner'),
      aussehen:     f('aussehen','AUSSEHEN','an adult with a memorable face'),
      kleidung:     f('kleidung','KLEIDUNG','simple clothing'),
      person:       f('person','PERSON','zurueckhaltend'),
      grundstimmung:einWort(f('stimmung','STIMMUNG','neugierig')),
      ziel:         f('ziel','ZIEL',''),
      geheimnis:    f('geheimnis','GEHEIMNIS',''),
      eroeffnung:   f('eroeffnung','EROEFFNUNG','\x5Btritt ein\x5D Störe ich?')
    });
    var idx=figurEinfuegen(npc,
      (vorgabe&&vorgabe.beziehung)||f('beziehung','BEZIEHUNG',''),
      f('beziehungen','BEZIEHUNGEN',''));
    S.npcErscheint=false;
    if(!still)setWartet(false);
    // Aus der Handlung heraus: keine zusaetzliche Runde ausloesen, die laeuft schon.
    if(hint&&!still){ S.regieAnweisung[idx]=hint; await fuehreSchlagabtausch(idx); }
    zeichneBild({});
  }catch(e){
    S.npcErscheint=false;if(!still)setWartet(false);
    zeigeFehler('Figur erscheinen',e);
  }
}
function entferneNPC(idx){
  if(!S.imSpiel)return;
  if(W.npcs.length<2){ sysZeile('Mindestens eine Person muss bleiben.'); return; }
  if(idx<0||idx>=W.npcs.length)return;
  var name=W.npcs[idx].name;
  // Verlauf: Namen einfrieren, Indizes nachziehen.
  S.verlauf.forEach(function(v){
    if(v.rolle==='npc'){
      if(v.name==null)v.name=(W.npcs[v.idx]&&W.npcs[v.idx].name)||'NPC';
      if(v.idx===idx)v.idx=-1;
      else if(v.idx>idx)v.idx=v.idx-1;
    }
  });
  W.npcs.splice(idx,1);
  S.stimmung.splice(idx,1);
  S.kleidung.splice(idx,1);
  S.regieAnweisung.splice(idx,1);
  if(Array.isArray(S.raumNpc))S.raumNpc.splice(idx,1);
  // Wer die gespielte Figur entfernt, spielt wieder den Helden.
  if(S.spieltIdx===idx){ S.spieltIdx=null; sysZeile('— Du spielst wieder '+heldName()+' —'); }
  else if(S.spieltIdx!=null&&S.spieltIdx>idx)S.spieltIdx--;
  setzeKamera();
  S.autoForceIdx=null;
  beziehungenAufraeumen();
  merkeFakt(name+' hat den Ort verlassen.');
  sysZeile('— '+name+' geht —');
  aktualisiereUI();
  autosave();
  zeichneBild({});
}

// ── DIALOG-AUSGABE ────────────────────────────
function neueZeile(klasse,werText){
  var g=el('gespraech');
  var z=document.createElement('div');
  z.className='zeile '+klasse;
  z.innerHTML=(werText?'<div class="wer">'+escapeHtml(String(werText).toUpperCase())+'</div>':'')+'<div class="txt"></div>';
  g.appendChild(z);
  return z;
}
function npcName(idx,name){ return name||(W.npcs[idx]&&W.npcs[idx].name)||'NPC'; }
function npcSagt(idx,text,name){
  var z=neueZeile('npc',npcName(idx,name));
  tippe(z.querySelector('.txt'),text);
  scrolle();
}
function npcZeileSofort(idx,text,name){
  var z=neueZeile('npc',npcName(idx,name));
  z.querySelector('.txt').innerHTML=formatAktionen(text);
}
// Der Mensch spricht - unter seinem Namen, und das ist nicht immer der Held.
function ichSage(text,name){
  var z=neueZeile('ich',name||gespielterName());
  z.querySelector('.txt').innerHTML=formatAktionen(text);
  scrolle();
}
function sysZeile(text){
  var z=neueZeile('sys','');
  z.querySelector('.txt').innerHTML=escapeHtml(text);
  scrolle();
}
function errZeile(text){
  var z=neueZeile('err','');
  z.querySelector('.txt').innerHTML=escapeHtml(text);
  scrolle();
}
// Schreibmaschine: immer nur EINE laufende Animation, und die vorherige Zeile
// wird sauber fertiggestellt statt halb getippt stehenzubleiben.
function tippe(elem,text){
  tippenFertig();
  if(!CFG.tempo){ elem.innerHTML=formatAktionen(text); scrolle(); return; }
  var i=0;
  tipper={el:elem,text:text,timer:null};
  tipper.timer=setInterval(function(){
    if(i<text.length){ elem.textContent+=text[i++]; scrolle(); }
    else{ tippenFertig(); }
  },CFG.tempo);
}
function tippenFertig(){
  if(!tipper)return;
  clearInterval(tipper.timer);
  tipper.el.innerHTML=formatAktionen(tipper.text);
  tipper=null;
  scrolle();
}
function scrolle(){ var g=el('gespraech'); if(g)g.scrollTop=g.scrollHeight; }
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function formatAktionen(s){ return escapeHtml(s).replace(/\[([^\]]*)\]/g,'<span class="aktion">[$1]</span>'); }
function setWartet(b){
  S.wartet=b;
  el('sendBtn').disabled=b;
  el('freitext').disabled=b;
  el('gespraech').setAttribute('aria-busy',b?'true':'false');
  var g=el('gespraech'), alt=el('tippt');
  if(b){
    if(!alt){ var d=document.createElement('div'); d.id='tippt'; d.textContent='…'; g.appendChild(d); scrolle(); }
  }else if(alt){ alt.remove(); }
}

// ── UI-AKTUALISIERUNG ─────────────────────────
function aktualisiereUI(){
  zeigeStimmung();
  zeichneKopfSchalter();
  var npcbtn=el('npcbtn');
  if(npcbtn)npcbtn.style.display=(S.imSpiel&&W.npcs.length<MAX_NPCS)?'block':'none';
  var undobtn=el('undobtn');
  if(undobtn)undobtn.disabled=!S.rueckgaengig.length;
  var a=el('autobtn');
  if(a){
    a.classList.toggle('an',!!S.autoAktiv);
    a.textContent=S.autoAktiv?'■ AUTO':'▶︎ AUTO';
  }
  var f=el('freitext');
  if(f)f.placeholder=S.autoAktiv
    ? 'Regie (gilt dauerhaft)   ·   /sag: selbst sprechen   ·   /hilfe'
    : ((S.spieltIdx!=null?('Du bist '+gespielterName()+'   ·   '):'')+
       'Sprich oder handle in \x5Beckigen Klammern\x5D   ·   /hilfe');
  baueChronikNav();
}
// Kopfleiste ein-/ausklappen. Der Schalter bleibt sichtbar, damit sie
// zurueckgeholt werden kann; der Zustand ueberlebt den Neustart.
function kopfUmschalten(){
  CFG.kopfOffen=!CFG.kopfOffen;
  speichereCfg();
  zeichneKopfSchalter();
}
function zeichneKopfSchalter(){
  var k=el('kopf'), b=el('kopfschalter');
  if(!k||!b)return;
  k.classList.toggle('zu',!CFG.kopfOffen);
  b.textContent=CFG.kopfOffen?'⌃':'⌄';
  b.title=CFG.kopfOffen?'Kopfleiste einklappen':'Kopfleiste ausklappen';
  b.setAttribute('aria-expanded',CFG.kopfOffen?'true':'false');
}
function zeigeStimmung(){
  var e=el('npcstatus'); if(!e)return;
  e.innerHTML='';
  var zeigeWeg=(W.npcs.length>=2);
  // Wer den Raum verlassen hat, bleibt sichtbar in der Leiste - aber blass und
  // mit dem Raum dahinter, damit klar ist, dass er gerade nicht dabei ist.
  if(!heldAnwesend()){
    var hchip=document.createElement('span');
    hchip.className='npcchip fern'+(S.spieltIdx==null?' duselbst':'');
    hchip.appendChild(document.createTextNode(heldName()+' ('+raumName(raumVonHeld())+')'));
    e.appendChild(hchip);
  }
  W.npcs.forEach(function(n,i){
    var fern=!anwesendNpc(i);
    var chip=document.createElement('span');
    chip.className='npcchip'+(fern?' fern':'')+(S.spieltIdx===i?' duselbst':'');
    chip.appendChild(document.createTextNode(
      (S.spieltIdx===i?'◉ ':'')+n.name+
      (fern?(' ('+raumName(raumVonNpc(i))+')'):(' ('+n.rolle+', '+S.stimmung[i]+')'))));
    if(zeigeWeg){
      var x=document.createElement('span');x.className='npcweg';x.textContent='✕';
      x.title=n.name+' entfernen';
      x.onclick=function(){entferneNPC(i);};
      chip.appendChild(x);
    }
    e.appendChild(chip);
  });
}

// ── MODAL-VERWALTUNG (ein Bauplan für alle) ───
function oeffneModal(id){
  document.querySelectorAll('.modal.an').forEach(function(m){m.classList.remove('an');});
  el(id).classList.add('an');
}
function schliesseModal(){
  document.querySelectorAll('.modal.an').forEach(function(m){m.classList.remove('an');});
}
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape')schliesseModal();
});
// Scheitert etwas ausserhalb unserer Aufrufkette — etwa im Text-Plugin selbst —,
// landet die Meldung sonst nur in Perchances Fehlerkasten. Lieber im Spiel zeigen.
if(typeof window!=='undefined'&&window.addEventListener){
  window.addEventListener('unhandledrejection',function(ev){
    var g=(ev&&ev.reason)||{};
    var text=String(g.message||g);
    if(kiNochNichtBereit(g)){
      errZeile('⚠︎ Das Text-Plugin war kurz nicht bereit. Wenn nichts weitergeht: Seite neu laden.');
    }else{
      errZeile('⚠︎ '+text);
    }
    if(ev.preventDefault)ev.preventDefault();
  });
}
document.querySelectorAll('.modal').forEach(function(m){
  m.addEventListener('click',function(ev){ if(ev.target===m)schliesseModal(); });
});

// ── CHRONIK ───────────────────────────────────
function baueChronikNav(){
  var nav=el('chronikNav'); if(!nav)return;
  nav.innerHTML='';
  var b0=document.createElement('button');b0.textContent='ORT';
  b0.onclick=function(){zeigeChronik('ort');};nav.appendChild(b0);
  var b1=document.createElement('button');b1.textContent='HANDLUNG';
  b1.onclick=function(){zeigeChronik('handlung');};nav.appendChild(b1);
  var bm=document.createElement('button');bm.textContent='MISSION';
  bm.onclick=function(){zeigeChronik('mission');};nav.appendChild(bm);
  var bb=document.createElement('button');bb.textContent='BEZIEHUNGEN';
  bb.onclick=function(){zeigeChronik('beziehungen');};nav.appendChild(bb);
  W.npcs.forEach(function(n,i){
    var b=document.createElement('button');b.textContent=n.name;
    b.onclick=function(){zeigeChronik(i);};nav.appendChild(b);
  });
}
function zeigeChronik(ziel){
  if(!S.imSpiel)return;
  baueChronikNav();
  var kopf=el('chronikTitel'), inhalt=el('chronikInhalt');
  inhalt.style.whiteSpace=(ziel==='handlung')?'pre-wrap':'normal';
  if(ziel==='ort'){
    kopf.innerHTML=sym('chronik')+' '+((W.ort&&W.ort.name)||'Ort').toUpperCase();
    inhalt.textContent=((W.ort&&W.ort.geschichte)||'Keine Aufzeichnungen.')+
      (S.szeneGlobal?'\n\nKulisse: '+S.szeneGlobal:'');
    inhalt.style.whiteSpace='pre-wrap';
  }else if(ziel==='handlung'){
    kopf.innerHTML=sym('chronik')+' HANDLUNG';
    var t=(S.handlung||'Noch nichts geschehen.');
    if(S.fakten.length)t+='\n\n• '+faktenTexte().join('\n• ');
    inhalt.textContent=t;
  }else if(ziel==='mission'){
    kopf.innerHTML=sym('mission')+' MISSION';
    inhalt.style.whiteSpace='pre-wrap';
    inhalt.textContent=(W.mission||'Für diese Geschichte wurde kein Ziel gesetzt.')+
      (S.aktZiel?'\n\nAkt '+(S.akt||1)+': '+S.aktZiel:'')+
      (S.akteVorbei&&S.akteVorbei.length?'\n\nErledigt:\n• '+S.akteVorbei.join('\n• '):'')+
      (S.missionStand?'\n\nStand: '+S.missionStand:'\n\nNoch nichts geschehen.');
    var bearbeiten=document.createElement('button');
    bearbeiten.className='haupt';
    bearbeiten.textContent=W.mission?'✎ BEARBEITEN':'✦ ZIEL SETZEN';
    bearbeiten.onclick=function(){ schliesseModal(); oeffneMissionMenu(); };
    el('chronikNav').appendChild(bearbeiten);
  }else if(ziel==='beziehungen'){
    kopf.innerHTML=sym('chronik')+' BEZIEHUNGEN';
    inhalt.style.whiteSpace='pre-wrap';
    beziehungenAufraeumen();
    var zeilen=W.npcs.map(function(x){
      var ziele=[heldName()].concat(W.npcs.map(function(a){return a.name;}).filter(function(nm){return nm!==x.name;}));
      return x.name+'\n'+ziele.map(function(zn){
        return '   → '+zn+': '+(beziehungZu(x.name,zn)||'noch unbestimmt');
      }).join('\n');
    });
    inhalt.textContent=zeilen.length?zeilen.join('\n\n'):'Noch niemand da.';
  }else{
    var n=W.npcs[ziel];
    if(!n)return;
    kopf.innerHTML=sym('chronik')+' '+(n.name||'NPC').toUpperCase();
    beziehungenAufraeumen();
    var zieleN=[heldName()].concat(W.npcs.map(function(a){return a.name;}).filter(function(nm){return nm!==n.name;}));
    inhalt.style.whiteSpace='pre-wrap';
    inhalt.textContent=n.rolle+'. '+n.person+'  (Stimmung: '+S.stimmung[ziel]+', trägt: '+(S.kleidung[ziel]||n.kleidung)+')'+
      (n.geheimnis?'\n\n'+(n.aufgedeckt?'Hat preisgegeben: '+n.geheimnis:'Verbirgt etwas — noch nicht heraus.'):'')+
      '\n\nHaltung gegenüber:\n'+zieleN.map(function(zn){
        return '   → '+zn+': '+(beziehungZu(n.name,zn)||'noch unbestimmt');
      }).join('\n');
  }
  oeffneModal('mChronik');
}

// Die Wahl gilt dauerhaft, bis sie wieder auf "automatisch" steht.
function motivGewechselt(){
  var mo=el('bildMotiv');
  if(!mo)return;
  S.motiv=motivSchluessel(mo.value);
  sysZeile('❖ Bildmotiv: '+(S.motiv?MOTIVE[S.motiv]:'automatisch'));
  autosave();
}
function oeffneBildModal(){
  if(!S.imSpiel)return;
  if(!S.bildGeneriert&&!S.letzterPrompt&&!S.eigenerPrompt){ sysZeile('Das erste Bild entsteht gerade…'); return; }
  el('bildPromptFeld').value=S.eigenerPrompt||S.letzterPrompt||'';
  el('bildNegativFeld').value=S.eigenerNegativ||S.letzterNegativ||baueNegativ();
  el('bildSeedFeld').value=S.seed||'';
  el('bildGuidanceFeld').value=guidanceWert();
  el('bildGuidanceHinweis').textContent=guidanceHinweis();
  el('bildFest').checked=!!S.promptFesthalten;
  var mo=el('bildMotiv');
  if(mo)mo.value=motivSchluessel(S.motiv)||'';
  fuelleStilWahl();
  el('bildQuelleInfo').textContent=(S.eigenerPrompt
      ? (S.promptFesthalten
         ? '✎ Prompt festgehalten — das Bild bleibt so, bis du den Haken entfernst oder „AUS SZENE" drückst. '
         : '✎ Eigener Prompt — er überlebt den Wechsel der Bildquelle, beim nächsten Bildtakt übernimmt aber wieder die Handlung. ')
      : 'Automatisch aus der Szene gebaut. ')
    +'Quelle: '+quelle().label+' — '+quelle().info+
    (S.msBild?('  Letztes Bild: '+sekunden(S.msBild)+' (/tempo zeigt mehr).'):'');
  oeffneModal('mBild');
}
function wuerfelSeed(){ el('bildSeedFeld').value=String(neuerSeed()); }
function guidanceGeaendert(){
  var e=el('bildGuidanceHinweis');
  if(e)e.textContent=guidanceHinweis(el('bildGuidanceFeld').value);
}
function guidanceZurueck(){
  el('bildGuidanceFeld').value=GUIDANCE_STD;
  el('bildGuidanceHinweis').textContent=guidanceHinweis(GUIDANCE_STD);
}
// Der Hinweis sagt zweierlei: was der Wert bewirkt, und ob die eingestellte
// Quelle ihn ueberhaupt beachtet.
function guidanceHinweis(roh){
  var v=guidanceWert(roh);
  var wirkung=(v<=4)?'sehr frei — der Dienst darf weit vom Prompt abweichen, weiche Bilder'
            :(v<=6)?'locker — mehr eigene Handschrift des Modells'
            :(v<=9)?'ausgewogen — die übliche Wahl'
            :(v<=14)?'streng — hält sich eng an den Prompt, Farben werden härter'
            :'sehr streng — meist überzeichnet und verbrannt';
  var k=CFG.quelle;
  var beachtet=(k==='horde')?'AI Horde setzt ihn als cfg_scale.'
             :(k==='gradio')?'Beim Gradio-Space wirkt er nur, wenn {guidance} in der Parameter-Vorlage steht.'
             :(k==='url')?'Bei der eigenen URL wirkt er nur, wenn {guidance} in der Vorlage steht.'
             :'Diese Bildquelle kennt keine Guidance — der Wert bleibt hier ohne Wirkung.';
  return v+': '+wirkung+' · '+beachtet;
}
function bildNeuZeichnen(){
  if(!S.imSpiel)return;
  if(uebernehmeStil())sysZeile('✦ Stil: '+(S.stilLabel||'unverändert')+' ✦');
  var p=el('bildPromptFeld').value.trim();
  var n=el('bildNegativFeld').value.trim();
  var s=el('bildSeedFeld').value.trim();
  var g=el('bildGuidanceFeld').value.trim();
  // Bearbeitung festhalten, statt sie beim naechsten automatischen Bild oder
  // beim Wechsel der Bildquelle zu verlieren.
  S.eigenerPrompt=p;
  S.eigenerNegativ=(n&&n!==baueNegativ())?n:'';
  S.promptFesthalten=!!(el('bildFest')&&el('bildFest').checked);
  schliesseModal();
  autosave();
  zeichneBild({seedOverride:s,guidanceOverride:g});
}
// Zurueck zur Automatik: Prompt und Negativprompt entstehen wieder aus der Szene.
function bildAusSzene(){
  if(!S.imSpiel)return;
  if(uebernehmeStil())sysZeile('✦ Stil: '+(S.stilLabel||'unverändert')+' ✦');
  S.eigenerPrompt='';S.eigenerNegativ='';S.promptFesthalten=false;
  schliesseModal();
  sysZeile('✦ Bild folgt wieder der Szene ✦');
  autosave();
  zeichneBild({});
}
function bildOeffnen(){
  if(!S.letzteBildUrl)return;
  try{ window.open(S.letzteBildUrl,'_blank'); }catch(e){ zeigeFehler('Bild öffnen',e); }
}

  var werte=[];

    werte.push({id:id,value:(value==null?'':String(value))});
    return '<label class="feldlabel" for="'+id+'">'+escapeHtml(label)+'</label>'+
      (multi?'<textarea id="'+id+'" class="feld" rows="2"></textarea>':'<input id="'+id+'" class="feld" type="text">');
