    return '<option value="'+k+'"'+sel+'>'+(k?GESCHLECHTER[k].label:'nicht festgelegt')+'</option>';
  }).join('');
  var html='<div class="figblock"><div class="figtitel">HELD</div>'+
    '<label class="feldlabel"><input type="checkbox" id="fig_rolle_held" onchange="rolleWaehlen(\'held\')"'+
    (S.spieltIdx==null?' checked':'')+'> Diese Rolle spiele ich</label>'+
    (heldBlatt?'<img src="'+heldBlatt+'" alt="Charakterblatt" style="width:120px;max-width:40%;border:1px solid var(--border);display:block;margin:0 0 8px;">':'')+
    '<div class="reihe"><button onclick="zeichneBlatt(\'held\')" title="Porträt des Helden erzeugen">✎ '+(heldBlatt?'BLATT NEU':'CHARAKTERBLATT')+'</button></div>'+
    feld('fig_held_name','Name',P.name,false)+
    '<label class="feldlabel" for="fig_held_geschlecht">Geschlecht</label>'+
    '<select id="fig_held_geschlecht" class="feld">'+gwahl+'</select>'+
    feld('fig_held_herkunft','Herkunft',P.herkunft,false)+
    feld('fig_held_beruf','Beruf',P.beruf,false)+
    feld('fig_held_eigenart','Eigenart',P.eigenart,true)+
    feld('fig_held_aussehen','Aussehen (englisch, nur wenn der Held im Bild erscheinen soll)',P.aussehen,true)+
    feld('fig_held_kleidung','Kleidung (englisch)',P.kleidung,true)+
    '</div>';
  W.npcs.forEach(function(n,i){
    var blatt=blattLesen(n.name);
    html+='<div class="figblock"><div class="figtitel">'+escapeHtml(n.name||('NPC'+(i+1)))+
      ' <span style="color:var(--dim);letter-spacing:0.06em">· '+escapeHtml(raumName(raumVonNpc(i)))+'</span></div>'+
      '<label class="feldlabel"><input type="checkbox" id="fig_rolle_npc'+i+'" onchange="rolleWaehlen('+i+')"'+
      (S.spieltIdx===i?' checked':'')+'> Diese Rolle spiele ich</label>'+
      (blatt?'<img src="'+blatt+'" alt="Charakterblatt" style="width:120px;max-width:40%;border:1px solid var(--border);display:block;margin:0 0 8px;">':'')+
      '<div class="reihe"><button onclick="zeichneBlatt('+i+')" title="Porträt mit eigenem Seed erzeugen">✎ '+(blatt?'BLATT NEU':'CHARAKTERBLATT')+'</button></div>'+
      feld('fig_npc'+i+'_name','Name',n.name,false)+
      feld('fig_npc'+i+'_rolle','Rolle',n.rolle,false)+
      feld('fig_npc'+i+'_stimmung','Stimmung (ein Wort)',S.stimmung[i]||n.grundstimmung,false)+
      feld('fig_npc'+i+'_person','Persönlichkeit / Sprechweise',n.person,true)+
      feld('fig_npc'+i+'_aussehen','Aussehen (englisch, nur Identität)',n.aussehen,true)+
      feld('fig_npc'+i+'_kleidung','Kleidung (englisch)',S.kleidung[i]||n.kleidung,true)+
      '</div>';
  });
  el('figurInhalt').innerHTML=html;
  werte.forEach(function(w){ var e=el(w.id); if(e)e.value=w.value; });
  oeffneModal('mFigur');
}
// Standardmaessig spielt der Mensch den Helden. Setzt er den Haken auf eine
// Figur, spricht und handelt er als diese - und der Held antwortet von selbst.
function rolleWaehlen(was){
  var neu=(was==='held')?null:Number(was);
  if(neu!=null&&!(neu>=0&&neu<W.npcs.length))return;
  S.spieltIdx=neu;
  // Die Kaestchen verhalten sich wie Radioknoepfe: nur eines bleibt an.
  var e=el('fig_rolle_held');
  if(e)e.checked=(neu==null);
  W.npcs.forEach(function(n,i){
    var b=el('fig_rolle_npc'+i);
    if(b)b.checked=(neu===i);
  });
  var kameraZog=setzeKamera();
  sysZeile('— Du spielst jetzt: '+gespielterName()+' —');
  if(kameraZog){ zeigeRaumtitel(); S.bildZaehler=0; }
  aktualisiereUI();
  autosave();
  if(kameraZog)zeichneBild({});
}
function speichereFiguren(){
  function g(id){ var e=el(id); return e?e.value.trim():''; }
  var P=W.protagonist;
  P.name=g('fig_held_name')||P.name;
  P.herkunft=g('fig_held_herkunft')||P.herkunft;
  P.beruf=g('fig_held_beruf')||P.beruf;
  P.eigenart=g('fig_held_eigenart')||P.eigenart;
  var gs=el('fig_held_geschlecht');
  if(gs){ P.geschlecht=geschlechtSchluessel(gs.value); CFG.geschlecht=P.geschlecht; speichereCfg(); }
  P.aussehen=g('fig_held_aussehen');   // leer erlaubt: dann erscheint der Held nicht im Bild
  P.kleidung=g('fig_held_kleidung');
  W.npcs.forEach(function(n,i){
    n.name=g('fig_npc'+i+'_name')||n.name;
    n.rolle=g('fig_npc'+i+'_rolle')||n.rolle;
    n.person=g('fig_npc'+i+'_person')||n.person;
    n.aussehen=g('fig_npc'+i+'_aussehen')||n.aussehen;
    var kl=g('fig_npc'+i+'_kleidung'); if(kl){ S.kleidung[i]=kl; n.kleidung=kl; }
    var st=g('fig_npc'+i+'_stimmung'); if(st){ S.stimmung[i]=einWort(st); }
  });
  schliesseModal();
  aktualisiereUI();
  autosave();
  zeichneBild({});
}

// ── SZENEN-MENÜ ───────────────────────────────
// Dieselbe Stilauswahl wie auf dem Startbildschirm, nur im laufenden Spiel.
var STIL_NAMEN={manga:'Manga / Anime',comic:'Westlicher Comic',aquarell:'Aquarell',
                oel:'Ölgemälde',realistisch:'Fotorealistisch',pixel:'Pixel-Art',
                illustrious:'Illustrious / Anime-Tags'};
// Der Bildstil stand frueher in einem eigenen Fenster. Er gehoert zum Bild,
// also steht er jetzt oben im Bildmenue — ein Fenster statt zwei.
function fuelleStilWahl(){
  var sel=el('szeneStil');
  if(!sel)return;
  sel.innerHTML='';
  Object.keys(STILE).forEach(function(k){
    var o=document.createElement('option');
    o.value=k;o.textContent=STIL_NAMEN[k]||k;
    sel.appendChild(o);
  });
  var oe=document.createElement('option');
  oe.value='eigen';oe.textContent='Eigener Stil…';
  sel.appendChild(oe);

  // Vorbelegen: gesetzter Stil, sonst eigener Text, sonst die Startauswahl.
  var eigen=el('szeneStilEigen');
  if(S.stilLabel&&STILE[S.stilLabel]){
    sel.value=S.stilLabel;eigen.value='';
    STIL_ZULETZT.szeneStil=S.stilLabel;
  }else if(S.stil){
    sel.value='eigen';eigen.value=S.stilLabel||S.stil;
  }else{
    var start=el('stilwahl');
    sel.value=(start&&STILE[start.value])?start.value:'manga';
    eigen.value='';
    STIL_ZULETZT.szeneStil=sel.value;
  }
  szeneStilGewechselt();
  el('szeneStilHinweis').textContent=S.eigenerPrompt
    ? 'Ein eigener Prompt ist aktiv — der Stil greift erst, wenn du unten „AUS SZENE" drückst.'
    : '';
}
// Alter Name, damit /stil ohne Text und aeltere Aufrufe weiter greifen.
function oeffneSzeneMenu(){ oeffneBildModal(); }
function szeneStilGewechselt(){ stilFeldPflegen('szeneStil','szeneStilEigen',false); }
// Liest die Stilwahl aus dem Bildmenue. Gibt zurueck, ob sich etwas geaendert
// hat — dann meldet der Aufrufer es in der Dialogzeile.
function uebernehmeStil(){
  var sel=el('szeneStil');
  if(!sel)return false;
  var vorher=S.stilLabel;
  var wahl=sel.value;
  if(wahl==='eigen'){
    var t=el('szeneStilEigen').value.trim();
    if(t){ S.stil=t; S.stilLabel=t; }
  }else if(STILE[wahl]){
    S.stil=STILE[wahl];S.stilLabel=wahl;
  }
  return S.stilLabel!==vorher;
}

// ── RÄUME UND ROLLEN ──────────────────────────
// Bisher gab es EINEN Ort und alle standen darin. Jetzt hat jede Figur einen
// Raum. Die Kamera haengt an der Figur, die der Mensch am Bildschirm spielt -
// verlaesst sie den Raum, geht das Bild mit. Wer woanders ist, bleibt im Spiel,
// ist aber weder zu sehen noch zu hoeren.
var MAX_RAEUME=12;

function raumListe(){
  if(!Array.isArray(W.raeume)||!W.raeume.length){
    W.raeume=[W.ort||{name:'Ein Ort',geschichte:'',bildPrompt:'',kulisse:''}];
  }
  return W.raeume;
}
function raumName(k){
  var r=raumListe()[k];
  return (r&&r.name)||'Ein Ort';
}
// Wer spielt gerade? null = der Held, sonst der Index einer Figur.
function gespielteFigur(){
  return (S.spieltIdx==null)?null:(W.npcs[S.spieltIdx]||null);
}
function gespielterName(){
  var f=gespielteFigur();
  return f?f.name:heldName();
}
function raumVonHeld(){ return (typeof S.raumHeld==='number')?S.raumHeld:0; }
function raumVonNpc(i){ return (typeof S.raumNpc[i]==='number')?S.raumNpc[i]:0; }
// Der Raum, in dem gespielt wird - und damit der, den die Kamera zeigt.
function kameraRaum(){
  return (S.spieltIdx==null)?raumVonHeld():raumVonNpc(S.spieltIdx);
}
// W.ort ist immer der Raum der Kamera. Gibt true zurueck, wenn sie umgezogen ist.
function setzeKamera(){
  var liste=raumListe();
  var neu=liste[kameraRaum()]||liste[0];
  if(!neu||W.ort===neu)return false;
  if(W.ort)W.ort.kulisse=S.szeneGlobal||W.ort.kulisse||'';
  W.ort=neu;
  S.szeneGlobal=neu.kulisse||'';
  S.szeneText=neu.bildPrompt||'';
  return true;
}
// Bringt alles in einen gueltigen Zustand: Raumliste, Zuordnungen, Kamera.
function raeumeOrdnen(){
  var liste=raumListe();
  if(!Array.isArray(S.raumNpc))S.raumNpc=[];
  while(S.raumNpc.length<W.npcs.length)S.raumNpc.push(kameraRaum());
  S.raumNpc=S.raumNpc.slice(0,W.npcs.length).map(function(k){
    return (typeof k==='number'&&k>=0&&k<liste.length)?k:0;
  });
  if(typeof S.raumHeld!=='number'||S.raumHeld<0||S.raumHeld>=liste.length)S.raumHeld=0;
  if(S.spieltIdx!=null&&!(S.spieltIdx>=0&&S.spieltIdx<W.npcs.length))S.spieltIdx=null;
  setzeKamera();
}
// Sucht einen Raum am Namen und legt ihn sonst an.
function raumFinden(name,vorlage){
  var liste=raumListe();
  var n=entkleide(String(name||'')).trim();
  if(!n)return kameraRaum();
  var klein=n.toLowerCase();
  for(var i=0;i<liste.length;i++){
    var r=liste[i];
    if(r&&String(r.name||'').toLowerCase()===klein)return i;
  }
  if(liste.length>=MAX_RAEUME)return kameraRaum();
  liste.push({name:kappe(n,60),
              geschichte:(vorlage&&vorlage.geschichte)||'',
              bildPrompt:(vorlage&&vorlage.bildPrompt)||'',
              kulisse:(vorlage&&vorlage.kulisse)||''});
  return liste.length-1;
}
// "held" oder ein Figurenindex zieht in Raum k um.
function figurNachRaum(wer,k,still){
  var liste=raumListe();
  if(!(k>=0&&k<liste.length))return false;
  var name='';
  if(wer==='held'){
    if(raumVonHeld()===k)return false;
    S.raumHeld=k; name=heldName();
  }else{
    var i=Number(wer);
    if(!(i>=0&&i<W.npcs.length))return false;
    if(raumVonNpc(i)===k)return false;
    S.raumNpc[i]=k; name=W.npcs[i].name;
  }
  var kameraZog=setzeKamera();
  if(!still){
    sysZeile('— '+name+' geht nach: '+raumName(k)+' —');
    if(kameraZog){
      zeigeRaumtitel();
      S.bildZaehler=0;
      zeichneBild({});
    }
    aktualisiereUI();
    autosave();
  }
  return true;
}
// Anwesend heisst: im selben Raum wie die Kamera.
function anwesendNpc(i){ return raumVonNpc(i)===kameraRaum(); }
function anwesendeNpcs(){
  var raus=[];
  W.npcs.forEach(function(n,i){ if(anwesendNpc(i))raus.push(i); });
  return raus;
}
function heldAnwesend(){ return raumVonHeld()===kameraRaum(); }
// Wer nicht im Raum ist, gehoert trotzdem in die Anweisung - sonst laesst die
// Regie ihn mitreden, als staende er daneben.
function abwesendeText(){
  var raus=[];
  if(!heldAnwesend())raus.push(heldName()+' ('+raumName(raumVonHeld())+')');
  W.npcs.forEach(function(n,i){
    if(!anwesendNpc(i))raus.push(n.name+' ('+raumName(raumVonNpc(i))+')');
  });
  if(!raus.length)return '';
  return 'NICHT IM RAUM (anderswo, weder zu sehen noch zu hoeren, dürfen NICHT sprechen): '+raus.join(', ')+'\n';
}
// "Ida > Küche; Jan > Hof" - so schickt die Regie einzelne Figuren durch Türen.
function raumwechselAus(text){
  var raus=[];
  String(text==null?'':text).split(/[;\n]+/).forEach(function(t){
    var m=t.match(/^\s*([^>:]{1,44}?)\s*(?:>|->|→|nach)\s*(.+)$/);
    if(m)raus.push({wer:entkleide(m[1]).trim(),wohin:entkleide(m[2]).trim()});
  });
  return raus;
}
function folgeRaumwechsel(text){
  if(leerAngabe(text))return 0;
  var zahl=0;
  raumwechselAus(text).forEach(function(e){
    if(!e.wer||!e.wohin||leerAngabe(e.wohin))return;
    var k=raumFinden(e.wohin,{});
    var wer=istHeld(e.wer)?'held':findeNpc(e.wer);
    if(wer!=='held'&&wer<0)return;
    if(figurNachRaum(wer,k,true))zahl++;
  });
  if(zahl){
    var kameraZog=setzeKamera();
    sysZeile('— Ortswechsel im Haus: '+text+' —');
    if(kameraZog){ zeigeRaumtitel(); S.bildZaehler=0; zeichneBild({}); }
    aktualisiereUI();
    autosave();
  }
  return zahl;
}

// Ein Bild muss nicht immer alle zeigen: mal nur die Figuren, mal nur den
// Helden, mal gar keine Person, sondern ein Ding aus naechster Naehe.
var MOTIVE={
  alle:   'alle Anwesenden',

function motivSchluessel(t){
  var s=String(t||'').toLowerCase().trim();
  if(/^(figur|npc|nur die figuren|others)/.test(s))return 'figuren';
  if(/^(held|protagonist|nur der held|self)/.test(s))return 'held';
  if(/^(ort|ding|detail|gegenstand|nichts|niemand|none|object)/.test(s))return 'ort';
  if(/^(alle|all|beide)/.test(s))return 'alle';
  return '';
}
// Die Wahl des Spielers schlaegt den Vorschlag der Regie.

  return motivSchluessel(S.motiv)||motivSchluessel(S.motivZug)||'alle';
}

function zeigeGedanken(){

function missionBefehl(text){

// Ortswechsel: neuen Ort von der KI ausformulieren lassen, damit Beschreibung
// und Bildkulisse zusammenpassen. Die alte Besetzung regelt die Regie ueber
// das Feld "abgang" - wer nicht mitkommt, bleibt zurueck.
async function ortWechseln(beschreibung){
  if(!S.imSpiel)return;
  beschreibung=entkleide(beschreibung);
  if(!beschreibung||S.ortLaeuft)return;
  S.ortLaeuft=true;
  sysZeile('— Ortswechsel: ' + beschreibung + ' —');
  try{
    var text=await frageKI(
      'Der Schauplatz eines deutschen Dialog-Adventures wechselt. Formuliere den NEUEN Ort aus.\n\n'+
      weltKontext()+
      'BISHERIGER ORT: '+((W.ort&&W.ort.name)||'?')+' — '+((W.ort&&W.ort.geschichte)||'')+'\n'+
      'NEUER ORT laut Handlung: '+beschreibung+'\n'+
      'ANWESEND: '+W.npcs.map(function(n){return n.name;}).join(', ')+'\n\n'+
      'Antworte NUR mit einem JSON-Objekt, ohne Codeblock:\n'+
      '{"name":"Name des neuen Ortes","geschichte":"atmosphaerische deutsche Beschreibung, 3 bis 6 Saetze",'+
      '"kulisse":"english description of the surroundings for image generation: architecture, objects, light, weather",'+
      '"bild":"one English sentence: what is seen the moment the characters arrive"}',
      120000);
    var j=jsonAus(text), z=j?null:felderAus(text);
    var f=function(k,flach,ersatz){ return j?hole(j,[k],ersatz):((z&&z[flach])||ersatz); };
    // Alle, die JETZT im Raum stehen, gehen mit - wer anderswo ist, bleibt dort.
    var mitNpcs=anwesendeNpcs(), mitHeld=heldAnwesend();
    var k=raumFinden(f('name','NAME',beschreibung.substring(0,40)),{});
    var raum=raumListe()[k];
    raum.geschichte=f('geschichte','GESCHICHTE',beschreibung);
    raum.bildPrompt=f('bild','BILD',raum.bildPrompt||'');
    raum.kulisse=f('kulisse','KULISSE',raum.kulisse||'');
    mitNpcs.forEach(function(i){ S.raumNpc[i]=k; });
    if(mitHeld)S.raumHeld=k;
    if(S.spieltIdx!=null)S.raumNpc[S.spieltIdx]=k;
    setzeKamera();
    W.ort=raum;
    S.szeneGlobal=raum.kulisse||'';
    S.szeneText=raum.bildPrompt;
    merkeFakt('Der Ort wechselte zu '+W.ort.name+'.');
    zeigeRaumtitel();
    baueChronikNav();
    S.bildZaehler=0;
    autosave();
    zeichneBild({});
  }catch(e){
    zeigeFehler('Ortswechsel',e);
  }
  S.ortLaeuft=false;
}
// Der Ort veraendert sich, ohne dass gewechselt wird (Licht geht aus, Regen setzt ein).
function ortNotiz(satz){
  satz=entkleide(satz);
  if(!satz||!W.ort)return;
  var g=String(W.ort.geschichte||'');
  if(g.indexOf(satz)>=0)return;
  W.ort.geschichte=(g+' '+satz).trim();
  if(W.ort.geschichte.length>1400)W.ort.geschichte=W.ort.geschichte.substring(W.ort.geschichte.length-1400);
  merkeFakt('Am Ort: '+satz);
  sysZeile('— '+satz+' —');
}

// Eine Kachel je Raum, darin wer sich dort aufhaelt. Der Raum mit der Kamera
// ist hervorgehoben; von hier aus laesst sich jede Figur versetzen.
function raumBelegung(){
  var liste=raumListe();
  var raus=liste.map(function(r,k){
    return {name:(r&&r.name)||('Raum '+(k+1)),leute:[]};
  });
  raus[raumVonHeld()].leute.push({wer:'held',name:heldName(),selbst:(S.spieltIdx==null)});
  W.npcs.forEach(function(n,i){
    raus[raumVonNpc(i)].leute.push({wer:i,name:n.name,selbst:(S.spieltIdx===i)});
  });
  return raus;
}
function oeffneRaeume(){
  if(!S.imSpiel)return;
  raeumeOrdnen();
  var hier=kameraRaum();
  var belegung=raumBelegung();
  var html='<div class="hinweis">Die Kamera bleibt bei der Figur, die du spielst. Wer in einem anderen Raum steht, '+
           'bleibt im Spiel — ist dort aber weder zu sehen noch zu hören.</div><div class="raumgitter">';
  belegung.forEach(function(r,k){
    var leute=r.leute.map(function(p){
      return '<span class="raumperson'+(p.selbst?' duselbst':'')+'">'+escapeHtml(p.name)+(p.selbst?' ◉':'')+'</span>';
    }).join('');
    var andere=[];
    belegung.forEach(function(r2,k2){
      if(k2===k)return;
      r2.leute.forEach(function(p){ andere.push({wer:p.wer,name:p.name}); });
    });
    html+='<div class="raumkachel'+(k===hier?' hier':'')+'">'+
      '<div class="raumkopf">'+escapeHtml(r.name)+(k===hier?' · HIER':'')+'</div>'+
      '<div class="raumleute">'+(leute||'<span class="raumleer">leer</span>')+'</div>'+
      '<button onclick="raumHin('+k+')"'+(k===hier?' disabled':'')+'>◎ DORTHIN</button>'+
      (andere.length
        ? '<select onchange="figurHolen(this.value,'+k+')"><option value="">Figur hierher holen…</option>'+
          andere.map(function(p){ return '<option value="'+p.wer+'">'+escapeHtml(p.name)+'</option>'; }).join('')+
          '</select>'
        : '')+
      '</div>';
  });
  html+='</div>'+
    '<label class="feldlabel" for="raumNeuFeld">NEUER RAUM (nur Name — die Beschreibung schreibt der Ortswechsel)</label>'+
    '<div class="reihe"><input id="raumNeuFeld" class="feld" type="text" placeholder="z.B. Die Küche">'+
    '<button onclick="raumAnlegen()">＋</button></div>';
  el('raeumeInhalt').innerHTML=html;
  oeffneModal('mRaeume');
}
// Die gespielte Figur geht in Raum k - und die Kamera mit ihr.

// Seit der Umstellung auf die Ladeschale ist die Frage berechtigt, welcher Stand
// gerade laeuft. Die Schale legt den geholten Quelltext samt Zweig und Zeitpunkt
// im localStorage ab; hier wird er nur abgelesen.
var VERSION = 'V7.46';
// Ohne Browserkonsole — etwa am Handy — muss der Generator selbst sagen koennen,
// woran es liegt, wenn ein Plugin von Perchance fehlt.
function pluginLage(){
  var L=null;
  try{ L=window.PROXIMA_LADER||null; }catch(e){}
  if(!L)return 'ohne Ladeschale';
  var teile=['Ladeschale '+(L.version||'aeltere Fassung')];
  try{
    var b=(typeof L.plugins==='function')?L.plugins():{};
    Object.keys(b).forEach(function(k){ teile.push(k+': '+b[k]); });
  }catch(e){}

// Endpunkte und Parameter beim Space erfragen und die Vorlage daraus bauen.
// Erspart das Abtippen aus "Use via API" und deckt Tippfehler sofort auf.
async function gradioErkunden(){
  leseEinstellungen();
  var pr=el('quellePruef'), info=el('gradioInfo');
  var host=String(CFG.gradioHost||'').replace(/\/+$/,'');
  if(!host){ pr.className='pruefzeile fehler'; pr.textContent='Erst die Space-Adresse eintragen.'; return; }
  var kopf={};
  if(CFG.gradioToken)kopf['Authorization']='Bearer '+CFG.gradioToken;
  pr.className='pruefzeile'; pr.textContent='Frage den Space ab...';
  try{
    var r=await fetch(host+'/gradio_api/info',{headers:kopf});
    if(!r.ok)throw new Error('HTTP '+r.status+' auf /gradio_api/info');
    var j=await r.json();
    var punkte=(j&&j.named_endpoints)||{};
    var namen=Object.keys(punkte);
    if(!namen.length)throw new Error('Der Space nennt keine benannten Endpunkte.');

    // Gewuenschten Endpunkt nehmen, sonst den ersten mit Bildausgabe.
    var wunsch=String(CFG.gradioApi||'');
    if(wunsch.charAt(0)!=='/')wunsch='/'+wunsch;
    // Nach denselben Regeln waehlen wie zur Laufzeit: der Space nennt seinen
    // ersten Endpunkt "/False", der ist ganz sicher nicht der Bildgenerator.
    var gewaehlt=waehleEndpunkt(namen.map(function(n){return {api_name:n};}),wunsch);
    var name=gewaehlt?('/'+gewaehlt.name):null;
    if(!name||!punkte[name]){
      name=namen.filter(function(n){
        return (punkte[n].returns||[]).some(function(rt){return /image/i.test(String(rt.component||rt.label||''));});
      })[0]||namen[0];
    }
    var ep=punkte[name];
    var params=ep.parameters||[];

    var feldApi=el('q_gradioApi'), feldVor=el('q_gradioVorlage'), feldFn=el('q_gradioFnIndex');
    if(feldApi)feldApi.value=name;
    if(feldVor)feldVor.value=gradioVorlageAus(params);   // vorlaeufig, ohne /config

    // fn_index und die echten Vorgabewerte aus /config nachziehen.
    var fnText='';
    try{
      var c=await (await fetch(host+'/config',{headers:kopf})).json();
      var gesucht=name.replace(/^\//,''), dep=null, gefunden=null;
      (c&&c.dependencies||[]).forEach(function(d,i){
        if(String(d.api_name||'').replace(/^\//,'')===gesucht&&gefunden===null){
          gefunden=(d.id!=null?d.id:i); dep=d;
        }
      });
      if(gefunden!==null&&feldFn){ feldFn.value=String(gefunden); fnText=', fn_index '+gefunden; }
      if(dep&&feldVor)feldVor.value=gradioVorlageAusConfig(params,dep,c&&c.components);
    }catch(e2){}

    // Vorgabewerte fuer Breite und Hoehe aus /config lesen, damit die Masse
    // von vornherein im erlaubten Bereich liegen.
    var masseText='';
    try{
      var cc=await (await fetch(host+'/config',{headers:kopf})).json();
      var werte={};
      (cc&&cc.components||[]).forEach(function(comp){
        var lab=String((comp.props&&(comp.props.label||comp.props.info))||'').toLowerCase();
        var pr=comp.props||{};
        if(pr.minimum==null&&pr.value==null)return;
        if(/width|breite/.test(lab)&&!werte.b)werte.b=Math.max(Number(pr.minimum)||0,Number(pr.value)||0);
        if(/height|h(ö|oe)he/.test(lab)&&!werte.h)werte.h=Math.max(Number(pr.minimum)||0,Number(pr.value)||0);
      });
      var fb=el('q_gradioBreite'), fh=el('q_gradioHoehe');
      if(werte.b&&fb){ fb.value=String(auf64(werte.b)); }
      if(werte.h&&fh){ fh.value=String(auf64(werte.h)); }
      if(werte.b||werte.h)masseText='  |  Maße: '+auf64(werte.b||1024)+'x'+auf64(werte.h||1024);
    }catch(e3){}

    info.textContent='Endpunkte: '+namen.join(', ')+'  |  gewählt: '+name+fnText+masseText+
      '  |  Parameter: '+params.map(function(pa,i){
        return (i+1)+'. '+(pa.parameter_name||pa.label||'?')+
               ' ('+String((pa.type&&pa.type.type)||(pa.python_type&&pa.python_type.type)||'?')+')';
      }).join(' · ');
    pr.className='pruefzeile ok';
    pr.textContent='\u2713 Vorlage gebaut. Bitte prüfen, dann ÜBERNEHMEN und QUELLE TESTEN.';
    leseEinstellungen();
  }catch(e){
    pr.className='pruefzeile fehler';
    pr.textContent='\u2715 '+((e&&e.message)||e)+' — Angaben notfalls von Hand aus "Use via API" übernehmen.';
  }
}

// ── DATEIEN AUF DEM GERÄT ─────────────────────
// Ex- und Import gehen über den Dateidialog des Geräts: EXPORT legt eine Datei
// an, IMPORT öffnet den Dateiexplorer. Das Textfeld bleibt daneben bestehen —
// manche Browser blockieren Downloads im Perchance-Fenster, und dann ist der
// Text zum Kopieren immer noch da.
function dateiStempel(){
  var d=new Date();
  function z(n){ return (n<10?'0':'')+n; }
  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'-'+z(d.getHours())+z(d.getMinutes());
}
function dateiName(art,endung){
  var wer=(W.protagonist&&W.protagonist.name)||'';
  return ('proxima-'+art+(wer?'-'+wer:'')+'-'+dateiStempel()+'.'+endung)
         .toLowerCase().replace(/[^a-z0-9.-]+/g,'-');
}
function dateiSpeichern(name,text,typ){
  try{
    var b=new Blob([text],{type:(typ||'text/plain')+';charset=utf-8'});
    var u=URL.createObjectURL(b);
    var a=document.createElement('a');
    a.href=u; a.download=name; a.style.display='none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      try{ document.body.removeChild(a); }catch(e){}
      URL.revokeObjectURL(u);
    },2000);
    return true;
  }catch(e){ zeigeFehler('Datei sichern',e); return false; }
}
function dateiOeffnen(rueckruf,akzeptiert){
  try{
    var e=document.createElement('input');
    e.type='file';
    e.accept=akzeptiert||'.json,.txt,application/json,text/plain';
    e.style.display='none';
    e.onchange=function(){
      var f=e.files&&e.files[0];
      try{ document.body.removeChild(e); }catch(x){}
      if(!f)return;
      var l=new FileReader();
      l.onload=function(){ rueckruf(String(l.result==null?'':l.result),f.name); };
      l.onerror=function(){ zeigeFehler('Datei lesen',l.error||new Error('Die Datei ließ sich nicht lesen.')); };
      l.readAsText(f);
    };
    document.body.appendChild(e);
    e.click();
    return true;
  }catch(x){ zeigeFehler('Datei öffnen',x); return false; }
}

var SAVE_VERSION=7;
var SLOTS=['proxima_v7_auto','proxima_v7_1','proxima_v7_2','proxima_v7_3'];
var SLOT_NAMEN=['Automatisch','Platz 1','Platz 2','Platz 3'];

// Die Undo-Schnappschuesse enthalten jeweils den ganzen Verlauf — die kommen
// NICHT mit in den Speicherstand, sonst waechst er quadratisch.
function standObjekt(){
  var kopie={};
  Object.keys(S).forEach(function(k){ if(k!=='rueckgaengig')kopie[k]=S[k]; });
  kopie.rueckgaengig=[];
  if(kopie.verlauf&&kopie.verlauf.length>600)kopie.verlauf=kopie.verlauf.slice(-600);
  return {version:SAVE_VERSION,zeit:Date.now(),welt:W,stand:kopie};
}
function schreibeSlot(i){
  try{ localStorage.setItem(SLOTS[i],JSON.stringify(standObjekt())); return true; }
  catch(e){ zeigeFehler('Speichern',e); return false; }
}
function autosave(){ schreibeSlot(0); }
function leseSlot(i){
  try{
    var roh=localStorage.getItem(SLOTS[i]);
    if(!roh)return null;
    var d=JSON.parse(roh);
    return pruefeStand(d)?d:null;
  }catch(e){ return null; }
}
function pruefeStand(d){
  return !!(d&&d.welt&&d.stand&&d.welt.ort&&Array.isArray(d.welt.npcs)&&d.welt.npcs.length);
}
function irgendeinStand(){
  for(var i=0;i<SLOTS.length;i++){ if(leseSlot(i))return true; }
  return false;
}
// Alte Formate (V6 und aelter) mitnehmen, statt sie stumm zu verlieren.
function migriere(d){
  var w=d.welt, s=d.stand;
  if(!Array.isArray(s.verlauf))s.verlauf=[];
  if(!Array.isArray(s.stimmung))s.stimmung=w.npcs.map(function(n){return n.grundstimmung;});
  if(!Array.isArray(s.kleidung))s.kleidung=w.npcs.map(function(n){return n.kleidung;});
  if(!Array.isArray(s.regieAnweisung))s.regieAnweisung=[];
  while(s.regieAnweisung.length<w.npcs.length)s.regieAnweisung.push('');
  if(!Array.isArray(s.fakten))s.fakten=[];
  // Vor V7.33 waren Fakten blosse Zeichenketten ohne Gewicht.
  s.fakten=s.fakten.map(function(x){
    if(x&&typeof x==='object'&&typeof x.t==='string')return x;
    return {t:String(x||''),g:2,z:0};
  }).filter(function(x){ return x.t; });
  if(typeof s.zug!=='number')s.zug=0;
  if(typeof s.akt!=='number')s.akt=1;
  if(typeof s.aktBild!=='string')s.aktBild='';
  s.referenzWoher='';
  if(typeof s.aktZiel!=='string')s.aktZiel='';
  if(!Array.isArray(s.akteVorbei))s.akteVorbei=[];
  w.npcs.forEach(function(x){
    if(typeof x.ziel!=='string')x.ziel='';
    if(typeof x.geheimnis!=='string')x.geheimnis='';
    x.aufgedeckt=!!x.aufgedeckt;
  });
  // Vor V7.41 gab es nur EINEN Ort und alle standen darin.
  if(!Array.isArray(w.raeume)||!w.raeume.length){
    w.raeume=w.ort?[w.ort]:[{name:'Ein Ort',geschichte:'',bildPrompt:'',kulisse:''}];
    if(!w.ort)w.ort=w.raeume[0];
    if(typeof s.raumHeld!=='number')s.raumHeld=0;
  }else if(w.ort&&w.ort.name){
    // Nach dem Speichern ist W.ort eine Kopie - hier wieder auf den Raum zeigen.
    var kOrt=-1;
    w.raeume.forEach(function(r,ri){ if(kOrt<0&&r&&String(r.name)===String(w.ort.name))kOrt=ri; });
    if(kOrt<0){ w.raeume.push(w.ort); kOrt=w.raeume.length-1; }
    w.ort=w.raeume[kOrt];
  }else{
    w.ort=w.raeume[0];
  }
  if(!Array.isArray(s.raumNpc))s.raumNpc=[];
  while(s.raumNpc.length<w.npcs.length)s.raumNpc.push(0);
  s.raumNpc=s.raumNpc.slice(0,w.npcs.length).map(function(k){
    return (typeof k==='number'&&k>=0&&k<w.raeume.length)?k:0;
  });
  if(typeof s.raumHeld!=='number'||s.raumHeld<0||s.raumHeld>=w.raeume.length)s.raumHeld=0;
  if(s.spieltIdx==null||!(s.spieltIdx>=0&&s.spieltIdx<w.npcs.length))s.spieltIdx=null;
  if(typeof s.motiv!=='string')s.motiv='';
  s.motivZug='';
  if(typeof s.minuten!=='number')s.minuten=0;
  if(typeof s.startUhr!=='number')s.startUhr=19*60+30;
  if(typeof s.wetter!=='string')s.wetter='';
  if(typeof s.frist!=='number')s.frist=0;
  s.probe=null;
  // Vor V7.31 gab es weder Mission noch Beziehungsregister.
  if(!s.beziehungen||typeof s.beziehungen!=='object'||Array.isArray(s.beziehungen))s.beziehungen={};
  if(typeof s.missionStand!=='string')s.missionStand='';
  if(typeof w.mission!=='string')w.mission='';
  if(!Array.isArray(s.rueckgaengig))s.rueckgaengig=[];
  if(typeof s.handlung!=='string')s.handlung='';
  if(typeof s.autoRegie!=='string')s.autoRegie='';
  if(typeof s.stil!=='string')s.stil='';
  if(typeof s.stilLabel!=='string')s.stilLabel='';
  if(typeof s.szeneGlobal!=='string')s.szeneGlobal='';
  if(typeof s.szeneText!=='string')s.szeneText='';
  if(typeof s.letzterNegativ!=='string')s.letzterNegativ='';
  if(typeof s.eigenerPrompt!=='string')s.eigenerPrompt='';

}

// Derselbe Knopf fuehrt in dasselbe Fenster: Spielstaende UND Chats aus einem

// ── CHATS AUS EINEM ANDEREN GENERATOR ─────────
// Der Perchance-Generator "AI Character Chat" gibt Unterhaltungen in zwei
// Formen heraus: als Textblock, in dem vor jeder Zeile [USER], [AI] oder
// [SYSTEM] steht, und als JSON des ganzen Stranges. PROXIMA liest beides,
// damit ein dort begonnenes Gespraech hier weitergehen kann - und schreibt
// den eigenen Verlauf im selben Textformat zurueck.
var CHAT_KOPF=/^\[(SYSTEM|USER|AI)\s*[;,]?\s*([^\]]*)\]:\s?([\s\S]*)$/i;
var CHAT_MAX_ZEILEN=400;   // laengere Chats werden hinten abgeschnitten
var CHAT_MAX_NOTIZEN=8;    // so viele Regieanweisungen wandern ins Gedaechtnis
var CHAT_TITEL='';         // Name des zuletzt gelesenen Stranges (nur aus JSON)

// "; name=Ida, hiddenFrom=ai" - der fremde Generator trennt beim Schreiben mit
// Komma und beim Lesen mit Semikolon. Hier gilt beides.
function chatParameter(roh){
  var p={};
  String(roh==null?'':roh).split(/[;,]/).forEach(function(t){
    var m=t.match(/^\s*([A-Za-z][\w-]*)\s*=\s*(.*?)\s*$/);
    if(m)p[m[1].toLowerCase()]=entkleide(m[2]);
  });
  return p;
}
function chatSauber(liste){
  return liste.map(function(n){
    n.text=String(n.text==null?'':n.text).trim();
    n.name=String(n.name||'').trim();
    n.verborgen=String(n.verborgen||'').toLowerCase();
    return n;
  }).filter(function(n){ return n.text; });
}
// Textblock: Eine Zeile mit Kopf beginnt eine Nachricht, alles danach gehoert
// noch dazu - so bleiben mehrzeilige Antworten heil.
function nachrichtenAusText(roh){
  var zeilen=String(roh==null?'':roh).replace(/\r\n?/g,'\n').split('\n');
  var raus=[],akt=null;
  zeilen.forEach(function(z){
    var m=z.match(CHAT_KOPF);
    if(m){
      if(akt)raus.push(akt);
      var p=chatParameter(m[2]);
      akt={rolle:m[1].toLowerCase(),name:p.name||'',verborgen:p.hiddenfrom||'',text:m[3]};
    }else if(akt){
      akt.text+='\n'+z;
    }
  });
  if(akt)raus.push(akt);
  return chatSauber(raus);
}
// Das JSON ist ein Auszug der fremden Datenbank: unter data.data liegen die
// Tabellen. characterId -1 ist der Mensch, -2 das System, alles andere eine
// Figur; die Hauptfigur des Stranges spricht als [AI].
function chatTabelle(j,name){
  var d=j&&j.data&&j.data.data;
  if(!Array.isArray(d))return null;
  for(var i=0;i<d.length;i++){ if(d[i]&&d[i].tableName===name)return Array.isArray(d[i].rows)?d[i].rows:[]; }
  return null;
}
function nachrichtenAusJson(j){
  var zeilen=chatTabelle(j,'messages');
  if(!zeilen||!zeilen.length)return [];
  var figuren=chatTabelle(j,'characters')||[];
  var straenge=chatTabelle(j,'threads')||[];
  var namen={};
  figuren.forEach(function(f){ if(f&&f.id!=null)namen[f.id]=String(f.name||'').trim(); });
  var haupt=(straenge[0]&&straenge[0].characterId!=null)?straenge[0].characterId:null;
  CHAT_TITEL=(straenge[0]&&String(straenge[0].name||'').trim())||'';
  var raus=[];
  zeilen.slice().sort(function(a,b){ return (a&&a.order||0)-(b&&b.order||0); }).forEach(function(m){
    if(!m)return;
    var id=m.characterId;
    var rolle=(id===-1)?'user':((haupt!=null&&id===haupt)?'ai':'system');
    var verborgen=Array.isArray(m.hiddenFrom)?m.hiddenFrom.join(' '):(m.hiddenFrom||'');
    raus.push({
      rolle:rolle,
      name:(rolle==='user')?'':(m.name||namen[id]||''),
      verborgen:verborgen,
      text:m.message
    });
  });
  return chatSauber(raus);
}
// Auch die Kurzform aus den Startnachrichten einer Figur: [{author,content}]
function nachrichtenAusListe(a){
  return chatSauber(a.map(function(m){
    if(!m||typeof m!=='object')return {rolle:'',text:''};
    return {rolle:String(m.author||m.rolle||'').toLowerCase(),name:m.name||'',
            verborgen:Array.isArray(m.hiddenFrom)?m.hiddenFrom.join(' '):(m.hiddenFrom||''),
            text:m.content||m.message||m.text||''};
  })).filter(function(n){ return n.rolle==='user'||n.rolle==='ai'||n.rolle==='system'; });
}
function nachrichtenLesen(roh){
  var t=String(roh==null?'':roh).trim();
  CHAT_TITEL='';
  if(!t)return [];
  if(t.charAt(0)==='{'||t.charAt(0)==='['){
    var j=null;
    try{ j=JSON.parse(t); }catch(e){ j=null; }
    if(Array.isArray(j))return nachrichtenAusListe(j);
    if(j&&typeof j==='object'){
      var n=nachrichtenAusJson(j);
      if(n.length)return n;
    }
  }
  return nachrichtenAusText(t);
}

// [AI] ist die Hauptfigur. [SYSTEM] mit Namen ist eine weitere Figur - so
// exportiert der fremde Generator Gruppengespraeche. [SYSTEM] ohne Namen oder
// mit Versteck ist eine Regieanweisung: die wird Gedaechtnis, nicht Dialog.
function chatIstFigur(n){
  if(!n)return false;
  if(n.rolle==='ai')return true;
  return n.rolle==='system'&&!!n.name&&!n.verborgen;
}
function chatSprecher(nachrichten,ersatz){
  var zaehler={},reihe=[];
  nachrichten.forEach(function(n){
    if(!chatIstFigur(n))return;
    var name=n.name||ersatz||'';
    if(!name)return;
    if(zaehler[name]==null){ zaehler[name]=0; reihe.push(name); }
    zaehler[name]++;
  });
  // Wer am meisten spricht, bekommt einen der wenigen Plaetze am Ort.
  return reihe.sort(function(a,b){ return zaehler[b]-zaehler[a]; });
}
// Aus den Nachrichten wird ein Bauplan: wer auftritt, was gesagt wurde und was
// nur noch als Notiz taugt.
function chatPlan(nachrichten,ersatz){
  var sprecher=chatSprecher(nachrichten,ersatz);
  var figuren=sprecher.slice(0,MAX_NPCS);
  var plan={figuren:figuren,uebrig:sprecher.slice(MAX_NPCS),zeilen:[],notizen:[],gekuerzt:0};
  nachrichten.forEach(function(n){
    if(n.rolle==='user'){ plan.zeilen.push({rolle:'ich',text:n.text}); return; }
    if(chatIstFigur(n)){
      var name=n.name||ersatz||'';
      if(figuren.indexOf(name)>=0)plan.zeilen.push({rolle:'npc',name:name,text:n.text});
      else plan.notizen.push(name+': '+n.text);
      return;
    }
    plan.notizen.push(n.text);
  });
  if(plan.zeilen.length>CHAT_MAX_ZEILEN){
    plan.gekuerzt=plan.zeilen.length-CHAT_MAX_ZEILEN;
    plan.zeilen=plan.zeilen.slice(-CHAT_MAX_ZEILEN);
  }
  return plan;
}
function chatLetzterSatz(plan,name){
  var t='';
  plan.zeilen.forEach(function(z){ if(z.rolle==='npc'&&z.name===name)t=z.text; });
  return kappe(t,200);
}
function chatFigur(name,eroeffnung){
  return {
    name:          name,
    ausChat:       true,   // Platzhalter - die Auswertung traegt das Profil nach
    rolle:         'aus einem früheren Gespräch',
    aussehen:      'an adult with an ordinary but memorable face',
    kleidung:      'simple everyday clothing',
    person:        'so, wie sie sich im übernommenen Gespräch gezeigt hat',
    grundstimmung: 'neutral',
    ziel:'', geheimnis:'', aufgedeckt:false,
    eroeffnung:    eroeffnung||'…'
  };
}
// Die Notizen aus [SYSTEM] sind das, was der fremde Chat im Hintergrund wusste.
function chatNotizenMerken(plan){
  plan.notizen.slice(-CHAT_MAX_NOTIZEN).forEach(function(t){ merkeFakt(kappe(t,180),3); });
}
// Fall 1: Es laeuft bereits ein Spiel. Bekannte Namen finden ihre Figur,
// unbekannte treten dazu, solange Platz am Ort ist.
function chatAnhaengen(plan){
  var karte={},neu=[];
  plan.figuren.forEach(function(name){
    var i=findeNpc(name);
    if(i<0&&W.npcs.length<MAX_NPCS){
      i=W.npcs.length;
      W.npcs.push(chatFigur(name,chatLetzterSatz(plan,name)));
      S.stimmung.push('neutral');
      S.kleidung.push(W.npcs[i].kleidung);
      S.regieAnweisung.push('');
      S.raumNpc.push(kameraRaum());
      neu.push(name);
    }
    if(i>=0)karte[name]=i;
  });
  var offen=0;
  plan.zeilen.forEach(function(z){
    if(z.rolle==='ich'){ S.verlauf.push({rolle:'ich',text:z.text}); return; }
    var i=karte[z.name];
    if(i==null){ offen++; return; }
    S.verlauf.push({rolle:'npc',idx:i,text:z.text,name:W.npcs[i].name});
  });
  chatNotizenMerken(plan);
  S.zug=(S.zug||0)+plan.zeilen.filter(function(z){ return z.rolle==='ich'; }).length;
  zeichneVerlaufNeu();
  sysZeile('— Gespräch übernommen: '+plan.zeilen.length+' Zeilen'+
           (neu.length?', neu am Ort: '+neu.join(', '):'')+' —');
  chatHinweise(plan,offen);
  autosave();
  chatAuswerten().catch(function(){});
  return true;
}
// Fall 2: Noch kein Spiel. Dann entsteht aus dem Chat eine schlichte Welt -
// ein Ort, die Figuren daraus, und der Verlauf als Vorgeschichte.
function chatAlsWelt(plan,heldWunsch,titel){
  var namen=plan.figuren.slice();
  W.protagonist={
    name:heldWunsch||'Held', herkunft:'', beruf:'', eigenart:'',
    geschlecht:geschlechtSchluessel(CFG.geschlecht), aussehen:'', kleidung:'',
    ausChat:!heldWunsch   // ohne eigene Angabe darf die Auswertung den Namen setzen
  };
  W.stadt='';
  W.mission='';
  W.perspektive=(el('perspektive')&&el('perspektive').value==='ich')?'ich':'er';
  W.ort={
    name:       titel||'Fortgeführtes Gespräch',
    geschichte: 'Ein Gespräch, das anderswo begann, geht hier weiter.',
    bildPrompt: 'two people talking in a quiet room, warm evening light',
    kulisse:    '',
    ausChat:    true   // Platzhalter, bis die Auswertung den Ort kennt
  };
  W.raeume=[W.ort];
  S.raumHeld=0;S.raumNpc=[];S.spieltIdx=null;S.motiv='';S.motivZug='';
  setzeNpcs(namen.length?namen.map(function(n){ return chatFigur(n,chatLetzterSatz(plan,n)); })
                        :[chatFigur('Gesprächspartner','…')]);
  var rahmen=W.protagonist.name+' setzt ein Gespräch fort'+
             (namen.length?' mit '+namen.join(', '):'')+'.';
  W.rahmenhandlung=rahmen;
  W.rahmenhandlungOriginal=rahmen;
  S.beziehungen={};
  S.seed=neuerSeed();
  S.szeneText=W.ort.bildPrompt;
  S.handlung='';S.fakten=[];S.verlauf=[];S.rueckgaengig=[];S.missionStand='';
  S.akt=1;S.aktZiel='';S.akteVorbei=[];S.aktBild='';S.referenzWoher='';
  S.minuten=0;S.startUhr=19*60+30;S.wetter='';S.frist=0;S.probe=null;
  S.zug=0;S.bildGeneriert=false;S.bildZaehler=0;
  var karte={};
  W.npcs.forEach(function(n,i){ karte[n.name]=i; });
  plan.zeilen.forEach(function(z){
    if(z.rolle==='ich'){ S.verlauf.push({rolle:'ich',text:z.text}); return; }
    var i=karte[z.name];
    if(i==null)return;
    S.verlauf.push({rolle:'npc',idx:i,text:z.text,name:W.npcs[i].name});
  });
  S.zug=plan.zeilen.filter(function(z){ return z.rolle==='ich'; }).length;
  chatNotizenMerken(plan);
  schliesseModal();
  function melden(){
    sysZeile('— Gespräch übernommen: '+plan.zeilen.length+' Zeilen —');
    chatHinweise(plan,0);
    autosave();
    chatAuswerten().catch(function(){});
  }
  // Der Startbildschirm blendet sich langsam aus; erst danach steht das
  // Gespraechsfenster, in das die Meldungen gehoeren.
  if(el('start')&&el('start').style.display!=='none'&&!el('start').classList.contains('aus')){
    betreteSpiel(melden);
  }else{
    S.imSpiel=true;
    starteOrt();
    melden();
  }
  return true;
}
function chatHinweise(plan,offen){
  if(plan.gekuerzt)sysZeile('Die ersten '+plan.gekuerzt+' Zeilen wurden weggelassen, damit der Verlauf handlich bleibt.');
  if(plan.uebrig.length)sysZeile('Zu viele Sprecher: '+plan.uebrig.join(', ')+' ist nicht am Ort, ihre Zeilen liegen im Gedächtnis.');
  if(offen)sysZeile(offen+' Zeilen ohne Platz am Ort wurden ausgelassen.');
  if(plan.notizen.length)sysZeile('Regieanweisungen aus dem alten Chat sind ins Gedächtnis gewandert.');
}
// Der eine Knopf fuer beide Faelle. Gibt false zurueck, wenn im Feld gar kein
// Chat steht - dann meldet der Aufrufer den Fehler.
function chatImportieren(roh){
  var nachrichten=nachrichtenLesen(roh);
  if(!nachrichten.length)return false;
  var titel=CHAT_TITEL;
  var figurFeld=el('chatFigur'), heldFeld=el('chatHeld');
  var ersatz=(figurFeld&&figurFeld.value.trim())||'Gesprächspartner';
  var held=(heldFeld&&heldFeld.value.trim())||'';
  var plan=chatPlan(nachrichten,ersatz);
  if(!plan.zeilen.length&&!plan.notizen.length)return false;
  if(S.imSpiel)return chatAnhaengen(plan);
  return chatAlsWelt(plan,held,titel);
}
// Der Weg zurueck: PROXIMAs Verlauf im Format des anderen Generators. Die
// erste Figur gilt dort als [AI], alle weiteren als benanntes [SYSTEM].
function chatAlsText(){
  var haupt=(W.npcs[0]&&W.npcs[0].name)||'';
  return S.verlauf.map(function(v){
    var t=String(v&&v.text||'').trim();
    if(!t)return '';
    if(v.rolle==='ich')return '[USER]: '+t;
    var name=v.name||(W.npcs[v.idx]&&W.npcs[v.idx].name)||'';
    if(name&&name!==haupt)return '[SYSTEM; name='+name+']: '+t;
    return '[AI]: '+t;
  }).filter(function(z){ return z; }).join('\n\n');
}
function chatExportAnzeigen(){
  if(!S.verlauf||!S.verlauf.length){ zeigeFehler('Chat-Export',new Error('Es ist noch kein Gespräch da.')); return; }
  var text=chatAlsText();
  var feld=el('exportFeld');
  if(feld)feld.value=text;
  dateiSpeichern(dateiName('chat','txt'),text,'text/plain');
}

// ── DAS ÜBERNOMMENE GESPRÄCH AUSWERTEN ────────
// Ein fremder Chat bringt Text mit, aber keine Profile: Wer sind die Figuren,
// wie sehen sie aus, was wollen sie, was ist verabredet worden? Genau das liest
// ein einzelner KI-Aufruf aus dem Gespraech heraus und traegt es nach - sonst
// stuenden die Figuren mit leeren Steckbriefen am Ort.
var CHAT_LESE_ZEILEN=60;     // so viele Zeilen bekommt die KI zu lesen
var CHAT_LESE_BREITE=320;    // Zeichen je Zeile

function baueChatAuswertung(){
  var namen=W.npcs.map(function(n){ return n.name; }).filter(function(n){ return n; });
  return 'Du liest ein Gespraech, das in einem anderen Programm begonnen wurde, und traegst nach, '+
    'was zum Weiterspielen fehlt. Halte dich an das Gespraech: Erfinde nichts, was ihm widerspricht. '+
    'Was darin offen bleibt, ergaenzt du knapp und stimmig.\n\n'+
    'HELD (der Mensch am Bildschirm): '+heldName()+'\n'+
    'FIGUREN: '+(namen.join(', ')||'—')+'\n\n'+
    'GESPRAECH:\n'+verlaufText(CHAT_LESE_ZEILEN,CHAT_LESE_BREITE)+'\n\n'+
    'Antworte NUR mit einem JSON-Objekt, ohne Codeblock. Aussehen und Kleidung auf ENGLISCH '+
    '(sie gehen an einen Bildgenerator), alles andere auf DEUTSCH:\n'+
    '{"held":{"name":"Name des Helden, falls das Gespraech ihn nennt, sonst leer",'+
    '"aussehen":"constant English visual IDENTITY only, no clothing","kleidung":"english outfit",'+
    '"geschlecht":"maennlich, weiblich, divers oder leer"},\n'+
    '"ort":{"name":"deutscher Name des Ortes","geschichte":"ein bis zwei deutsche Saetze",'+
    '"bild":"english description of the place","zeit":"HH:MM","wetter":"ein deutsches Wort oder leer"},\n'+
    '"npcs":[{"name":"GENAU einer der Namen oben","rolle":"was die Figur hier ist",'+
    '"aussehen":"constant English visual IDENTITY only, no clothing","kleidung":"english outfit",'+
    '"person":"ein deutscher Satz ueber ihr Wesen","stimmung":"EIN deutsches Wort",'+
    '"ziel":"was sie in dieser Szene will","geheimnis":"was sie verbirgt, oder leer",'+
    '"beziehung":"ihre Haltung zum Helden, hoechstens 44 Zeichen",'+
    '"beziehungen":"Name: Haltung; Name: Haltung"}],\n'+
    '"fakten":["kurze deutsche Saetze: was verabredet, versprochen oder enthuellt wurde"],\n'+
    '"handlung":"zwei bis drei deutsche Saetze, worum es zuletzt ging",\n'+
    '"mission":"das uebergeordnete Ziel, oder leer","etappe":"der naechste Schritt, oder leer"}';
}

// Traegt die Antwort ein. Ohne "alle" werden nur die Figuren angefasst, die aus
// dem Import stammen - gewachsene Figuren bleiben, wie sie sind.
function chatProfileEinsetzen(j,alle){
  var bericht={figuren:0,fakten:0,ort:false,held:false};
  if(!j||typeof j!=='object')return bericht;
  function wert(o,feld){
    if(!o||typeof o!=='object')return '';
    var v=entkleide(String(o[feld]==null?'':o[feld])).trim();
    return leerAngabe(v)?'':v;
  }
  // Zuerst der Held: sein Name haengt an allen Beziehungen, die danach kommen.
  var h=j.held;
  if(h&&typeof h==='object'&&W.protagonist){
    var p=W.protagonist;
    var neuerName=wert(h,'name');
    if(neuerName&&p.ausChat){ p.name=kappe(neuerName,40); p.ausChat=false; bericht.held=true; }
    if(!p.aussehen&&wert(h,'aussehen')){ p.aussehen=wert(h,'aussehen'); bericht.held=true; }
    if(!p.kleidung&&wert(h,'kleidung')){ p.kleidung=wert(h,'kleidung'); bericht.held=true; }
    if(!p.geschlecht&&wert(h,'geschlecht'))p.geschlecht=geschlechtSchluessel(wert(h,'geschlecht'));
  }
  // Dann der Ort, solange er noch der Platzhalter aus dem Import ist.
  var o=j.ort;
  if(o&&typeof o==='object'&&W.ort&&(alle||W.ort.ausChat)){
    if(wert(o,'name'))W.ort.name=kappe(wert(o,'name'),60);
    if(wert(o,'geschichte'))W.ort.geschichte=kappe(wert(o,'geschichte'),400);
    if(wert(o,'bild')){ W.ort.bildPrompt=wert(o,'bild'); S.szeneText=W.ort.bildPrompt; }
    var uhr=String(wert(o,'zeit')).match(/(\d{1,2})\s*[:.]\s*(\d{2})/);
    if(uhr)S.startUhr=(parseInt(uhr[1],10)%24)*60+(parseInt(uhr[2],10)%60);
    if(wert(o,'wetter'))S.wetter=einWort(wert(o,'wetter'));
    W.ort.ausChat=false;
    bericht.ort=true;
  }
  // Die Figuren.
  (Array.isArray(j.npcs)?j.npcs:[]).forEach(function(e){
    if(!e||typeof e!=='object')return;
    var i=findeNpc(wert(e,'name'));
    if(i<0)return;
    var n=W.npcs[i];
    if(!alle&&!n.ausChat)return;
    if(wert(e,'rolle'))n.rolle=kappe(wert(e,'rolle'),60);
    if(wert(e,'aussehen'))n.aussehen=wert(e,'aussehen');
    if(wert(e,'kleidung'))n.kleidung=wert(e,'kleidung');
    if(wert(e,'person'))n.person=kappe(wert(e,'person'),240);
    if(wert(e,'stimmung'))n.grundstimmung=einWort(wert(e,'stimmung'))||n.grundstimmung;
    if(wert(e,'ziel'))n.ziel=kappe(wert(e,'ziel'),160);
    if(wert(e,'geheimnis'))n.geheimnis=kappe(wert(e,'geheimnis'),160);
    S.stimmung[i]=n.grundstimmung;
    S.kleidung[i]=n.kleidung;
    if(wert(e,'beziehung'))setzeBeziehung(n.name,heldName(),wert(e,'beziehung'));
    if(e.beziehungen)uebernimmBeziehungen(String(e.beziehungen),n.name);
    n.ausChat=false;
    bericht.figuren++;
  });
  beziehungenAufraeumen();
  // Was im Gespraech verabredet wurde, gehoert ins Langzeitgedaechtnis.
  var fk=j.fakten;
  if(typeof fk==='string')fk=fk.split(/[;\n]+/);
  if(Array.isArray(fk))fk.forEach(function(f){
    var t=entkleide(String(f==null?'':f)).trim();
    if(!t||leerAngabe(t))return;
    merkeFakt(kappe(t,180),3);
    bericht.fakten++;
  });
  var hd=wert(j,'handlung');
  if(hd&&(alle||!S.handlung))S.handlung=kappe(hd,400);
  var mi=wert(j,'mission');
  if(mi&&(alle||!W.mission))W.mission=kappe(mi,240);
  var et=wert(j,'etappe');
  if(et&&(alle||!S.aktZiel))S.aktZiel=kappe(et,240);
  return bericht;
}

// Der ganze Vorgang, inklusive Meldungen im Gespraechsfenster. Faellt die KI
// aus, bleiben die Platzhalter stehen und /auswerten kann es wiederholen.
async function chatAuswerten(alle){
  if(!S.imSpiel||!W.npcs.length)return false;
  if(S.verlauf.length<2){ sysZeile('Für eine Auswertung ist das Gespräch zu kurz.'); return false; }
  sysZeile('— Die KI liest das Gespräch und legt die Profile an —');
  setWartet(true);
  var text='';
  try{
    text=await frageKI(baueChatAuswertung(),120000);
  }catch(e){
    setWartet(false);
    errZeile('Das Gespräch ließ sich nicht auswerten: '+((e&&e.message)||e)+' — /auswerten versucht es noch einmal.');
    return false;
  }
  setWartet(false);
  S.letzteRohantwort=text;
  var j=jsonAus(text);
  if(!j){ errZeile('Die Auswertung kam unlesbar zurück. /auswerten versucht es noch einmal.'); return false; }
  var b=chatProfileEinsetzen(j,!!alle);
  zeigeRaumtitel();
  aktualisiereUI();
  zeigeStimmung();
  autosave();
  sysZeile('— Angelegt: '+b.figuren+' '+(b.figuren===1?'Profil':'Profile')+
           ', '+b.fakten+' '+(b.fakten===1?'Merkposten':'Merkposten')+
           (b.ort?', Ort und Zeit':'')+' —');
  if(b.figuren)zeichneBild({});   // das erste Bild zeigte noch Platzhalter
  return true;
}

// ── WO DIE ZEIT HINGEHT ───────────────────────
// "Warum dauert das Bild so lange?" laesst sich nicht raten. Hier steht, was
// der letzte Zug wirklich gekostet hat - und was gerade bremst.
function sekunden(ms){
  if(!ms||ms<0)return '—';
  return (ms/1000).toFixed(1)+' s';
}
function tempoZeilen(){
  var takt=Number(CFG.bildTakt)||0;
  var rest=S.bildPauseBis?Math.ceil((S.bildPauseBis-Date.now())/1000):0;
  var z=[];
  z.push(['Text der Regie',sekunden(S.msText)+(S.msAnweisung?'  ('+S.msAnweisung+' Zeichen Anweisung)':'')]);
  z.push(['Lektor',CFG.lektor?(sekunden(S.msLektor)+'  — zweiter Textaufruf je Zug'):'aus']);
  z.push(['Bildregie-Bot',CFG.bildBot?(sekunden(S.msRegie)+'  — eigener Textaufruf vor jedem Bild'):'aus']);
  z.push(['Bild ('+quelle().label+')',sekunden(S.msBild)+(S.bildLaeuft?'  — läuft gerade':'')]);
  z.push(['Bild-Takt',takt?('alle '+takt+' Züge — noch '+Math.max(0,takt-(S.bildZaehler||0))+' Zug bis zum nächsten'):'nur auf Zuruf']);
  z.push(['Zwangspause',rest>0?(rest+' s — der Bilddienst hat gedrosselt'):'keine']);
  if(S.promptFesthalten)z.push(['Prompt festgehalten','ja — es entsteht absichtlich kein neues Bild']);
  return z;
}
// Ein Satz dazu, was der groesste Posten ist. Meist ist es der Bilddienst.
function tempoUrteil(){
  var text=(S.msText||0)+(S.msLektor||0);
  var bild=(S.msBild||0)+(S.msRegie||0);
  if(!text&&!bild)return 'Noch nichts gemessen — spiel einen Zug, dann steht hier, wo die Zeit hingeht.';
  if(bild>text*2&&bild>15000)
    return 'Der Bilddienst ist der langsame Teil. Daran ändert der Generator nichts: kleinere Bildgröße, '+
           'ein höherer Bild-Takt oder eine andere Quelle in ⚙ EINSTELLUNGEN helfen.';
  if(CFG.bildBot&&S.msRegie>4000)
    return 'Der Bildregie-Bot kostet vor jedem Bild einen eigenen Textaufruf. Ausschalten macht die Bilder '+
           'schneller, aber ungenauer zum Moment.';
  if(CFG.lektor&&S.msLektor>4000)
    return 'Der Lektor verdoppelt die Wartezeit je Zug. Er ist es meist wert — abschalten geht in ⚙ EINSTELLUNGEN.';
  if(text>25000)
    return 'Der Textdienst von Perchance antwortet gerade langsam. Das liegt an seiner Auslastung, nicht an dieser Partie.';
  return 'Nichts Auffälliges — die Zeit verteilt sich wie erwartet.';
}
function zeigeTempo(){
  var g=el('gespraech');
  if(!g)return;
  var z=document.createElement('div');
  z.className='zeile hilfe';
  z.innerHTML='<div class="txt"><b>WO DIE ZEIT HINGEHT</b><br>'+
    tempoZeilen().map(function(r){ return escapeHtml(r[0])+': '+escapeHtml(r[1]); }).join('<br>')+
    '<br><br>'+escapeHtml(tempoUrteil())+'</div>';
  g.appendChild(z);
  scrolle();
}

// Einen alten V6-Stand einmalig auf Platz 1 heben, statt ihn liegenzulassen.
function uebernehmeAltstand(){
  try{
    var roh=localStorage.getItem('proxima_save_v6');
    if(!roh)return;
    if(leseSlot(1))return;
    var d=JSON.parse(roh);
    if(!pruefeStand(d))return;
    localStorage.setItem(SLOTS[1],JSON.stringify({version:6,zeit:Date.now(),welt:d.welt,stand:d.stand}));
  }catch(e){}
}
