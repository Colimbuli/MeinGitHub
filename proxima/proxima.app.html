<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

:root{
  --panel:#2a1c0e; --border:#6b4c2a; --gold:#d4a033; --gold2:#f0c060;
  --cream:#f5e8cc; --dim:#9a7a50; --bg:#0e0906; --rot:#9b2020;
  --hoehe:100vh;
  /* Schriften aus dem System statt von fonts.googleapis.com: Das Einbinden
     von dort schickt die IP-Adresse jedes Besuchers an Google — dafuer gab es
     in Deutschland Abmahnungen. Wer Cinzel und EB Garamond zurueckwill, legt
     sie selbst gehostet daneben; ein Link zu Google gehoert nicht hierher. */
  --schrift-titel:'Palatino Linotype','Book Antiqua',Palatino,'Iowan Old Style','URW Palladio L',Georgia,serif;
  --schrift-text:Garamond,Baskerville,'Hoefler Text','Times New Roman',Georgia,serif;
}
@supports(height:100dvh){:root{--hoehe:100dvh;}}

html,body{width:100%;height:var(--hoehe);background:var(--bg);font-family:var(--schrift-text);color:var(--cream);overflow:hidden;}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

/* ── STARTSCREEN ── */
#start{position:fixed;inset:0;height:var(--hoehe);background:radial-gradient(ellipse at center,#2a1c0e 0%,#0e0906 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;padding:24px 20px 40px;text-align:center;z-index:200;
  overflow-y:auto;overscroll-behavior:contain;transition:opacity 0.5s;}
#start::before{content:'';display:block;flex:1 0 12px;}
#start::after{content:'';display:block;flex:1 0 12px;}
#start.aus{opacity:0;pointer-events:none;}
#start h1{font-family:var(--schrift-titel);font-size:clamp(2.5rem,10vw,5rem);font-weight:700;color:var(--gold2);text-shadow:0 0 40px rgba(212,160,51,0.5);letter-spacing:0.22em;}
.sub{font-family:var(--schrift-titel);font-size:clamp(0.55rem,1.6vw,0.75rem);color:var(--dim);letter-spacing:0.22em;}
#eingabe-wrap{display:flex;gap:8px;align-items:stretch;max-width:480px;width:100%;}
#begriffe{flex:1;background:rgba(42,28,14,0.8);border:1px solid var(--border);color:var(--cream);font-family:var(--schrift-text);font-size:0.95rem;padding:8px 12px;outline:none;resize:none;line-height:1.5;}
#begriffe::placeholder{color:var(--dim);}
#wuerfelBtn{background:none;border:1px solid var(--border);color:var(--gold2);font-size:1.4rem;padding:6px 12px;cursor:pointer;flex-shrink:0;}
#wuerfelBtn:hover{background:rgba(212,160,51,0.1);}
#wuerfelStatus{font-family:var(--schrift-titel);font-size:0.62rem;letter-spacing:0.14em;color:var(--dim);min-height:1em;}
.startreihe{display:flex;gap:8px;align-items:center;max-width:480px;width:100%;flex-wrap:wrap;}
.startreihe label{font-family:var(--schrift-titel);font-size:0.62rem;letter-spacing:0.14em;color:var(--dim);flex-shrink:0;}
#stilwahl,#quelleKurz{background:rgba(42,28,14,0.8);border:1px solid var(--border);color:var(--cream);font-family:var(--schrift-text);font-size:0.88rem;padding:6px 10px;outline:none;cursor:pointer;flex:1;min-width:150px;}
#stilwahl option,#quelleKurz option{background:var(--panel);}
#stilEigen{background:rgba(42,28,14,0.8);border:1px solid var(--border);color:var(--cream);font-family:var(--schrift-text);font-size:0.88rem;padding:6px 10px;outline:none;width:100%;}
#stilEigen:focus,#stilwahl:focus{border-color:var(--gold);}
.klein{background:none;border:1px solid var(--border);color:var(--dim);font-family:var(--schrift-titel);font-size:0.6rem;letter-spacing:0.1em;padding:6px 10px;cursor:pointer;flex-shrink:0;}
.klein:hover{color:var(--gold2);border-color:var(--gold);}
.gbtn{background:none;border:2px solid var(--gold);color:var(--gold2);font-family:var(--schrift-titel);font-size:clamp(0.82rem,2.4vw,0.98rem);letter-spacing:0.16em;padding:12px 30px;cursor:pointer;transition:all 0.2s;}
.gbtn:hover{background:rgba(212,160,51,0.1);}
.gbtn:disabled{opacity:0.5;cursor:default;}
#ladebereich{display:none;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:480px;}
#ladelabel{font-family:var(--schrift-titel);font-size:0.68rem;letter-spacing:0.18em;color:var(--dim);min-height:1.2em;}
#ladebar{width:100%;height:4px;background:rgba(107,76,42,0.3);overflow:hidden;position:relative;}
#ladefill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));width:0%;transition:width 0.5s;}
#ladebar.scan::after{content:'';position:absolute;left:-50%;top:0;bottom:0;width:50%;background:linear-gradient(90deg,transparent,var(--gold2),transparent);animation:scan 1.3s linear infinite;}
@keyframes scan{to{left:150%;}}
#storybox{background:rgba(42,28,14,0.88);border:1px solid var(--border);padding:12px 16px;max-width:520px;width:100%;font-size:0.84rem;line-height:1.7;font-style:italic;display:none;text-align:left;}
#storybox strong{font-style:normal;color:var(--gold2);font-family:var(--schrift-titel);font-size:0.8em;letter-spacing:0.1em;}
#storybox .storyhinweis{font-style:normal;color:var(--dim);font-size:0.68rem;margin:6px 0;letter-spacing:0.02em;}
#storybox .storyedit{width:100%;min-height:9rem;background:rgba(0,0,0,0.28);border:1px solid var(--border);color:var(--cream);font-family:var(--schrift-text);font-style:italic;font-size:0.84rem;line-height:1.6;padding:8px 10px;outline:none;resize:vertical;}
#storybox .storyedit:focus{border-color:var(--gold);}
#fehlerbox{display:none;background:rgba(155,32,32,0.15);border:1px solid var(--rot);color:#e0a0a0;padding:8px 12px;max-width:480px;width:100%;font-size:0.78rem;text-align:left;}

/* ── BÜHNE ── */
#buehne{position:fixed;inset:0;height:var(--hoehe);z-index:0;}
#buehne img{width:100%;height:100%;object-fit:contain;object-position:center top;display:block;cursor:zoom-in;transition:opacity 0.6s;}
#szenelade{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;font-family:var(--schrift-titel);font-size:0.7rem;letter-spacing:0.2em;color:var(--dim);display:none;pointer-events:none;text-shadow:0 2px 8px #000;}
#szenelade.an{display:block;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:0.4;}50%{opacity:1;}}
#vignette{position:fixed;inset:0;height:var(--hoehe);z-index:1;pointer-events:none;background:linear-gradient(to bottom,rgba(14,9,6,0.5) 0%,transparent 20%,transparent 60%,rgba(14,9,6,0.45) 100%),radial-gradient(ellipse at center,transparent 45%,rgba(6,4,2,0.45) 100%);}

/* ── SPIEL ── */
#spiel{position:fixed;inset:0;height:var(--hoehe);z-index:10;display:none;flex-direction:column;pointer-events:none;}
#spiel.aktiv{display:flex;}
#oben{flex:1;position:relative;pointer-events:none;min-height:0;}
/* Kopfbereich als echte Reihenfolge statt uebereinandergelegter Ebenen:
   Werkzeuge und NPC-Anzeige teilen sich die erste Zeile, der Titel steht
   darunter. Sonst laeuft der Titel auf schmalen Displays hinter die Knoepfe. */
#kopf{position:absolute;top:0;left:0;right:0;z-index:6;pointer-events:none;padding:6px 8px 0;display:flex;flex-direction:column;}
#kopfInhalt{max-height:70vh;overflow:hidden;transition:max-height 0.3s ease,opacity 0.22s ease;}
#kopf.zu #kopfInhalt{max-height:0;opacity:0;}
#kopfschalter{align-self:center;margin-top:3px;pointer-events:all;background:rgba(42,28,14,0.86);border:1px solid var(--border);color:var(--gold2);font-family:var(--schrift-titel);font-size:0.72rem;line-height:1;padding:3px 18px;cursor:pointer;border-radius:0 0 4px 4px;opacity:0.8;transition:all 0.15s;}
#kopfschalter:hover{background:rgba(212,160,51,0.14);border-color:var(--gold);opacity:1;}
#kopfreihe{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
#raumtitel{font-family:var(--schrift-titel);font-size:clamp(0.75rem,1.9vw,1.05rem);font-weight:700;letter-spacing:0.18em;color:var(--gold2);text-shadow:0 0 14px rgba(212,160,51,0.6),0 2px 6px rgba(0,0,0,0.9);text-align:center;padding:8px 4px 0;pointer-events:none;}
#werkzeuge{flex:0 0 auto;pointer-events:all;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;max-width:62%;}
/* Festes Raster statt Padding: ein Zeichen quadratisch (1:1), die beiden
   beschrifteten Knoepfe doppelt so breit wie hoch (1:2). Mit Padding zoege der
   Text die Breite sonst wieder auseinander. */
#werkzeuge button{background:rgba(42,28,14,0.82);border:1px solid var(--border);color:var(--gold2);font-family:var(--schrift-titel);font-size:0.65rem;letter-spacing:0.08em;cursor:pointer;transition:background 0.15s,border-color 0.15s;
  width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;line-height:1;flex:0 0 auto;overflow:hidden;}
#werkzeuge button.breit{width:60px;}
#werkzeuge button svg{display:block;}
#werkzeuge button:hover{background:rgba(212,160,51,0.12);border-color:var(--gold);}
#werkzeuge button:disabled{opacity:0.3;cursor:default;}
#autobtn.an{background:var(--gold);color:#2a1c0e;border-color:var(--gold2);}
#npcstatus{flex:1 1 auto;min-width:0;pointer-events:auto;background:rgba(6,4,2,0.7);border:1px solid var(--border);border-radius:3px;padding:4px 8px;font-family:var(--schrift-titel);font-size:0.6rem;letter-spacing:0.06em;color:var(--dim);display:flex;flex-wrap:wrap;gap:4px 8px;align-self:flex-start;}
#npcstatus .npcchip{display:inline-flex;align-items:center;gap:5px;}
#npcstatus .npcchip.fern{opacity:0.45;}
#npcstatus .npcchip.duselbst{color:var(--gold2);}
#npcstatus .npcweg{cursor:pointer;color:var(--dim);border:1px solid var(--border);border-radius:50%;width:14px;height:14px;line-height:12px;text-align:center;font-size:0.62rem;transition:all 0.15s;}
#npcstatus .npcweg:hover{color:#e08080;border-color:var(--rot);}

/* ── DIALOG ── */
#unten{background:rgba(42,28,14,0.68);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);border-top:2px solid var(--border);flex-shrink:0;pointer-events:all;display:flex;flex-direction:column;max-height:52vh;}
#gespraech{padding:10px 14px;overflow-y:auto;flex:1;min-height:120px;max-height:32vh;display:flex;flex-direction:column;gap:8px;}
.zeile{display:flex;flex-direction:column;gap:2px;}
.zeile .wer{font-family:var(--schrift-titel);font-size:0.6rem;letter-spacing:0.12em;}
.zeile.npc .wer{color:var(--gold);}
.zeile.ich .wer{color:var(--dim);text-align:right;}
.zeile .txt{font-size:clamp(0.82rem,1.6vw,0.96rem);line-height:1.55;}
.zeile.npc .txt{color:var(--cream);font-style:italic;}
.zeile.ich .txt{color:var(--gold2);text-align:right;}
.zeile .txt .aktion{color:var(--dim);font-style:italic;}
.zeile.sys .txt{color:var(--dim);font-style:italic;text-align:center;font-size:0.78rem;}
.zeile.err .txt{color:#e08080;font-style:italic;text-align:center;font-size:0.78rem;}
.zeile.hilfe .txt{color:var(--dim);font-style:normal;font-size:0.76rem;line-height:1.7;text-align:left;}
.zeile.hilfe b{color:var(--gold2);font-family:var(--schrift-titel);font-size:0.72rem;letter-spacing:0.06em;}
#tippt{color:var(--dim);font-style:italic;font-size:0.8rem;padding:2px 0;}
#interakt{border-top:1px solid var(--border);background:rgba(0,0,0,0.15);padding:8px 10px;display:flex;flex-direction:column;gap:7px;}
#freitext-wrap{display:flex;gap:7px;}
#freitext{flex:1;background:rgba(0,0,0,0.4);border:1px solid var(--border);color:var(--cream);font-family:var(--schrift-text);font-size:0.9rem;padding:8px 11px;outline:none;min-width:0;}
#freitext:focus{border-color:var(--gold);}
#freitext::placeholder{color:var(--dim);}
#sendBtn{background:none;border:1px solid var(--gold);color:var(--gold2);font-family:var(--schrift-titel);font-size:0.72rem;letter-spacing:0.08em;padding:6px 16px;cursor:pointer;flex-shrink:0;transition:all 0.13s;}
#sendBtn:hover{background:rgba(212,160,51,0.12);}
#sendBtn:disabled{opacity:0.4;cursor:default;}

/* ── MODALE (ein Bauplan für alle) ── */
/* Muss ueber dem Startbildschirm liegen (z-index 200), sonst oeffnen sich
   Spielstand- und Einstellungsmenue unsichtbar dahinter. */
.modal{display:none;position:fixed;inset:0;height:var(--hoehe);background:rgba(6,4,2,0.9);align-items:center;justify-content:center;z-index:300;pointer-events:all;padding:12px;}
.modal.an{display:flex;}
.modalBox{background:var(--panel);border:1px solid var(--gold);box-shadow:0 0 80px rgba(212,160,51,0.15);max-width:min(520px,94vw);width:100%;max-height:86vh;display:flex;flex-direction:column;}
.modalKopf{font-family:var(--schrift-titel);font-size:0.72rem;letter-spacing:0.18em;color:var(--gold);padding:10px 14px 8px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px;}
.modalKopf button{background:none;border:none;color:var(--dim);font-size:1rem;cursor:pointer;transition:color 0.14s;}
.modalKopf button:hover{color:var(--gold2);}
.modalInhalt{padding:14px 16px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:6px;}
.modalInhalt.fliess{font-size:0.88rem;line-height:1.7;font-style:italic;color:var(--cream);display:block;}
.modalNav{display:flex;border-top:1px solid var(--border);flex-wrap:wrap;}
.modalNav button{flex:1 1 40%;background:none;border:none;border-right:1px solid rgba(107,76,42,0.3);color:var(--dim);font-family:var(--schrift-titel);font-size:0.62rem;letter-spacing:0.1em;padding:10px 6px;cursor:pointer;transition:all 0.14s;}
.modalNav button:last-child{border-right:none;}
.modalNav button.haupt{color:var(--gold2);}
.modalNav button:hover{color:var(--gold2);background:rgba(212,160,51,0.06);}
.feldlabel{display:block;font-family:var(--schrift-titel);font-size:0.55rem;letter-spacing:0.1em;color:var(--dim);margin:6px 0 2px;}
.feld{width:100%;background:rgba(0,0,0,0.4);border:1px solid var(--border);color:var(--cream);font-family:var(--schrift-text);font-size:0.88rem;padding:7px 9px;outline:none;resize:vertical;line-height:1.45;}
.feld:focus{border-color:var(--gold);}
select.feld{cursor:pointer;}
select.feld option{background:var(--panel);}
.figblock{border:1px solid rgba(107,76,42,0.4);border-radius:3px;padding:8px 10px;margin-bottom:8px;}
.hilfeabschnitt{font-family:var(--schrift-titel);font-size:0.62rem;letter-spacing:0.14em;color:var(--gold2);margin:12px 0 6px;}
.hilfeabschnitt:first-child{margin-top:0;}
.hilfezeile{display:flex;gap:10px;align-items:baseline;padding:3px 0;border-bottom:1px solid rgba(107,76,42,0.22);}
.hilfezeile:last-child{border-bottom:none;}
.hilfebefehl{flex:0 0 40%;color:var(--gold2);font-size:0.82rem;word-break:break-word;}
.hilfetext{flex:1;color:var(--cream);font-size:0.8rem;line-height:1.45;}
.hilfeabsatz{font-size:0.82rem;line-height:1.6;color:var(--cream);}
.hilfeabsatz b{color:var(--gold2);}
.figtitel{font-family:var(--schrift-titel);font-size:0.66rem;letter-spacing:0.14em;color:var(--gold2);margin-bottom:5px;}
.reihe{display:flex;gap:7px;}
.reihe .feld{flex:1;}
.reihe button{background:none;border:1px solid var(--border);color:var(--gold2);font-size:1.05rem;padding:4px 11px;cursor:pointer;flex-shrink:0;}
.reihe button:hover{background:rgba(212,160,51,0.1);}
.hinweis{font-size:0.72rem;line-height:1.55;color:var(--dim);font-style:italic;}
.warnung{font-size:0.72rem;line-height:1.55;color:#d8a86a;border-left:2px solid var(--border);padding-left:8px;}
.pruefzeile{font-family:var(--schrift-titel);font-size:0.62rem;letter-spacing:0.08em;color:var(--dim);min-height:1.1em;}
.pruefzeile.ok{color:#8fbf6a;}
.pruefzeile.fehler{color:#e08080;}
.raumgitter{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
.raumkachel{border:1px solid rgba(107,76,42,0.4);padding:8px 9px;display:flex;flex-direction:column;gap:6px;}
.raumkachel.hier{border-color:var(--gold2);background:rgba(212,160,51,0.07);}
.raumkopf{font-family:var(--schrift-titel);font-size:0.6rem;letter-spacing:0.12em;color:var(--gold2);}
.raumleute{display:flex;flex-wrap:wrap;gap:4px;min-height:20px;}
.raumleer{color:var(--dim);font-size:0.72rem;font-style:italic;}
.raumperson{border:1px solid rgba(107,76,42,0.5);padding:2px 6px;font-size:0.72rem;color:var(--cream);}
.raumperson.duselbst{border-color:var(--gold2);color:var(--gold2);}
.raumkachel button{background:none;border:1px solid var(--border);color:var(--gold2);font-family:var(--schrift-titel);font-size:0.56rem;letter-spacing:0.08em;padding:5px 6px;cursor:pointer;}
.raumkachel button:hover{background:rgba(212,160,51,0.1);}
.raumkachel button:disabled{opacity:0.3;cursor:default;}
.raumkachel select{background:var(--tinte);border:1px solid var(--border);color:var(--cream);font-size:0.72rem;padding:3px;width:100%;}
.slot{display:flex;gap:6px;align-items:center;border:1px solid rgba(107,76,42,0.4);padding:7px 9px;}
.slot .slotinfo{flex:1;min-width:0;font-size:0.78rem;line-height:1.35;}
.slot .slotinfo small{display:block;color:var(--dim);font-size:0.66rem;}
.slot button{background:none;border:1px solid var(--border);color:var(--gold2);font-family:var(--schrift-titel);font-size:0.58rem;letter-spacing:0.08em;padding:5px 8px;cursor:pointer;}
.slot button:hover{background:rgba(212,160,51,0.1);}
.slot button:disabled{opacity:0.3;cursor:default;}

::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
</style>

<!-- BÜHNE -->
<div id="buehne"><img id="img0" src="" alt="Szenenbild" onclick="oeffneBildModal()"></div>
<div id="szenelade">✦ SZENE ENTSTEHT… ✦</div>
<div id="vignette"></div>

<!-- STARTSCREEN -->
<div id="start">
  <div class="sub">EIN DIALOG-ABENTEUER &middot; V7.46</div>
  <h1>PROXIMA</h1>
  <div id="eingabe-wrap">
    <textarea id="begriffe" rows="3" placeholder="Schreibe eine Story-Idee – oder würfle einen Vorschlag mit ⚄"></textarea>
    <button id="wuerfelBtn" onclick="wuerfeln()" title="KI-Vorschlag würfeln">⚄</button>
  </div>
  <div id="wuerfelStatus"></div>
  <div class="startreihe">
    <label for="stilwahl">BILDSTIL</label>
    <select id="stilwahl" onchange="stilGewechselt()">
      <option value="manga" selected>Manga / Anime</option>
      <option value="comic">Westlicher Comic</option>
      <option value="aquarell">Aquarell</option>
      <option value="oel">Ölgemälde</option>
      <option value="realistisch">Fotorealistisch</option>
      <option value="pixel">Pixel-Art</option>
      <option value="eigen">Eigener Stil…</option>
    </select>
    <input id="stilEigen" type="text" placeholder="z.B. noir ink sketch, high contrast" style="display:none">
  </div>
  <div class="startreihe">
    <label for="geschlechtwahl">DU BIST</label>
    <select id="geschlechtwahl" class="feld" style="flex:1;min-width:150px">
      <option value="">egal — die KI entscheidet</option>
      <option value="maennlich">männlich</option>
      <option value="weiblich">weiblich</option>
      <option value="divers">divers</option>
    </select>
  </div>
  <div class="startreihe">
    <label for="perspektive">ERZÄHLWEISE</label>
    <select id="perspektive" class="feld" style="flex:1;min-width:150px">
      <option value="er" selected>Er-Perspektive — dein Held ist im Bild zu sehen</option>
      <option value="ich">Ich-Perspektive — du siehst durch seine Augen</option>
    </select>
  </div>
  <div class="startreihe">
    <label for="quelleKurz">BILDQUELLE</label>
    <select id="quelleKurz" onchange="quelleKurzGewechselt()"></select>
    <button class="klein" onclick="oeffneEinstellungen()">EINSTELLEN…</button>
  </div>
  <button class="gbtn" id="erstellbtn" onclick="weltErstellen()">✦ WELT ERSCHAFFEN ✦</button>
  <button class="gbtn" id="ladebtn" onclick="oeffneSpeicher()" style="display:none">⟳ SPIELSTAND LADEN</button>
  <div id="ladebereich">
    <div id="ladelabel">ERSCHAFFE…</div>
    <div id="ladebar" class="scan"><div id="ladefill"></div></div>
  </div>
  <div id="fehlerbox"></div>
  <div id="storybox"></div>
  <button class="gbtn" id="spielbtn" onclick="spielStarten()" style="display:none">▶︎ ABENTEUER BEGINNEN</button>
</div>

<!-- SPIEL -->
<div id="spiel">
  <div id="oben">

<script>
// ═══════════════════════════════════════════════
//  PROXIMA V7 — Ein Ort, mehrere autonome Figuren
//  Freitext-Dialog, Schlagabtausch, Stimmung, Kleidung,
//  austauschbare Bildquellen, Spielstände, Undo
// ═══════════════════════════════════════════════

var MAX_NPCS   = 4;    // wie viele Figuren gleichzeitig am Ort sein duerfen
var MAX_ZUEGE  = 3;    // max. NPC-Zeilen pro Spielereingabe
var MAX_FAKTEN = 24;   // Groesse des Langzeitgedaechtnisses
var MAX_UNDO   = 12;   // wie viele Zuege zuruecknehmbar sind

var WOERTER1 = ['Venedig','Prag','Edinburgh','Lissabon','Budapest','Wien','Sevilla','Dubrovnik','Athen','Istanbul'];
var WOERTER2 = ['Detektiv','Kammerjäger','Bibliothekar','Uhrmacher','Alchemist','Schreiner','Apotheker','Kartograph','Seemann','Puppenmacher'];
var WOERTER3 = ['Verschwörung','Diebstahl','Fluch','Geheimnis','Entführung','Prophezeiung','Intrige','Ritual'];

// ── STILE ─────────────────────────────────────
// Kurz halten: lange Stiltexte verwaessern Identitaet und Szene.
// Was ein Bild NICHT haben soll, gehoert in den Negativprompt (CFG.negativ), nicht hierher.
var STILE = {
  manga:       'anime manga style, cel shaded, clean bold linework, vibrant colors, expressive face',
  comic:       'western comic book style, bold ink outlines, dynamic shading, saturated colors',
  aquarell:    'watercolor painting, soft washes, delicate brushwork, muted colors, textured paper',
  oel:         'classical oil painting, rich texture, dramatic chiaroscuro lighting, painterly brushstrokes',
  realistisch: 'candid 35mm film photograph, Fujifilm Provia, natural light, fine film grain, documentary realism',
  pixel:       'detailed pixel art, 16-bit retro game style, limited palette, crisp pixels',
  // Illustrious- und Pony-Ableger reagieren auf Tag-Ketten deutlich besser als
  // auf Prosa; die Qualitaets-Tags am Anfang sind dort ueblich.
  illustrious: 'masterpiece, best quality, amazing quality, very aesthetic, absurdres, highly detailed, anime style'
};
var STIL_NEGATIV = {
  realistisch: 'illustration, painting, drawing, 3d render, cgi, airbrushed skin, retouched, plastic skin, over-sharpened, hdr'
};

function aktuellerStil(){
  if(S.stil)return S.stil;   // im Chat per /stil: gesetzt
  var wahl=el('stilwahl')?el('stilwahl').value:'manga';
  if(wahl==='eigen'){
    var eigen=el('stilEigen')?el('stilEigen').value.trim():'';
    return eigen||STILE.manga;
  }
  return STILE[wahl]||STILE.manga;
}
function aktuellerStilSchluessel(){
  if(S.stilLabel && STILE[S.stilLabel])return S.stilLabel;
  var wahl=el('stilwahl')?el('stilwahl').value:'manga';
  return STILE[wahl]?wahl:'';
}
// Wer auf "Eigener Stil" umschaltet, will meistens den bisherigen Stil
// nachbessern und nicht bei null anfangen. Also steht der Prompt, der eben noch
// galt, schon im Feld - solange dort nichts Selbstgeschriebenes steht.
var STIL_ZULETZT={stilwahl:'manga',szeneStil:'manga'};
function stilVorschlag(selId){
  var k=STIL_ZULETZT[selId];
  return STILE[k]||S.stil||STILE.manga;
}
// Unberuehrt ist ein Feld, das leer ist oder woertlich einen der Vorgabe-Stile
// enthaelt - dann darf nachgefuellt werden, ohne eigene Arbeit zu ueberschreiben.
function stilFeldUnberuehrt(t){
  t=String(t||'').trim();
  if(!t)return true;
  return Object.keys(STILE).some(function(k){ return STILE[k]===t; });
}
function stilFeldPflegen(selId,feldId,fokus){
  var sel=el(selId), feld=el(feldId);
  if(!sel||!feld)return;
  var eigen=(sel.value==='eigen');
  feld.style.display=eigen?'block':'none';
  if(!eigen){ STIL_ZULETZT[selId]=sel.value; return; }
  if(stilFeldUnberuehrt(feld.value))feld.value=stilVorschlag(selId);
  if(fokus)feld.focus();
}
function stilGewechselt(){ stilFeldPflegen('stilwahl','stilEigen',true); }

// ── KONFIGURATION (gilt generatorweit, nicht pro Spielstand) ──
var CFG_KEY='proxima_cfg_v1';
var CFG={
  quelle:'perchance',
  breite:1024, hoehe:1024,
  negativ:'low quality, worst quality, blurry, deformed, bad anatomy, extra limbs, extra fingers, text, watermark, signature',
  kopfOffen:true,  // Kopfleiste aus- oder eingeklappt
  autoHeld:true,   // im Auto-Modus handelt der Held selbst mit
  autoBesetzung:true, // Figuren treten auf und ab, wenn die Handlung es erzaehlt
  bildBot:false,   // eigener KI-Aufruf sucht das Bild zum Moment (kostet einen Aufruf je Bild)
  lektor:false,    // zweiter KI-Aufruf prueft die Antwort, bevor sie erscheint
  tempo:16,        // ms pro Zeichen im Schreibmaschinen-Effekt (0 = sofort)
  bildTakt:2,      // alle N Zuege ein neues Bild (0 = nur auf Zuruf)
  ton:'natuerlich',// Tonfall der Figuren: natuerlich, frivol, sachlich oder eigen
  tonText:'',      // bei 'eigen' der selbst geschriebene Wortlaut
  wuerfel:true,    // Handlungen des Helden koennen misslingen
  geschlecht:'',   // zuletzt gewaehltes Geschlecht des Helden (leer = KI entscheidet)
  pollModell:'',
  hordeKey:'0000000000', hordeModell:'', hordeSchritte:25,
  apiUrl:'https://api.openai.com/v1', apiKey:'', apiModell:'gpt-image-1',
  urlVorlage:'https://example.org/bild?p={prompt}&seed={seed}&w={breite}&h={hoehe}',
  gradioHost:'https://ibarakidouji-wai-nsfw-illustrious-sdxl.hf.space',
  gradioApi:'/generate', gradioFnIndex:'', gradioToken:'', gradioBreite:1024, gradioHoehe:1024,
  gradioVorlage:'["{prompt}", "{negativ}", {seed}, false, {breite}, {hoehe}, {guidance}, 28]',
  gradioReferenz:false,      // Referenzbild mitschicken (img2img)
  gradioStaerke:0.65,        // wie stark das neue Bild vom Referenzbild abweichen darf
  gradioReferenzForm:'roh'   // 'roh' = Data-URL, 'datei' = Gradio-Dateiobjekt
};
function ladeCfg(){
  try{
    var roh=localStorage.getItem(CFG_KEY);
    if(!roh)return;
    var d=JSON.parse(roh);
    Object.keys(CFG).forEach(function(k){ if(d[k]!==undefined&&d[k]!==null)CFG[k]=d[k]; });
  }catch(e){}
}
function speichereCfg(){
  try{ localStorage.setItem(CFG_KEY,JSON.stringify(CFG)); }catch(e){}
}

// ── BILDQUELLEN ───────────────────────────────
// Jede Quelle bekommt {prompt, negativ, seed, breite, hoehe} und liefert eine
// Bildadresse zurueck (data:-URL oder http-URL). Neue Quelle = ein Eintrag hier.
var BILDQUELLEN={
  perchance:{
    label:'Perchance (Standard, ohne Schlüssel)',
    info:'Nutzt das eingebaute Bild-Plugin des Generators. Kein Schlüssel, keine Fremdserver.',
    felder:[],
    zeichne:async function(a){
      if(typeof image!=='function')throw new Error('image() ist nicht verfügbar — Bild-Plugin im Generator eingebunden? — '+pluginLage());
      var p=a.prompt+(a.negativ?' (negativePrompt:::'+a.negativ+')':'')+' (seed:::'+a.seed+')';
      var r=await image({prompt:p});
      var src=r&&(r.dataUrl||r.url||r.imageUrl||r.src);
      if(!src)throw new Error('Bild-Plugin lieferte keine Bilddaten.');
      return src;
    }
  },
  pollinations:{
    label:'Pollinations (frei, ohne Schlüssel)',
    maxPrompt:550,
    info:'Offener Dienst, die Beschreibung steckt in der Adresse — deshalb wird der Prompt gekürzt. Kein Negativprompt. Bei HTTP 500 hilft meist: Modellfeld leeren, Bildgröße auf 512×512, oder im Bildmenü einen neuen Seed würfeln.',
    felder:[{k:'pollModell',l:'Modell (leer = Standard des Dienstes)',typ:'text'}],
    modellSchluessel:'pollModell',
    modelle:async function(){
      var r=await fetch('https://image.pollinations.ai/models');
      if(!r.ok)throw new Error('HTTP '+r.status);
      var j=await r.json();
      // Der Dienst liefert mal eine Liste von Namen, mal von Objekten.
      return (Array.isArray(j)?j:[]).map(function(m){
        var name=(typeof m==='string')?m:(m&&(m.name||m.id)||'');
        var zusatz=(m&&typeof m==='object'&&m.description)?(' — '+m.description):'';
        return {wert:name,label:name+zusatz};
      }).filter(function(m){return m.wert;});
    },
    zeichne:async function(a){
      // Die Beschreibung steckt bei diesem Dienst im Pfad. Lange Adressen sind
      // ein bekannter Stolperstein, deshalb: knapp halten, den Negativprompt nur
      // anhaengen, wenn danach noch Luft ist, und die Laenge im Fehlerfall nennen.
      var GRENZE=1300;
      var bau=function(seed,mitNegativ){
        var u='https://image.pollinations.ai/prompt/'+encodeURIComponent(a.prompt)+
              '?width='+a.breite+'&height='+a.hoehe+'&seed='+seed+
              (CFG.pollModell?'&model='+encodeURIComponent(CFG.pollModell):'');
        if(mitNegativ&&a.negativ){
          var mitNeg=u+'&negative_prompt='+encodeURIComponent(a.negativ);
          if(mitNeg.length<=GRENZE)u=mitNeg;
        }
        return u;
      };
      var seed=seedFuerDienst(a.seed);
      var ersteUrl=bau(seed,true);
      try{
        return await ladeBildUrl(ersteUrl,120000);
      }catch(e){
        var meldung=String((e&&e.message)||e);
        // 429 heisst: zu viele Anfragen. Ein sofortiger zweiter Versuch macht es
        // schlimmer, also gar nicht erst nachfassen.

// Gradio-Spaces erwarten ihre Eingaben als Liste in fester Reihenfolge, die je
// Space anders ist. Deshalb eine Vorlage, in die die Werte eingesetzt werden.
function gradioDaten(vorlage,a){
  // Platzhalter fuer Werte, die selbst schon JSON sind (Bild, Zahl), werden
  // MIT und OHNE Anfuehrungszeichen ersetzt - sonst haengt es davon ab, wie
  // jemand die Vorlage getippt hat, und JSON.parse wirft.
  var referenz=JSON.stringify(a.referenz==null?null:a.referenz);
  var staerke=String(isFinite(parseFloat(a.staerke))?parseFloat(a.staerke):0.65);
  var guidance=String(guidanceWert(a.guidance));
  var t=String(vorlage||'[]')
    .replace(/"\{prompt\}"/g,JSON.stringify(String(a.prompt||'')))
    .replace(/"\{negativ\}"/g,JSON.stringify(String(a.negativ||'')))
    .replace(/\{seed\}/g,String(seedFuerDienst(a.seed)))
    .replace(/\{breite\}/g,String(auf64(a.breite)))
    .replace(/\{hoehe\}/g,String(auf64(a.hoehe)))
    .replace(/"\{referenz\}"/g,referenz).replace(/\{referenz\}/g,referenz)
    .replace(/"\{staerke\}"/g,staerke).replace(/\{staerke\}/g,staerke)
    .replace(/"\{guidance\}"/g,guidance).replace(/\{guidance\}/g,guidance)
    .replace(/"\{cfg\}"/g,guidance).replace(/\{cfg\}/g,guidance);
  var d=JSON.parse(t);
  if(!Array.isArray(d))throw new Error('Die Parameter-Vorlage muss eine Liste sein, z.B. ["{prompt}", 0].');
  return d;
}
// Die Antwort ist je nach Gradio-Fassung verschieden verpackt: mal eine
// data:-Adresse, mal {url:…}, mal {path:'/tmp/…'}. Erste brauchbare gewinnt.
function bildAusGradio(daten,host){
  var treffer=null;
  (function suche(x){
    if(treffer||x==null)return;
    if(typeof x==='string'){
      if(/^data:image/i.test(x))treffer=x;
      else if(/^https?:\/\//i.test(x))treffer=x;
      else if(x.charAt(0)==='/')treffer=host+'/gradio_api/file='+x;
      return;
    }
    if(Array.isArray(x)){ for(var i=0;i<x.length&&!treffer;i++)suche(x[i]); return; }
    if(typeof x==='object'){
      if(typeof x.url==='string'&&x.url){ treffer=x.url; return; }
      if(typeof x.path==='string'&&x.path){ treffer=host+'/gradio_api/file='+x.path; return; }
      if(typeof x.name==='string'&&x.name){ treffer=host+'/file='+x.name; return; }
      var k=Object.keys(x);
      for(var j=0;j<k.length&&!treffer;j++)suche(x[k[j]]);
    }
  })(daten);
  return treffer;
}
// Der Queue-Strom schickt je Zeile ein Objekt: estimation, process_starts,
// zuletzt process_completed mit den Ausgabedaten.
function gradioQueueErgebnis(text){
  var ergebnis=null, fehler=null;
  String(text||'').split('\n').forEach(function(z){
    z=z.trim();
    if(z.indexOf('data:')!==0)return;
    var o=null;
    try{ o=JSON.parse(z.substring(5).trim()); }catch(e){ return; }
    if(!o||typeof o!=='object')return;
    if(o.msg==='process_completed'){
      if(o.success===false){
        fehler=(o.output&&(o.output.error||o.output.detail||o.output.message))||'';
        if(!fehler){
          // Ohne Klartext wenigstens zeigen, was der Space geschickt hat.
          try{ fehler='ohne Klartext, Rohmeldung: '+JSON.stringify(o.output||o).substring(0,200); }
          catch(e1){ fehler='Der Space meldete einen Fehler.'; }
        }
      }else ergebnis=(o.output&&o.output.data)||o.output||null;
    }else if(o.msg==='unexpected_error'||o.msg==='queue_full'){
      fehler=o.message||o.msg;
    }
  });
  if(fehler)throw new Error(String(fehler).substring(0,260));
  return ergebnis;
}
function sitzungsNummer(){
  return Math.random().toString(36).substring(2)+Date.now().toString(36);
}
// Passenden Endpunkt aus /config waehlen. Steht im Feld Unsinn (leer, "False",
// ein Tippfehler), wird nicht abgebrochen, sondern der plausibelste genommen -
// Hilfsendpunkte wie lambda oder load_example aber nie.
function waehleEndpunkt(deps,wunsch){
  var liste=(deps||[]).map(function(d,i){
    return {name:String(d.api_name||'').replace(/^\//,''),id:(d.id!=null?d.id:i)};
  }).filter(function(d){return d.name;});
  if(!liste.length)return null;
  var g=String(wunsch||'').replace(/^\//,'').trim();
  var passt=function(pruef){ return liste.filter(pruef)[0]||null; };
  if(g&&!/^(false|true|undefined|null|nan)$/i.test(g)){
    var genau=passt(function(d){return d.name===g;});
    if(genau)return genau;
  }
  return passt(function(d){return /^(generate|infer|predict|txt2img|run)$/i.test(d.name);})
      || passt(function(d){return /generat|infer|predict|img|image/i.test(d.name);})
      || null;
}
// fn_index aus /config holen: dort steht zu jedem api_name die passende id.
async function gradioFnIndex(host,api,kopf){
  if(CFG.gradioFnIndex!==''&&CFG.gradioFnIndex!=null&&!isNaN(parseInt(CFG.gradioFnIndex,10)))
    return parseInt(CFG.gradioFnIndex,10);
  var r=await fetch(host+'/config',{headers:kopf});
  if(!r.ok)throw new Error('/config nicht abrufbar (HTTP '+r.status+') - fn_index bitte von Hand eintragen.');
  var c=await r.json();
  var deps=(c&&c.dependencies)||[];
  var ep=waehleEndpunkt(deps,api);
  if(!ep)throw new Error('Kein brauchbarer Endpunkt in /config. Vorhanden: '+
    deps.map(function(d){return d.api_name;}).filter(Boolean).join(', '));
  var gesucht=String(api||'').replace(/^\//,'').trim();
  if(ep.name!==gesucht){
    sysZeile('Endpunkt "'+ep.name+'" statt "'+(gesucht||'(leer)')+'" verwendet.');
    CFG.gradioApi='/'+ep.name;speichereCfg();
  }
  return ep.id;
}
// Aus der Parameterliste von /gradio_api/info eine Vorlage bauen.
function gradioVorlageAus(params){
  return '['+(params||[]).map(function(pa){
    var n=String(pa.parameter_name||pa.label||'').toLowerCase();
    if(/negativ/.test(n))return '"{negativ}"';        // vor prompt pruefen!
    if(/prompt/.test(n))return '"{prompt}"';
    // Ein "randomize_seed" muss aus bleiben, sonst wuerfelt der Space selbst
    // und die Figuren sehen von Bild zu Bild anders aus.
    if(/random/.test(n)&&/seed/.test(n))return 'false';
    if(/seed/.test(n))return '{seed}';
    if(/width|breite/.test(n))return '{breite}';
    if(/height/.test(n))return '{hoehe}';
    if(/guidance|cfg/.test(n))return '{guidance}';
    if(pa.parameter_has_default&&pa.parameter_default!==undefined)return JSON.stringify(pa.parameter_default);
    var t=String((pa.type&&pa.type.type)||(pa.python_type&&pa.python_type.type)||'').toLowerCase();
    if(/bool/.test(t))return 'false';
    if(/number|int|float/.test(t))return '0';
    return '""';
  }).join(', ')+']';
}
// Bessere Vorlage: die festen Werte kommen aus den Vorgaben des Space selbst
// (props.value der zugehoerigen Bedienelemente), nicht aus geratenen Zahlen.
function gradioVorlageAusConfig(params,dep,components){
  var nachId={};
  (components||[]).forEach(function(c){ nachId[c.id]=c; });
  var eingaben=(dep&&dep.inputs)||[];
  var wahlWert=function(x){
    if(Array.isArray(x))return (x.length>1&&x[1]!=null)?x[1]:x[0];
    return x;
  };
  return '['+(params||[]).map(function(pa,i){
    var n=String(pa.parameter_name||pa.label||'').toLowerCase();
    if(/negativ/.test(n))return '"{negativ}"';
    if(/random/.test(n)&&/seed/.test(n))return 'false';
    if(/prompt/.test(n))return '"{prompt}"';
    if(/seed/.test(n))return '{seed}';
    if(/width|breite/.test(n))return '{breite}';
    if(/height/.test(n))return '{hoehe}';
    if(/guidance|cfg/.test(n))return '{guidance}';
    var comp=nachId[eingaben[i]], props=(comp&&comp.props)||{};
    // Seitenverhaeltnis auf "Custom" stellen, sonst bleiben Breite und Hoehe wirkungslos.
    if(/aspect|ratio/.test(n)&&Array.isArray(props.choices)){
      var eigen=props.choices.map(wahlWert).filter(function(x){return /custom/i.test(String(x));})[0];
      if(eigen!=null)return JSON.stringify(String(eigen));
    }
    if(props.value!==undefined&&props.value!==null)return JSON.stringify(props.value);
    if(pa.parameter_has_default&&pa.parameter_default!==undefined)return JSON.stringify(pa.parameter_default);
    var t=String((pa.type&&pa.type.type)||(pa.python_type&&pa.python_type.type)||'').toLowerCase();
    if(/bool/.test(t))return 'false';
    if(/number|int|float/.test(t))return '0';
    return '""';
  }).join(', ')+']';
}
function sseDaten(text){
  // Antwortstrom: Zeilen "event: complete" und "data: [...]" — letzte gültige nehmen.
  var letzte=null;
  String(text||'').split('\n').forEach(function(z){
    z=z.trim();
    if(z.indexOf('data:')!==0)return;
    var roh=z.substring(5).trim();
    if(!roh||roh==='null')return;
    try{ letzte=JSON.parse(roh); }catch(e){}
  });
  return letzte;
}

// GPU-Pannen des Dienstes (CUDA, NVML, Speichermangel) sind nicht unsere
// Anfrage. Meist voruebergehend, ein zweiter Anlauf lohnt sich.
function istServerPanne(m){
  return /internal assert|nvml|cuda|out of memory|oom|allocator|device-side/i.test(String(m||''));
}
function quelle(){ return BILDQUELLEN[CFG.quelle]||BILDQUELLEN.perchance; }
function auf64(n){ n=Math.round((Number(n)||1024)/64)*64; return Math.max(256,Math.min(2048,n)); }
// Bild-Backends rechnen mit 32-Bit-Seeds. Aeltere Spielstaende halten
// zwoelfstellige Werte — die quittieren manche Dienste mit HTTP 500.
function seedFuerDienst(s){ return (Math.abs(parseInt(s,10)||0)%2147483647)||1; }
// Die AI Horde sperrt bei hoher Auslastung alles ueber 907x907 und ueber 50
// Schritte. Seitenverhaeltnis beibehalten, auf Vielfache von 64 runden.
function hordeMasse(breite,hoehe){
  var b=auf64(breite), h=auf64(hoehe), grenze=907*907;
  if(b*h>grenze){
    var f=Math.sqrt(grenze/(b*h));
    b=auf64(Math.floor(b*f/64)*64);
    h=auf64(Math.floor(h*f/64)*64);
    while(b*h>grenze&&(b>256||h>256)){ if(b>=h)b=Math.max(256,b-64); else h=Math.max(256,h-64); }
  }
  return {breite:b,hoehe:h};
}
// Am letzten Komma vor der Grenze kappen, damit kein Wort zerrissen wird.
function kuerzeText(p,max){
  p=String(p||'');
  if(max<=0)return '';
  if(p.length<=max)return p;
  var schnitt=p.lastIndexOf(',',max);
  return p.substring(0,schnitt>max*0.6?schnitt:max).trim();
}
// Zwei Wege, weil jeder für sich blind ist:
// 1. fetch() nennt den echten HTTP-Status und liefert das Bild als blob:-Adresse,
//    die auch dann noch anzeigbar ist, wenn fremde Bild-Hosts gesperrt sind.
// 2. Scheitert fetch an CORS, bleibt der klassische <img>-Weg — der lädt zwar,
//    verrät aber nie, woran es lag.
async function ladeBildUrl(url,timeoutMs,kopf){
  var limit=timeoutMs||90000, ersterGrund='';
  try{
    var ctl=(typeof AbortController==='function')?new AbortController():null;
    var t=ctl?setTimeout(function(){ctl.abort();},limit):null;
    var r=await fetch(url,{signal:ctl?ctl.signal:undefined,headers:kopf||{}});
    if(t)clearTimeout(t);
    if(!r.ok){
      var wartehinweis='';
      try{
        var ra=r.headers&&r.headers.get&&r.headers.get('retry-after');
        if(ra)wartehinweis=', frühestens in '+ra+'s wieder';
      }catch(e0){}
      throw new Error('Dienst antwortete HTTP '+r.status+(r.statusText?' '+r.statusText:'')+wartehinweis);
    }
    var b=await r.blob();
    if(!b||b.size<200||(b.type&&b.type.indexOf('image')!==0)){
      // Zu klein oder falscher Typ: hineinschauen, sonst raetselt man ewig.
      var probe='';
      try{ probe=(await b.text()).replace(/\s+/g,' ').substring(0,160); }catch(e2){}
      throw new Error('Antwort war kein Bild ('+(b?b.size:0)+' Bytes'+(b&&b.type?', '+b.type:'')+')'+
        (probe?': '+probe:'')+' [Adresse: '+String(url).substring(0,120)+']');
    }
    return URL.createObjectURL(b);
  }catch(e){
    ersterGrund=(e&&e.message)?e.message:String(e);
    // Ein echter Dienstfehler bleibt einer — dann nicht noch einmal probieren.
    if(/HTTP \d|kein Bild|war kein Bild/.test(ersterGrund))throw e;
  }
  return await new Promise(function(res,rej){
    var fertig=false;
    var t=setTimeout(function(){ if(!fertig){fertig=true;rej(new Error('Zeitüberschreitung nach '+Math.round(limit/1000)+'s. Vorher: '+ersterGrund));} },limit);
    var im=new Image();
    im.onload=function(){ if(fertig)return;fertig=true;clearTimeout(t);res(url); };
    im.onerror=function(){ if(fertig)return;fertig=true;clearTimeout(t);
      rej(new Error('Bild nicht ladbar. Direktabruf meldete: '+(ersterGrund||'unbekannt')+'. Prüfe URL-Länge, Dienst und ob Perchance externe Bilder zulässt.')); };
    im.src=url;
  });
}

// ── KI-WRAPPER ────────────────────────────────
function extrahiereText(x){
  if(x==null)return'';
  if(typeof x==='string')return x;
  return x.fullText||x.text||x.output||'';
}
// Das Text-Plugin von Perchance spricht ueber ein eigenes Iframe. Wird es zu
// frueh gerufen — etwa direkt nach dem Laden aus einem Elternfenster —, meldet
// es "Cannot read properties of null (reading 'contentWindow')". Das ist kein
// Fehler der Anfrage, sondern schlicht zu frueh: kurz warten und erneut fragen.
function kiNochNichtBereit(e){
  var m=String((e&&e.message)||e||'');
  return /contentWindow|streamTextFromIframe|of null|not defined/i.test(m);
}
async function frageKI(prompt,timeoutMs){
  var letzter=null;
  for(var versuch=0;versuch<3;versuch++){
    try{
      return await frageKIEinmal(prompt,timeoutMs);
    }catch(e){
      letzter=e;
      if(!kiNochNichtBereit(e))throw e;
      await warte(1200*(versuch+1));
    }
  }
  throw new Error('Das Text-Plugin von Perchance war auch nach drei Anläufen nicht bereit ('+
    ((letzter&&letzter.message)||'unbekannt')+'). Seite neu laden hilft meist. — '+pluginLage());
}
function frageKIEinmal(prompt,timeoutMs){
  var limit=timeoutMs||90000;
  return new Promise(function(resolve,reject){
    var fertig=false;
    var timer=setTimeout(function(){
      if(!fertig){fertig=true;reject(new Error('KI-Timeout ('+Math.round(limit/1000)+'s)'));}
    },limit);
    function done(txt){
      if(fertig)return;fertig=true;clearTimeout(timer);
      resolve(String(txt||'').trim());
    }
    function versucheObjektForm(){
      try{
        ai({instruction:prompt,onFinish:function(data){done(extrahiereText(data));}});
      }catch(e2){
        if(!fertig){fertig=true;clearTimeout(timer);reject(e2);}
      }
    }
    try{
      var r=ai(prompt);
      if(r&&typeof r.then==='function'){
        r.then(function(res){done(extrahiereText(res));})
         .catch(function(){versucheObjektForm();});
      }else if(typeof r==='string'&&r.length){done(r);}
      else{versucheObjektForm();}
    }catch(e){versucheObjektForm();}
  });
}

// Ein zweiter, stiller Aufruf liest die Antwort, bevor der Spieler sie sieht:
// Wiederholt sie sich? Springt eine Beziehung? Ignoriert sie Mission oder
// Probe? Nur wenn er etwas findet, schreibt er die Zeile neu.
function baueLektorAnweisung(antwort,name){

    (W.mission?'MISSION: '+kappe(W.mission,200)+'\n':'')+
    (S.aktZiel?'ANSTEHENDE ETAPPE: '+kappe(S.aktZiel,160)+'\n':'')+
    (S.probe?'PROBE: Der Versuch des Helden ist '+(S.probe.gelungen?'GELUNGEN':'MISSLUNGEN')+'.\n':'')+
    'BISHER GESAGT:\n'+verlaufText(4,160)+'\n\n'+
    'ZU PRUEFENDE ZEILE:\n'+antwort+'\n\n'+
    'Pruefe genau fuenf Dinge:\n'+
    '1. Sprache: Klingt die Zeile wie GESPROCHENE Rede? Wuerde ein Mensch in dieser Lage das wirklich so sagen? Gestelzte Bilder, erfundene Fachwoerter, mehr als ein Vergleich, Saetze wie aus einem Roman — all das muss weg.\n'+
    '2. Wiederholung: Kommt eine Formulierung oder ein Bild aus den letzten Zeilen noch einmal?\n'+
    '3. Beziehungssprung: Wird aus Hoeflichkeit ploetzlich Vertrautheit oder Verliebtheit?\n'+
    '4. Mission: Wird das Ziel voellig ignoriert, obwohl es sich anboete?\n'+
    '5. Probe: Widerspricht die Zeile dem feststehenden Ausgang?\n\n'+
    'Ist alles in Ordnung, antworte NUR mit: OK\n'+
    'Sonst antworte NUR mit der verbesserten Zeile auf Deutsch, hoechstens so lang wie das Original, '+
    'gleiche Figur, Handlungen in eckigen Klammern. Keine Erklaerung, keine Anfuehrungszeichen.';
}
function lektorAntwort(roh,original){
  var t=String(roh==null?'':roh).trim();
  t=t.replace(/^```[a-z]*\s*/i,'').replace(/```\s*$/,'').trim();
  if(!t||/^ok\b/i.test(t))return '';
  t=entkleide(t).trim();
  if(t.length<8)return '';
  if(t.length>original.length*2.2)return '';   // ein Aufsatz ist keine Korrektur
  if(t.toLowerCase()===original.toLowerCase())return '';
  return t;
}
async function lektor(antwort,name){
  if(!CFG.lektor||!antwort){ S.msLektor=0; return antwort; }
  var tLekt=Date.now();
  try{
    var roh=await frageKI(baueLektorAnweisung(antwort,name),45000);
    S.msLektor=Date.now()-tLekt;
    var besser=lektorAntwort(roh,antwort);
    if(besser){ S.lektorGriff=(S.lektorGriff||0)+1; return besser; }
  }catch(e){
    S.msLektor=Date.now()-tLekt;
    console.warn('Lektor ohne Antwort:',e);
  }
  return antwort;
}

// ── ANTWORT-PARSER ────────────────────────────
// Die KI wird um JSON gebeten. Kommt trotzdem "KEY: wert" zurueck (oder Markdown
// drumherum), faengt der Zeilen-Parser das ab, statt die Runde zu verlieren.
function jsonAus(text){
  var t=String(text||'');
  var a=t.indexOf('{'), b=t.lastIndexOf('}');
  if(a<0||b<=a)return null;
  try{ var o=JSON.parse(t.substring(a,b+1)); return (o&&typeof o==='object')?o:null; }catch(e){}
  return null;
}
function felderAus(text){
  var z={}, letzter=null;
  String(text||'').split('\n').forEach(function(zeile){
    var l=zeile.replace(/^\s*[-*>#\s]+/,'').replace(/\*\*/g,'').trim();
    if(!l)return;
    var i=l.indexOf(':');
    var kopf=i>0?l.substring(0,i).trim():'';
    // Nur als Feldname werten, was kurz ist und wie ein Schluessel aussieht —
    // sonst zerlegt ein Doppelpunkt mitten im Fliesstext den Wert.
    if(i>0&&kopf.length<=26&&/^[A-Za-zÄÖÜäöüß_ ]+$/.test(kopf)){
      letzter=kopf.toUpperCase().replace(/\s+/g,'_');
      z[letzter]=l.substring(i+1).trim();
    }else if(letzter){
      z[letzter]+=' '+l;   // Fortsetzungszeile an den letzten Wert haengen
    }
  });
  return z;
}
function hole(obj,pfad,ersatz){
  var cur=obj;
  for(var i=0;i<pfad.length;i++){
    if(cur==null||typeof cur!=='object')return ersatz;
    cur=cur[pfad[i]];
  }
  if(cur==null)return ersatz;
  if(Array.isArray(cur))cur=cur.join(', ');
  var s=String(cur).trim();
  return s?s:ersatz;
}
function entkleide(s){ return String(s||'').trim().replace(/^["'»«]+|["'»«]+$/g,'').trim(); }
function einWort(s){ return String(s||'').toLowerCase().trim().split(/[\s,.;:]/)[0]||''; }

  var uhr=String(f(['ort','zeit'],'ORT_ZEIT','')).match(/(\d{1,2})\s*[:.]\s*(\d{2})/);

  W.ort={
    name:       f(['ort','name'],'ORT_NAME','Ein Ort','Name des Ortes'),

    bildPrompt: f(['ort','bild'],'ORT_BILD','the person stands quietly in the foreground, european setting behind them'),

  };
  W.raeume=[W.ort];
  S.raumHeld=0;S.raumNpc=[];S.spieltIdx=null;S.motiv='';S.motivZug='';

  // Neu ist die Liste: Nennt die Ausgangsidee mehrere Personen, treten sie alle

  var rohListe=(j&&Array.isArray(j.npcs)&&j.npcs.length)?j.npcs:null;
  function ausEintrag(e,i){
    function g(schluessel,flach,ersatz,label){
      var v=e?entkleide(String(e[schluessel]==null?'':e[schluessel])).trim():'';
      if(!v)v=(z&&z[flach])||'';
      if(!v){ if(label&&i===0)luecken.push(label); return ersatz; }
      return v;
    }
    return {
      name:         g('name','NPC_NAME','Ein Fremder','Name der Person'),
      rolle:        g('rolle','NPC_ROLLE','Bewohner'),
      aussehen:     g('aussehen','NPC_AUSSEHEN','an adult with an ordinary but memorable face'),
      kleidung:     g('kleidung','NPC_KLEIDUNG','simple everyday clothing'),
      person:       g('person','NPC_PERSON','zurueckhaltend, aber vielschichtig'),
      grundstimmung:einWort(g('stimmung','NPC_STIMMUNG','neugierig')),
      ziel:         e?entkleide(String(e.ziel==null?'':e.ziel)).trim():'',
      geheimnis:    e?entkleide(String(e.geheimnis==null?'':e.geheimnis)).trim():'',
      aufgedeckt:   false,
      eroeffnung:   g('eroeffnung','NPC_EROEFFNUNG','Oh – Besuch. Das passiert hier selten.','Eröffnungssatz'),
      startBeziehung:  e?entkleide(String(e.beziehung==null?'':e.beziehung)).trim():'',
      startBeziehungen:e?String(e.beziehungen==null?'':e.beziehungen):''
    };
  }
  var liste=[];
  if(rohListe){
    rohListe.slice(0,MAX_NPCS).forEach(function(e,i){ liste.push(ausEintrag(e,i)); });
  }else{
    // hole() macht aus einem Objekt eine Zeichenkette - hier braucht es das

    liste.push(ausEintrag((j&&j.npc&&typeof j.npc==='object')?j.npc:null,0));

  beziehungenAufraeumen();

  S.seed=neuerSeed();

    '<textarea id="storyEdit" class="storyedit"></textarea>';

      '. Dafür stehen jetzt Platzhalter. Du kannst so spielen, aber ✦ WELT ERSCHAFFEN ✦ noch einmal '+
      'zu drücken bringt meist eine vollständige Welt.';
    fb.style.display='block';

  setStatus(luecken.length?'✦ Welt bereit (mit Lücken) ✦':'✦ Welt bereit ✦');
  el('ladebar').classList.remove('scan');
  el('ladefill').style.width='100%';
  el('spielbtn').style.display='inline-block';
  el('spielbtn').disabled=false;
  el('spielbtn').textContent='▶︎ ABENTEUER BEGINNEN';

// Guidance (bei manchen Diensten "CFG scale"): wie streng das Bild dem Prompt
// folgt. Niedrig heisst freier und weicher, hoch heisst woertlich und hart -
// zu hoch verbrennt die Farben. Brauchbar ist 4 bis 12, ueblich 7.
var GUIDANCE_MIN=1, GUIDANCE_MAX=30, GUIDANCE_STD=7;

// ── WELT-KONTEXT & GEDÄCHTNIS ─────────────────
// ── MISSION UND BEZIEHUNGEN ───────────────────
// Zwei Dinge halten eine Szene zusammen: ein Ziel, auf das alle zulaufen, und
// eine klare Haltung jeder Figur zu jeder anderen. Ohne beides kippt jedes
// Gespraech frueher oder spaeter in dieselbe Richtung.
var MAX_BEZIEHUNG=44;   // Zeichen je Eintrag - eine Haltung, kein Aufsatz
function heldName(){ return (W.protagonist&&W.protagonist.name)||'Held'; }
function istHeld(name){
  var t=String(name||'').trim().toLowerCase();
  return t==='held'||t==='protagonist'||t==='user'||t==='spieler'||t==='ich'||
         (!!heldName()&&t===heldName().toLowerCase());
}
// Namen aus der KI-Antwort auf eine wirklich anwesende Figur abbilden.
function figurName(name){
  if(istHeld(name))return heldName();
  var i=findeNpc(name);
  return i>=0?W.npcs[i].name:'';
}
// Der Held fuehrt kein Register ueber sich selbst - was er fuehlt, spielt der
// Mensch vor dem Bildschirm.
function setzeBeziehung(von,zu,wert){
  var v=figurName(von), z=figurName(zu), w=kappe(entkleide(String(wert||'')).trim(),MAX_BEZIEHUNG);
  if(!v||!z||!w||v===z||istHeld(von))return false;
  if(leerAngabe(w))return false;
  if(!S.beziehungen[v])S.beziehungen[v]={};
  if(S.beziehungen[v][z]===w)return false;
  S.beziehungen[v][z]=w;
  return true;
}
// Erwartet "Ida > HELD: neugierig; Ida > Bo: skeptisch" - so antwortet die KI
// zuverlaessiger als mit verschachteltem JSON.
function beziehungenAus(text){
  var raus=[];
  String(text==null?'':text).split(/[;\n]+/).forEach(function(t){
    var m=t.match(/^\s*([^>:]{1,44}?)\s*(?:>|->|→|zu)\s*([^:]{1,44}?)\s*:\s*(.+)$/);
    if(m)raus.push({von:m[1],zu:m[2],wert:m[3]});
  });
  return raus;
}
// Fuer die Welterschaffung: "Bo: skeptisch; Ida: alte Freundin" bei bekanntem Absender.
function beziehungenVonAus(text){
  var raus=[];
  String(text==null?'':text).split(/[;\n]+/).forEach(function(t){
    var m=t.match(/^\s*([^:]{1,44}?)\s*:\s*(.+)$/);
    if(m)raus.push({zu:m[1],wert:m[2]});
  });
  return raus;
}
function uebernimmBeziehungen(roh,von){
  var n=0;
  if(Array.isArray(roh)){
    roh.forEach(function(b){
      if(!b)return;
      if(setzeBeziehung(b.von||b.from||von,b.zu||b.to||b.ziel,b.wert||b.value||b.haltung))n++;
    });
    return n;
  }
  if(von){
    beziehungenVonAus(roh).forEach(function(b){ if(setzeBeziehung(von,b.zu,b.wert))n++; });
    return n;
  }
  beziehungenAus(roh).forEach(function(b){ if(setzeBeziehung(b.von,b.zu,b.wert))n++; });
  return n;
}
// Wer nicht mehr da ist, steht auch nicht mehr im Register.
function beziehungenAufraeumen(){
  var erlaubt={};
  erlaubt[heldName()]=true;
  W.npcs.forEach(function(x){ erlaubt[x.name]=true; });
  Object.keys(S.beziehungen).forEach(function(v){
    if(!erlaubt[v]||istHeld(v)){ delete S.beziehungen[v]; return; }
    Object.keys(S.beziehungen[v]).forEach(function(z){
      if(!erlaubt[z]||z===v)delete S.beziehungen[v][z];
    });
  });
}
function beziehungZu(von,zu){
  var m=S.beziehungen[von];
  return (m&&m[zu])||'';
}
function beziehungText(){
  beziehungenAufraeumen();
  var zeilen=[];
  W.npcs.forEach(function(x){
    var ziele=[heldName()].concat(W.npcs.map(function(a){return a.name;}).filter(function(nm){return nm!==x.name;}));
    var teile=ziele.map(function(z){ return z+': '+(beziehungZu(x.name,z)||'noch unbestimmt'); });
    zeilen.push('- '+x.name+' → '+teile.join(' | '));
  });
  return zeilen.join('\n');
}
// Nach jedem Zug: geaenderte Haltungen eintragen, Missionsstand fortschreiben.
function folgeBeziehungen(bezRoh,missionRoh){
  uebernimmBeziehungen(bezRoh);
  if(missionRoh&&!leerAngabe(missionRoh))S.missionStand=kappe(missionRoh,300);
}
// Jeder Zug laesst Zeit vergehen, frischt beruehrte Fakten auf und verbraucht
// die Probe - sie gilt genau fuer diesen einen Moment.
function folgeZug(minutenRoh,wetterRoh,antwort,aufdeckRoh,etappeRoh){
  if(aufdeckRoh)deckeAuf(aufdeckRoh);
  if(etappeRoh)naechsteEtappe(etappeRoh);
  S.zug=(S.zug||0)+1;
  zeitWeiter(minutenRoh===''?3:minutenRoh);
  if(wetterRoh&&!leerAngabe(wetterRoh))S.wetter=kappe(wetterRoh,60);
  frischeFakten(antwort);
  S.probe=null;
  zeigeRaumtitel();
}
// ── REFERENZBILD ──────────────────────────────
// Bildkohaerenz entsteht nur an einem FESTEN Anker. Das letzte Szenenbild
// taugt nicht dafuer: jedes neue entstuende aus dem vorigen, und nach zehn
// Zuegen waere es die Fotokopie einer Fotokopie. Genommen wird deshalb das
// Charakterblatt der Figur, um die es gerade geht - und nur wenn es keines
// gibt, das erste Bild des laufenden Akts.
var REFERENZ_KANTE=512;   // laengere Kante; darueber wird der Upload traege
function referenzQuelle(){
  var i=letzterNpcIdx();
  if(i>=0&&W.npcs[i]){
    var b=blattLesen(W.npcs[i].name);
    if(b)return {url:b,woher:'Charakterblatt von '+W.npcs[i].name};
  }
  var h=blattLesen(heldName());
  if(h)return {url:h,woher:'Charakterblatt des Helden'};
  if(S.aktBild)return {url:S.aktBild,woher:'erstes Bild dieses Akts'};
  return null;
}
// Verkleinern und als JPEG kodieren: ein 1024er-PNG waere als Base64 schnell
// zwei Megabyte, und die haengen am Upload jedes einzelnen Bildes.
function bildVerkleinern(url,kante){
  return new Promise(function(fertig){
    if(!url){ fertig(null); return; }
    try{
      var img=new Image();
      img.crossOrigin='anonymous';
      img.onload=function(){
        try{
          var max=kante||REFERENZ_KANTE;
          var f=Math.min(1,max/Math.max(img.width||max,img.height||max));
          var c=document.createElement('canvas');
          c.width=Math.max(8,Math.round((img.width||max)*f));
          c.height=Math.max(8,Math.round((img.height||max)*f));
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          fertig(c.toDataURL('image/jpeg',0.82));   // wirft bei fremder Herkunft
        }catch(e){ console.warn('Referenzbild nicht lesbar:',e); fertig(null); }
      };
      img.onerror=function(){ fertig(null); };
      img.src=url;
    }catch(e){ fertig(null); }
  });
}
async function referenzBild(){
  var q=referenzQuelle();
  if(!q)return null;
  var klein=await bildVerkleinern(q.url,REFERENZ_KANTE);
  if(!klein)return null;
  return {daten:klein,woher:q.woher};
}
// Gradio 4/5 will Bilder meist als Dateiobjekt, aeltere Spaces nehmen die
// Data-URL direkt. Beides ist einstellbar, weil es am Space haengt.
function referenzWert(daten){
  if(!daten)return null;
  if(CFG.gradioReferenzForm==='datei'){
    return {path:daten,url:daten,meta:{_type:'gradio.FileData'}};
  }
  return daten;
}
