<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=EB+Garamond:ital,wght@0,400;1,400&display=swap');

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

:root{
  --panel:#2a1c0e; --border:#6b4c2a; --gold:#d4a033; --gold2:#f0c060;
  --cream:#f5e8cc; --dim:#9a7a50; --bg:#0e0906; --rot:#9b2020;
  --hoehe:100vh;
}
@supports(height:100dvh){:root{--hoehe:100dvh;}}

html,body{width:100%;height:var(--hoehe);background:var(--bg);font-family:'EB Garamond',Georgia,serif;color:var(--cream);overflow:hidden;}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

/* ── STARTSCREEN ── */
#start{position:fixed;inset:0;height:var(--hoehe);background:radial-gradient(ellipse at center,#2a1c0e 0%,#0e0906 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;padding:24px 20px 40px;text-align:center;z-index:200;
  overflow-y:auto;overscroll-behavior:contain;transition:opacity 0.5s;}
#start::before{content:'';display:block;flex:1 0 12px;}
#start::after{content:'';display:block;flex:1 0 12px;}
#start.aus{opacity:0;pointer-events:none;}
#start h1{font-family:'Cinzel',serif;font-size:clamp(2.5rem,10vw,5rem);font-weight:700;color:var(--gold2);text-shadow:0 0 40px rgba(212,160,51,0.5);letter-spacing:0.22em;}
.sub{font-family:'Cinzel',serif;font-size:clamp(0.55rem,1.6vw,0.75rem);color:var(--dim);letter-spacing:0.22em;}
#eingabe-wrap{display:flex;gap:8px;align-items:stretch;max-width:480px;width:100%;}
#begriffe{flex:1;background:rgba(42,28,14,0.8);border:1px solid var(--border);color:var(--cream);font-family:'EB Garamond',serif;font-size:0.95rem;padding:8px 12px;outline:none;resize:none;line-height:1.5;}
#begriffe::placeholder{color:var(--dim);}
#wuerfelBtn{background:none;border:1px solid var(--border);color:var(--gold2);font-size:1.4rem;padding:6px 12px;cursor:pointer;flex-shrink:0;}
#wuerfelBtn:hover{background:rgba(212,160,51,0.1);}
#wuerfelStatus{font-family:'Cinzel',serif;font-size:0.62rem;letter-spacing:0.14em;color:var(--dim);min-height:1em;}
.startreihe{display:flex;gap:8px;align-items:center;max-width:480px;width:100%;flex-wrap:wrap;}
.startreihe label{font-family:'Cinzel',serif;font-size:0.62rem;letter-spacing:0.14em;color:var(--dim);flex-shrink:0;}
#stilwahl,#quelleKurz{background:rgba(42,28,14,0.8);border:1px solid var(--border);color:var(--cream);font-family:'EB Garamond',serif;font-size:0.88rem;padding:6px 10px;outline:none;cursor:pointer;flex:1;min-width:150px;}
#stilwahl option,#quelleKurz option{background:var(--panel);}
#stilEigen{background:rgba(42,28,14,0.8);border:1px solid var(--border);color:var(--cream);font-family:'EB Garamond',serif;font-size:0.88rem;padding:6px 10px;outline:none;width:100%;}
#stilEigen:focus,#stilwahl:focus{border-color:var(--gold);}
.klein{background:none;border:1px solid var(--border);color:var(--dim);font-family:'Cinzel',serif;font-size:0.6rem;letter-spacing:0.1em;padding:6px 10px;cursor:pointer;flex-shrink:0;}
.klein:hover{color:var(--gold2);border-color:var(--gold);}
.gbtn{background:none;border:2px solid var(--gold);color:var(--gold2);font-family:'Cinzel',serif;font-size:clamp(0.82rem,2.4vw,0.98rem);letter-spacing:0.16em;padding:12px 30px;cursor:pointer;transition:all 0.2s;}
.gbtn:hover{background:rgba(212,160,51,0.1);}
.gbtn:disabled{opacity:0.5;cursor:default;}
#ladebereich{display:none;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:480px;}
#ladelabel{font-family:'Cinzel',serif;font-size:0.68rem;letter-spacing:0.18em;color:var(--dim);min-height:1.2em;}
#ladebar{width:100%;height:4px;background:rgba(107,76,42,0.3);overflow:hidden;position:relative;}
#ladefill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));width:0%;transition:width 0.5s;}
#ladebar.scan::after{content:'';position:absolute;left:-50%;top:0;bottom:0;width:50%;background:linear-gradient(90deg,transparent,var(--gold2),transparent);animation:scan 1.3s linear infinite;}
@keyframes scan{to{left:150%;}}
#storybox{background:rgba(42,28,14,0.88);border:1px solid var(--border);padding:12px 16px;max-width:520px;width:100%;font-size:0.84rem;line-height:1.7;font-style:italic;display:none;text-align:left;}
#storybox strong{font-style:normal;color:var(--gold2);font-family:'Cinzel',serif;font-size:0.8em;letter-spacing:0.1em;}
#storybox .storyhinweis{font-style:normal;color:var(--dim);font-size:0.68rem;margin:6px 0;letter-spacing:0.02em;}
#storybox .storyedit{width:100%;min-height:9rem;background:rgba(0,0,0,0.28);border:1px solid var(--border);color:var(--cream);font-family:'EB Garamond',serif;font-style:italic;font-size:0.84rem;line-height:1.6;padding:8px 10px;outline:none;resize:vertical;}
#storybox .storyedit:focus{border-color:var(--gold);}
#fehlerbox{display:none;background:rgba(155,32,32,0.15);border:1px solid var(--rot);color:#e0a0a0;padding:8px 12px;max-width:480px;width:100%;font-size:0.78rem;text-align:left;}

/* ── BÜHNE ── */
#buehne{position:fixed;inset:0;height:var(--hoehe);z-index:0;}
#buehne img{width:100%;height:100%;object-fit:contain;object-position:center top;display:block;cursor:zoom-in;transition:opacity 0.6s;}
#szenelade{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;font-family:'Cinzel',serif;font-size:0.7rem;letter-spacing:0.2em;color:var(--dim);display:none;pointer-events:none;text-shadow:0 2px 8px #000;}
#szenelade.an{display:block;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:0.4;}50%{opacity:1;}}
#vignette{position:fixed;inset:0;height:var(--hoehe);z-index:1;pointer-events:none;background:linear-gradient(to bottom,rgba(14,9,6,0.5) 0%,transparent 20%,transparent 60%,rgba(14,9,6,0.45) 100%),radial-gradient(ellipse at center,transparent 45%,rgba(6,4,2,0.45) 100%);}

/* ── SPIEL ── */
#spiel{position:fixed;inset:0;height:var(--hoehe);z-index:10;display:none;flex-direction:column;pointer-events:none;}
#spiel.aktiv{display:flex;}
#oben{flex:1;position:relative;pointer-events:none;min-height:0;}
/* Kopfbereich als echte Reihenfolge statt uebereinandergelegter Ebenen:
   Werkzeuge und NPC-Anzeige teilen sich die erste Zeile, der Titel steht
   darunter. Sonst laeuft der Titel auf schmalen Displays hinter die Knoepfe. */
#kopf{position:absolute;top:0;left:0;right:0;z-index:6;pointer-events:none;padding:6px 8px 0;display:flex;flex-direction:column;}
#kopfInhalt{max-height:70vh;overflow:hidden;transition:max-height 0.3s ease,opacity 0.22s ease;}
#kopf.zu #kopfInhalt{max-height:0;opacity:0;}
#kopfschalter{align-self:center;margin-top:3px;pointer-events:all;background:rgba(42,28,14,0.86);border:1px solid var(--border);color:var(--gold2);font-family:'Cinzel',serif;font-size:0.72rem;line-height:1;padding:3px 18px;cursor:pointer;border-radius:0 0 4px 4px;opacity:0.8;transition:all 0.15s;}
#kopfschalter:hover{background:rgba(212,160,51,0.14);border-color:var(--gold);opacity:1;}
#kopfreihe{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
#raumtitel{font-family:'Cinzel',serif;font-size:clamp(0.75rem,1.9vw,1.05rem);font-weight:700;letter-spacing:0.18em;color:var(--gold2);text-shadow:0 0 14px rgba(212,160,51,0.6),0 2px 6px rgba(0,0,0,0.9);text-align:center;padding:8px 4px 0;pointer-events:none;}
#werkzeuge{flex:0 0 auto;pointer-events:all;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;max-width:62%;}
#werkzeuge button{background:rgba(42,28,14,0.82);border:1px solid var(--border);color:var(--gold2);font-family:'Cinzel',serif;font-size:0.65rem;letter-spacing:0.08em;padding:4px 8px;cursor:pointer;transition:background 0.15s,border-color 0.15s;}
#werkzeuge button:hover{background:rgba(212,160,51,0.12);border-color:var(--gold);}
#werkzeuge button:disabled{opacity:0.3;cursor:default;}
#autobtn.an{background:var(--gold);color:#2a1c0e;border-color:var(--gold2);}
#npcstatus{flex:1 1 auto;min-width:0;pointer-events:auto;background:rgba(6,4,2,0.7);border:1px solid var(--border);border-radius:3px;padding:4px 8px;font-family:'Cinzel',serif;font-size:0.6rem;letter-spacing:0.06em;color:var(--dim);display:flex;flex-wrap:wrap;gap:4px 8px;align-self:flex-start;}
#npcstatus .npcchip{display:inline-flex;align-items:center;gap:5px;}
#npcstatus .npcweg{cursor:pointer;color:var(--dim);border:1px solid var(--border);border-radius:50%;width:14px;height:14px;line-height:12px;text-align:center;font-size:0.62rem;transition:all 0.15s;}
#npcstatus .npcweg:hover{color:#e08080;border-color:var(--rot);}

/* ── DIALOG ── */
#unten{background:rgba(42,28,14,0.68);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);border-top:2px solid var(--border);flex-shrink:0;pointer-events:all;display:flex;flex-direction:column;max-height:52vh;}
#gespraech{padding:10px 14px;overflow-y:auto;flex:1;min-height:120px;max-height:32vh;display:flex;flex-direction:column;gap:8px;}
.zeile{display:flex;flex-direction:column;gap:2px;}
.zeile .wer{font-family:'Cinzel',serif;font-size:0.6rem;letter-spacing:0.12em;}
.zeile.npc .wer{color:var(--gold);}
.zeile.ich .wer{color:var(--dim);text-align:right;}
.zeile .txt{font-size:clamp(0.82rem,1.6vw,0.96rem);line-height:1.55;}
.zeile.npc .txt{color:var(--cream);font-style:italic;}
.zeile.ich .txt{color:var(--gold2);text-align:right;}
.zeile .txt .aktion{color:var(--dim);font-style:italic;}
.zeile.sys .txt{color:var(--dim);font-style:italic;text-align:center;font-size:0.78rem;}
.zeile.err .txt{color:#e08080;font-style:italic;text-align:center;font-size:0.78rem;}
.zeile.hilfe .txt{color:var(--dim);font-style:normal;font-size:0.76rem;line-height:1.7;text-align:left;}
.zeile.hilfe b{color:var(--gold2);font-family:'Cinzel',serif;font-size:0.72rem;letter-spacing:0.06em;}
#tippt{color:var(--dim);font-style:italic;font-size:0.8rem;padding:2px 0;}
#interakt{border-top:1px solid var(--border);background:rgba(0,0,0,0.15);padding:8px 10px;display:flex;flex-direction:column;gap:7px;}
#freitext-wrap{display:flex;gap:7px;}
#freitext{flex:1;background:rgba(0,0,0,0.4);border:1px solid var(--border);color:var(--cream);font-family:'EB Garamond',serif;font-size:0.9rem;padding:8px 11px;outline:none;min-width:0;}
#freitext:focus{border-color:var(--gold);}
#freitext::placeholder{color:var(--dim);}
#sendBtn{background:none;border:1px solid var(--gold);color:var(--gold2);font-family:'Cinzel',serif;font-size:0.72rem;letter-spacing:0.08em;padding:6px 16px;cursor:pointer;flex-shrink:0;transition:all 0.13s;}
#sendBtn:hover{background:rgba(212,160,51,0.12);}
#sendBtn:disabled{opacity:0.4;cursor:default;}

/* ── MODALE (ein Bauplan für alle) ── */
/* Muss ueber dem Startbildschirm liegen (z-index 200), sonst oeffnen sich
   Spielstand- und Einstellungsmenue unsichtbar dahinter. */
.modal{display:none;position:fixed;inset:0;height:var(--hoehe);background:rgba(6,4,2,0.9);align-items:center;justify-content:center;z-index:300;pointer-events:all;padding:12px;}
.modal.an{display:flex;}
.modalBox{background:var(--panel);border:1px solid var(--gold);box-shadow:0 0 80px rgba(212,160,51,0.15);max-width:min(520px,94vw);width:100%;max-height:86vh;display:flex;flex-direction:column;}
.modalKopf{font-family:'Cinzel',serif;font-size:0.72rem;letter-spacing:0.18em;color:var(--gold);padding:10px 14px 8px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px;}
.modalKopf button{background:none;border:none;color:var(--dim);font-size:1rem;cursor:pointer;transition:color 0.14s;}
.modalKopf button:hover{color:var(--gold2);}
.modalInhalt{padding:14px 16px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:6px;}
.modalInhalt.fliess{font-size:0.88rem;line-height:1.7;font-style:italic;color:var(--cream);display:block;}
.modalNav{display:flex;border-top:1px solid var(--border);flex-wrap:wrap;}
.modalNav button{flex:1 1 40%;background:none;border:none;border-right:1px solid rgba(107,76,42,0.3);color:var(--dim);font-family:'Cinzel',serif;font-size:0.62rem;letter-spacing:0.1em;padding:10px 6px;cursor:pointer;transition:all 0.14s;}
.modalNav button:last-child{border-right:none;}
.modalNav button.haupt{color:var(--gold2);}
.modalNav button:hover{color:var(--gold2);background:rgba(212,160,51,0.06);}
.feldlabel{display:block;font-family:'Cinzel',serif;font-size:0.55rem;letter-spacing:0.1em;color:var(--dim);margin:6px 0 2px;}
.feld{width:100%;background:rgba(0,0,0,0.4);border:1px solid var(--border);color:var(--cream);font-family:'EB Garamond',serif;font-size:0.88rem;padding:7px 9px;outline:none;resize:vertical;line-height:1.45;}
.feld:focus{border-color:var(--gold);}
select.feld{cursor:pointer;}
select.feld option{background:var(--panel);}
.figblock{border:1px solid rgba(107,76,42,0.4);border-radius:3px;padding:8px 10px;margin-bottom:8px;}
.figtitel{font-family:'Cinzel',serif;font-size:0.66rem;letter-spacing:0.14em;color:var(--gold2);margin-bottom:5px;}
.reihe{display:flex;gap:7px;}
.reihe .feld{flex:1;}
.reihe button{background:none;border:1px solid var(--border);color:var(--gold2);font-size:1.05rem;padding:4px 11px;cursor:pointer;flex-shrink:0;}
.reihe button:hover{background:rgba(212,160,51,0.1);}
.hinweis{font-size:0.72rem;line-height:1.55;color:var(--dim);font-style:italic;}
.warnung{font-size:0.72rem;line-height:1.55;color:#d8a86a;border-left:2px solid var(--border);padding-left:8px;}
.pruefzeile{font-family:'Cinzel',serif;font-size:0.62rem;letter-spacing:0.08em;color:var(--dim);min-height:1.1em;}
.pruefzeile.ok{color:#8fbf6a;}
.pruefzeile.fehler{color:#e08080;}
.slot{display:flex;gap:6px;align-items:center;border:1px solid rgba(107,76,42,0.4);padding:7px 9px;}
.slot .slotinfo{flex:1;min-width:0;font-size:0.78rem;line-height:1.35;}
.slot .slotinfo small{display:block;color:var(--dim);font-size:0.66rem;}
.slot button{background:none;border:1px solid var(--border);color:var(--gold2);font-family:'Cinzel',serif;font-size:0.58rem;letter-spacing:0.08em;padding:5px 8px;cursor:pointer;}
.slot button:hover{background:rgba(212,160,51,0.1);}
.slot button:disabled{opacity:0.3;cursor:default;}

::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
</style>

<!-- BÜHNE -->
<div id="buehne"><img id="img0" src="" alt="Szenenbild" onclick="oeffneBildModal()"></div>
<div id="szenelade">✦ SZENE ENTSTEHT… ✦</div>
<div id="vignette"></div>

<!-- STARTSCREEN -->
<div id="start">
  <div class="sub">EIN DIALOG-ABENTEUER &middot; V7.11</div>
  <h1>PROXIMA</h1>
  <div id="eingabe-wrap">
    <textarea id="begriffe" rows="3" placeholder="Schreibe eine Story-Idee – oder würfle einen Vorschlag mit ⚄"></textarea>
    <button id="wuerfelBtn" onclick="wuerfeln()" title="KI-Vorschlag würfeln">⚄</button>
  </div>
  <div id="wuerfelStatus"></div>
  <div class="startreihe">
    <label for="stilwahl">BILDSTIL</label>
    <select id="stilwahl" onchange="stilGewechselt()">
      <option value="manga" selected>Manga / Anime</option>
      <option value="comic">Westlicher Comic</option>
      <option value="aquarell">Aquarell</option>
      <option value="oel">Ölgemälde</option>
      <option value="realistisch">Fotorealistisch</option>
      <option value="pixel">Pixel-Art</option>
      <option value="eigen">Eigener Stil…</option>
    </select>
    <input id="stilEigen" type="text" placeholder="z.B. noir ink sketch, high contrast" style="display:none">
  </div>
  <div class="startreihe">
    <label for="quelleKurz">BILDQUELLE</label>
    <select id="quelleKurz" onchange="quelleKurzGewechselt()"></select>
    <button class="klein" onclick="oeffneEinstellungen()">EINSTELLEN…</button>
  </div>
  <button class="gbtn" id="erstellbtn" onclick="weltErstellen()">✦ WELT ERSCHAFFEN ✦</button>
  <button class="gbtn" id="ladebtn" onclick="oeffneSpeicher()" style="display:none">⟳ SPIELSTAND LADEN</button>
  <div id="ladebereich">
    <div id="ladelabel">ERSCHAFFE…</div>
    <div id="ladebar" class="scan"><div id="ladefill"></div></div>
  </div>
  <div id="fehlerbox"></div>
  <div id="storybox"></div>
  <button class="gbtn" id="spielbtn" onclick="spielStarten()" style="display:none">▶ ABENTEUER BEGINNEN</button>
</div>

<!-- SPIEL -->
<div id="spiel">
  <div id="oben">
   <div id="kopf">
    <div id="kopfInhalt">
    <div id="kopfreihe">
    <div id="npcstatus"></div>
    <div id="werkzeuge">
      <button id="chronikbtn" onclick="zeigeChronik('ort')" title="Chronik">📖</button>
      <button id="figurbtn" onclick="oeffneFigurMenu()" title="Figuren bearbeiten">👤</button>
      <button id="szenebtn" onclick="oeffneSzeneMenu()" title="Globale Kulisse">🎬</button>
      <button id="bildbtn" onclick="oeffneBildModal()" title="Bild bearbeiten">🖼</button>
      <button id="einstellbtn" onclick="oeffneEinstellungen()" title="Einstellungen">⚙</button>
      <button id="speicherbtn" onclick="oeffneSpeicher()" title="Speichern / Laden">💾</button>
      <button id="undobtn" onclick="undo()" title="Letzten Zug zurücknehmen">⟲</button>
      <button id="npcbtn" onclick="erscheineNPC('')" title="Weitere Person auftreten lassen">+ NPC</button>
      <button id="autobtn" onclick="autoUmschalten()" title="Figuren spielen allein weiter">▶ AUTO</button>
    </div>
    </div>
    <div id="raumtitel"></div>
    </div>
    <button id="kopfschalter" onclick="kopfUmschalten()" aria-expanded="true" title="Kopfleiste einklappen">⌃</button>
   </div>
  </div>
  <div id="unten">
    <div id="gespraech" aria-live="polite" onclick="tippenFertig()"></div>
    <div id="interakt">
      <div id="freitext-wrap">
        <!-- Im Start-Markup NIE eine eckige Klammer um Woerter, auch nicht als
             HTML-Entity: der Browser dekodiert Entities beim Parsen, danach
             tastet Perchance den Bereich ab und liest den Klammerinhalt als
             Ausdruck. Den ausfuehrlichen Platzhalter setzt aktualisiereUI()
             spaeter zur Laufzeit, da ist die Pruefung laengst durch. -->
        <input id="freitext" type="text" placeholder="Sprich oder handle in eckigen Klammern   ·   /hilfe" onkeydown="if(event.key==='Enter')sendeFreitext()">
        <button id="sendBtn" onclick="sendeFreitext()">SAGEN</button>
      </div>
    </div>
  </div>
</div>

<!-- MODALE -->
<div class="modal" id="mChronik">
  <div class="modalBox">
    <div class="modalKopf"><span id="chronikTitel">📖 CHRONIK</span><button onclick="schliesseModal()" aria-label="Schließen">✕</button></div>
    <div class="modalInhalt fliess" id="chronikInhalt"></div>
    <div class="modalNav" id="chronikNav"></div>
  </div>
</div>

<div class="modal" id="mBild">
  <div class="modalBox">
    <div class="modalKopf"><span>🖼 BILD BEARBEITEN</span><button onclick="schliesseModal()" aria-label="Schließen">✕</button></div>
    <div class="modalInhalt">
      <label class="feldlabel" for="bildPromptFeld">PROMPT</label>
      <textarea id="bildPromptFeld" class="feld" rows="6"></textarea>
      <label class="feldlabel" for="bildNegativFeld">NEGATIVPROMPT</label>
      <textarea id="bildNegativFeld" class="feld" rows="2"></textarea>
      <label class="feldlabel"><input type="checkbox" id="bildFest"> Prompt festhalten — Bild folgt dann nicht mehr der Handlung</label>
      <label class="feldlabel" for="bildSeedFeld">SEED — bleibt fest, damit die Figuren sich ähnlich bleiben</label>
      <div class="reihe">
        <input id="bildSeedFeld" class="feld" type="text" inputmode="numeric">
        <button onclick="wuerfelSeed()" title="Zufalls-Seed">🎲</button>
      </div>
      <div class="hinweis" id="bildQuelleInfo"></div>
    </div>
    <div class="modalNav">
      <button onclick="schliesseModal()">SCHLIESSEN</button>
      <button onclick="bildOeffnen()">↗ ÖFFNEN</button>
      <button onclick="bildAusSzene()" title="Prompt wieder automatisch aus der Szene bauen">↺ AUS SZENE</button>
      <button class="haupt" onclick="bildNeuZeichnen()">✦ NEU ZEICHNEN</button>
    </div>
  </div>
</div>

<div class="modal" id="mFigur">

// ── BILDQUELLEN ───────────────────────────────
// Jede Quelle bekommt {prompt, negativ, seed, breite, hoehe} und liefert eine
// Bildadresse zurueck (data:-URL oder http-URL). Neue Quelle = ein Eintrag hier.
var BILDQUELLEN={
  perchance:{
    label:'Perchance (Standard, ohne Schlüssel)',
    info:'Nutzt das eingebaute Bild-Plugin des Generators. Kein Schlüssel, keine Fremdserver.',
    felder:[],
    zeichne:async function(a){
      if(typeof image!=='function')throw new Error('image() ist nicht verfügbar — Bild-Plugin im Generator eingebunden?');
      var p=a.prompt+(a.negativ?' (negativePrompt:::'+a.negativ+')':'')+' (seed:::'+a.seed+')';
      var r=await image({prompt:p});
      var src=r&&(r.dataUrl||r.url||r.imageUrl||r.src);
      if(!src)throw new Error('Bild-Plugin lieferte keine Bilddaten.');
      return src;
    }
  },
  pollinations:{
    label:'Pollinations (frei, ohne Schlüssel)',
    maxPrompt:550,
    info:'Offener Dienst, die Beschreibung steckt in der Adresse — deshalb wird der Prompt gekürzt. Kein Negativprompt. Bei HTTP 500 hilft meist: Modellfeld leeren, Bildgröße auf 512×512, oder im Bildmenü einen neuen Seed würfeln.',
    felder:[{k:'pollModell',l:'Modell (leer = Standard des Dienstes)',typ:'text'}],
    zeichne:async function(a){
      // Die Beschreibung steckt bei diesem Dienst im Pfad. Lange Adressen sind
      // ein bekannter Stolperstein, deshalb: knapp halten, den Negativprompt nur
      // anhaengen, wenn danach noch Luft ist, und die Laenge im Fehlerfall nennen.
      var GRENZE=1300;
      var bau=function(seed,mitNegativ){
        var u='https://image.pollinations.ai/prompt/'+encodeURIComponent(a.prompt)+
              '?width='+a.breite+'&height='+a.hoehe+'&seed='+seed+
              (CFG.pollModell?'&model='+encodeURIComponent(CFG.pollModell):'');
        if(mitNegativ&&a.negativ){
          var mitNeg=u+'&negative_prompt='+encodeURIComponent(a.negativ);
          if(mitNeg.length<=GRENZE)u=mitNeg;
        }
        return u;
      };
      var seed=seedFuerDienst(a.seed);
      var ersteUrl=bau(seed,true);
      try{
        return await ladeBildUrl(ersteUrl,120000);
      }catch(e){
        var meldung=String((e&&e.message)||e);
        // 429 heisst: zu viele Anfragen. Ein sofortiger zweiter Versuch macht es
        // schlimmer, also gar nicht erst nachfassen.
        if(/HTTP 429/.test(meldung))throw e;
        // Zweiter Anlauf: ohne Negativprompt, benachbarter Seed. Hilft bei
        // seed-abhaengigen 500ern und bei Modellen, die den Parameter nicht kennen.
        try{
          await warte(2500);
          return await ladeBildUrl(bau((seed+1)%2147483647||1,false),120000);
        }catch(e2){
          throw new Error(String((e2&&e2.message)||e2)+
            ' [Adresse war '+ersteUrl.length+' Zeichen lang, Prompt '+a.prompt.length+
            '. Falls „QUELLE TESTEN" mit kurzem Prompt gelingt, liegt es an der Länge.]');
        }
      }
    }
  },
  horde:{
    label:'AI Horde (frei, freiwillige Rechner)',
    info:'Gratis und anonym mit dem Schlüssel 0000000000 — dann aber langsam (Warteschlange). Ein eigener Schlüssel von aihorde.net ist deutlich schneller.',
    felder:[
      {k:'hordeKey',l:'API-Schlüssel (0000000000 = anonym)',typ:'passwort'},
      {k:'hordeModell',l:'Modell (leer = beliebig)',typ:'text'},
      {k:'hordeSchritte',l:'Schritte',typ:'zahl'}
    ],
    zeichne:async function(a){
      var kopf={'Content-Type':'application/json','apikey':(CFG.hordeKey||'0000000000'),'Client-Agent':'PROXIMA:7:perchance'};
      var koerper={
        prompt:a.prompt+(a.negativ?' ### '+a.negativ:''),
        params:{n:1,width:auf64(a.breite),height:auf64(a.hoehe),seed:String(seedFuerDienst(a.seed)),steps:Number(CFG.hordeSchritte)||25,sampler_name:'k_euler_a'},
        nsfw:true, censor_nsfw:false
      };
      if(CFG.hordeModell)koerper.models=[CFG.hordeModell];
      var r=await fetch('https://stablehorde.net/api/v2/generate/async',{method:'POST',headers:kopf,body:JSON.stringify(koerper)});
      if(!r.ok)throw new Error('AI Horde lehnte den Auftrag ab ('+r.status+'): '+(await r.text()).substring(0,140));
      var j=await r.json();
      if(!j.id)throw new Error('AI Horde lieferte keine Auftragsnummer.');
      for(var i=0;i<90;i++){
        await warte(4000);
        var s=await fetch('https://stablehorde.net/api/v2/generate/status/'+j.id,{headers:{'Client-Agent':'PROXIMA:7:perchance'}});
        if(!s.ok)continue;
        var st=await s.json();
        if(st.faulted)throw new Error('AI Horde: Auftrag fehlgeschlagen.');
        if(st.done&&st.generations&&st.generations.length){
          var g=st.generations[0];
          if(g.img&&g.img.indexOf('http')===0)return await ladeBildUrl(g.img,60000);
          if(g.img)return 'data:image/webp;base64,'+g.img;
          throw new Error('AI Horde lieferte kein Bild.');
        }
      }
      throw new Error('AI Horde: Zeitüberschreitung in der Warteschlange.');
    }
  },
  api:{
    label:'OpenAI-kompatible API (eigener Schlüssel)',
    info:'Passt für api.openai.com und alles, was denselben /images/generations-Aufruf versteht. Der Schlüssel liegt unverschlüsselt im Browser — nur eigene, begrenzte Schlüssel verwenden.',
    felder:[
      {k:'apiUrl',l:'Basis-URL (ohne /images/generations)',typ:'text'},
      {k:'apiKey',l:'API-Schlüssel',typ:'passwort'},
      {k:'apiModell',l:'Modell',typ:'text'}
    ],
    zeichne:async function(a){
      if(!CFG.apiKey)throw new Error('Kein API-Schlüssel hinterlegt.');
      var basis=String(CFG.apiUrl||'').replace(/\/+$/,'');
      var r=await fetch(basis+'/images/generations',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+CFG.apiKey},
        body:JSON.stringify({model:CFG.apiModell||'gpt-image-1',prompt:a.prompt,n:1,size:auf64(a.breite)+'x'+auf64(a.hoehe)})
      });
      if(!r.ok)throw new Error('API antwortete '+r.status+': '+(await r.text()).substring(0,140));
      var j=await r.json();
      var d=j&&j.data&&j.data[0];
      if(!d)throw new Error('API lieferte keine Bilddaten.');
      if(d.b64_json)return 'data:image/png;base64,'+d.b64_json;
      if(d.url)return await ladeBildUrl(d.url,60000);
      throw new Error('API-Antwort ohne Bild.');
    }
  },
  url:{
    label:'Eigene URL-Vorlage',
    maxPrompt:1200,
    info:'Für alles, was ein Bild per einfachem Aufruf liefert. Platzhalter: {prompt} {negativ} {seed} {breite} {hoehe}.',
    felder:[{k:'urlVorlage',l:'URL-Vorlage',typ:'text'}],
    zeichne:async function(a){
      if(!CFG.urlVorlage)throw new Error('Keine URL-Vorlage hinterlegt.');
      var u=String(CFG.urlVorlage)
        .replace(/\{prompt\}/g,encodeURIComponent(a.prompt))
        .replace(/\{negativ\}/g,encodeURIComponent(a.negativ||''))
        .replace(/\{seed\}/g,String(seedFuerDienst(a.seed)))
        .replace(/\{breite\}/g,String(a.breite))
        .replace(/\{hoehe\}/g,String(a.hoehe));
      return await ladeBildUrl(u,120000);
    }
  }
};
function quelle(){ return BILDQUELLEN[CFG.quelle]||BILDQUELLEN.perchance; }
function auf64(n){ n=Math.round((Number(n)||1024)/64)*64; return Math.max(256,Math.min(2048,n)); }
// Bild-Backends rechnen mit 32-Bit-Seeds. Aeltere Spielstaende halten
// zwoelfstellige Werte — die quittieren manche Dienste mit HTTP 500.
function seedFuerDienst(s){ return (Math.abs(parseInt(s,10)||0)%2147483647)||1; }
// Am letzten Komma vor der Grenze kappen, damit kein Wort zerrissen wird.
function kuerzeText(p,max){
  p=String(p||'');
  if(max<=0)return '';
  if(p.length<=max)return p;
  var schnitt=p.lastIndexOf(',',max);
  return p.substring(0,schnitt>max*0.6?schnitt:max).trim();
}
// Zwei Wege, weil jeder für sich blind ist:
// 1. fetch() nennt den echten HTTP-Status und liefert das Bild als blob:-Adresse,
//    die auch dann noch anzeigbar ist, wenn fremde Bild-Hosts gesperrt sind.
// 2. Scheitert fetch an CORS, bleibt der klassische <img>-Weg — der lädt zwar,
//    verrät aber nie, woran es lag.
async function ladeBildUrl(url,timeoutMs){
  var limit=timeoutMs||90000, ersterGrund='';
  try{
    var ctl=(typeof AbortController==='function')?new AbortController():null;
    var t=ctl?setTimeout(function(){ctl.abort();},limit):null;
    var r=await fetch(url,ctl?{signal:ctl.signal}:{});
    if(t)clearTimeout(t);
    if(!r.ok){
      var wartehinweis='';
      try{
        var ra=r.headers&&r.headers.get&&r.headers.get('retry-after');
        if(ra)wartehinweis=', frühestens in '+ra+'s wieder';
      }catch(e0){}
      throw new Error('Dienst antwortete HTTP '+r.status+(r.statusText?' '+r.statusText:'')+wartehinweis);
    }
    var b=await r.blob();
    if(!b||b.size<200)throw new Error('Antwort enthielt kein Bild ('+(b?b.size:0)+' Bytes).');
    if(b.type&&b.type.indexOf('image')!==0)throw new Error('Antwort war kein Bild, sondern '+b.type+'.');
    return URL.createObjectURL(b);
  }catch(e){
    ersterGrund=(e&&e.message)?e.message:String(e);
    // Ein echter Dienstfehler bleibt einer — dann nicht noch einmal probieren.
    if(/HTTP \d|kein Bild|war kein Bild/.test(ersterGrund))throw e;
  }
  return await new Promise(function(res,rej){
    var fertig=false;
    var t=setTimeout(function(){ if(!fertig){fertig=true;rej(new Error('Zeitüberschreitung nach '+Math.round(limit/1000)+'s. Vorher: '+ersterGrund));} },limit);
    var im=new Image();
    im.onload=function(){ if(fertig)return;fertig=true;clearTimeout(t);res(url); };
    im.onerror=function(){ if(fertig)return;fertig=true;clearTimeout(t);
      rej(new Error('Bild nicht ladbar. Direktabruf meldete: '+(ersterGrund||'unbekannt')+'. Prüfe URL-Länge, Dienst und ob Perchance externe Bilder zulässt.')); };
    im.src=url;
  });
}

// ── KI-WRAPPER ────────────────────────────────
function extrahiereText(x){
  if(x==null)return'';
  if(typeof x==='string')return x;
  return x.fullText||x.text||x.output||'';
}
// Das Text-Plugin von Perchance spricht ueber ein eigenes Iframe. Wird es zu
// frueh gerufen — etwa direkt nach dem Laden aus einem Elternfenster —, meldet
// es "Cannot read properties of null (reading 'contentWindow')". Das ist kein
// Fehler der Anfrage, sondern schlicht zu frueh: kurz warten und erneut fragen.
function kiNochNichtBereit(e){
  var m=String((e&&e.message)||e||'');
  return /contentWindow|streamTextFromIframe|of null|not defined/i.test(m);
}
async function frageKI(prompt,timeoutMs){
  var letzter=null;
  for(var versuch=0;versuch<3;versuch++){
    try{
      return await frageKIEinmal(prompt,timeoutMs);
    }catch(e){
      letzter=e;
      if(!kiNochNichtBereit(e))throw e;
      await warte(1200*(versuch+1));
    }
  }
  throw new Error('Das Text-Plugin von Perchance war auch nach drei Anläufen nicht bereit ('+
    ((letzter&&letzter.message)||'unbekannt')+'). Seite neu laden hilft meist.');
}
function frageKIEinmal(prompt,timeoutMs){
  var limit=timeoutMs||90000;
  return new Promise(function(resolve,reject){
    var fertig=false;
    var timer=setTimeout(function(){
      if(!fertig){fertig=true;reject(new Error('KI-Timeout ('+Math.round(limit/1000)+'s)'));}
    },limit);
    function done(txt){
      if(fertig)return;fertig=true;clearTimeout(timer);
      resolve(String(txt||'').trim());
    }
    function versucheObjektForm(){
      try{
        ai({instruction:prompt,onFinish:function(data){done(extrahiereText(data));}});
      }catch(e2){
        if(!fertig){fertig=true;clearTimeout(timer);reject(e2);}
      }
    }
    try{
      var r=ai(prompt);
      if(r&&typeof r.then==='function'){
        r.then(function(res){done(extrahiereText(res));})
         .catch(function(){versucheObjektForm();});
      }else if(typeof r==='string'&&r.length){done(r);}
      else{versucheObjektForm();}
    }catch(e){versucheObjektForm();}
  });
}

// ── ANTWORT-PARSER ────────────────────────────
// Die KI wird um JSON gebeten. Kommt trotzdem "KEY: wert" zurueck (oder Markdown
// drumherum), faengt der Zeilen-Parser das ab, statt die Runde zu verlieren.
function jsonAus(text){
  var t=String(text||'');
  var a=t.indexOf('{'), b=t.lastIndexOf('}');
  if(a<0||b<=a)return null;
  try{ var o=JSON.parse(t.substring(a,b+1)); return (o&&typeof o==='object')?o:null; }catch(e){}
  return null;
}
function felderAus(text){
  var z={}, letzter=null;
  String(text||'').split('\n').forEach(function(zeile){
    var l=zeile.replace(/^\s*[-*>#\s]+/,'').replace(/\*\*/g,'').trim();
    if(!l)return;
    var i=l.indexOf(':');
    var kopf=i>0?l.substring(0,i).trim():'';
    // Nur als Feldname werten, was kurz ist und wie ein Schluessel aussieht —
    // sonst zerlegt ein Doppelpunkt mitten im Fliesstext den Wert.
    if(i>0&&kopf.length<=26&&/^[A-Za-zÄÖÜäöüß_ ]+$/.test(kopf)){
      letzter=kopf.toUpperCase().replace(/\s+/g,'_');
      z[letzter]=l.substring(i+1).trim();
    }else if(letzter){
      z[letzter]+=' '+l;   // Fortsetzungszeile an den letzten Wert haengen
    }
  });
  return z;
}
function hole(obj,pfad,ersatz){
  var cur=obj;
  for(var i=0;i<pfad.length;i++){
    if(cur==null||typeof cur!=='object')return ersatz;
    cur=cur[pfad[i]];
  }
  if(cur==null)return ersatz;
  if(Array.isArray(cur))cur=cur.join(', ');
  var s=String(cur).trim();
  return s?s:ersatz;
}
function entkleide(s){ return String(s||'').trim().replace(/^["'»«]+|["'»«]+$/g,'').trim(); }
function einWort(s){ return String(s||'').toLowerCase().trim().split(/[\s,.;:]/)[0]||''; }

var W = {

// ── FEHLERANZEIGE ─────────────────────────────
function zeigeFehler(wo,e){
  console.error(wo,e);
  var meldung=wo+': '+(e&&e.message?e.message:String(e));
  var box=el('fehlerbox');

function weltKontext(){
  var k='WELT: Das Geschehen spielt in '+W.stadt+'.\n'+
    'HELD: '+W.protagonist.name+', '+W.protagonist.beruf+' aus '+W.protagonist.herkunft+'. Eigenart: '+W.protagonist.eigenart+'.\n';

    k+='VORGESCHICHTE: '+rh+'\n';
  }
  if(S.fakten.length)k+='WAS BISHER FESTSTEHT:\n- '+S.fakten.join('\n- ')+'\n';

  return k;

function merkeFakt(f){
  f=entkleide(f);
  if(!f||f.length<4)return;
  if(/^(kein|keine|nichts|none|n\/a|-)$/i.test(f))return;
  var klein=f.toLowerCase();
  if(S.fakten.some(function(x){return x.toLowerCase()===klein;}))return;
  S.fakten.push(f);
  while(S.fakten.length>MAX_FAKTEN)S.fakten.shift();
}
function verlaufText(n){
  return S.verlauf.slice(-n).map(function(v){
    return (v.rolle==='npc'?(v.name||(W.npcs[v.idx]&&W.npcs[v.idx].name)||'NPC'):W.protagonist.name)+': '+v.text;
  }).join('\n');
}

// ── EIN ZUG: Regie + Schauspiel + Bildidee in EINEM Aufruf ──
async function naechsterZug(erzwinge,autoModus){
  var mehrere=W.npcs.length>1;
  var liste=W.npcs.map(function(n,i){
    return '- NPC'+(i+1)+' = '+n.name+' ('+n.rolle+'). Persoenlichkeit: '+n.person+'. Aktuelle Stimmung: '+S.stimmung[i]+'.';
  }).join('\n');
  var regieZeilen='';
  for(var i=0;i<W.npcs.length;i++){
    if(S.regieAnweisung[i]){
      regieZeilen+='VERDECKTE REGIE fuer '+W.npcs[i].name+' (NPC'+(i+1)+'): '+S.regieAnweisung[i]+'. Setze das in Rede/Handlung um, ohne es zu erwaehnen oder zu zitieren.\n';
      S.regieAnweisung[i]='';
    }
  }
  var szeneRegie=S.autoRegie?('STEHENDE REGIE (szenenweit, ALLE Figuren beachten sie dauerhaft): '+S.autoRegie+'. Baue das laufend in Rede/Handlung ein, ohne es zu zitieren.\n'):'';
  var zwang=(erzwinge>=0)?('WICHTIG: In DIESEM Zug MUSS NPC'+(erzwinge+1)+' ('+W.npcs[erzwinge].name+') sprechen.\n'):'';
  var letzterNpc=-1;
  for(var j=S.verlauf.length-1;j>=0;j--){ if(S.verlauf[j].rolle==='npc'){letzterNpc=S.verlauf[j].idx;break;} }
  var altern=(autoModus&&mehrere&&erzwinge<0&&letzterNpc>=0&&W.npcs[letzterNpc])
    ?('Zuletzt sprach '+W.npcs[letzterNpc].name+'. Lass nun bevorzugt eine ANDERE Figur zu Wort kommen, damit sich alle abwechseln.\n'):'';
  var werOpt=W.npcs.map(function(n,i){return 'NPC'+(i+1);}).join(' oder ');

  var instruction=
    'Du fuehrst Regie UND spielst die Figuren in einem deutschen Dialog-Adventure. Am Ort sind '+W.npcs.length+' Person(en) anwesend. Du entscheidest, wer als Naechstes spricht, und schreibst diese EINE Zeile voll in der Rolle dieser Figur.\n\n'+
    weltKontext()+
    'ORT: '+W.ort.name+' — '+W.ort.geschichte+'\n'+
    'ANWESENDE FIGUREN:\n'+liste+'\n\n'+
    (mehrere?'Die Figuren duerfen sich auch GEGENSEITIG ansprechen und die Handlung gemeinsam vorantreiben. Jede Figur handelt eigenstaendig, mit eigener Stimme.\n':'')+
    (autoModus?'AUTO-MODUS: Der Held schweigt gerade. Die Figuren treiben die Szene EIGENSTAENDIG voran, reden miteinander und handeln.\n':'')+
    (autoModus&&!mehrere?'Es ist nur EINE Figur anwesend: sie handelt allein weiter – denkt laut, beschaeftigt sich, kommentiert die Umgebung, geht ihrer Taetigkeit nach und treibt die Szene voran, auch ohne Gegenueber.\n':'')+
    'REGISTER: Der Ton ist warm, freundlich und offen. Alle Figuren begegnen einander UND dem Helden mit Respekt und Sympathie. Frivole, freche, anzuegliche und teils obszoene Sprueche sind erlaubt und erwuenscht, solange sie SPIELERISCH und gutmuetig bleiben. KEINE Beleidigungen, keine Herablassung, keine Feindseligkeit untereinander — necken ja, verletzen oder respektlos sein nein.\n'+
    '- Text des Helden in eckigen Klammern sind seine HANDLUNGEN. Figuren antworten mit EIGENEN Handlungen (in eckigen Klammern) und Rede.\n'+
    '- Reagiere KONKRET auf das zuletzt Gesagte. Wiederhole keine Formulierungen aus frueheren Zeilen.\n'+
    '- Widersprich nichts, was unter WAS BISHER FESTSTEHT aufgefuehrt ist.\n'+
    '- Stimmungen duerfen sich durch das Gespraech aendern, zum Guten wie zum Schlechten.\n\n'+
    szeneRegie+regieZeilen+altern+zwang+
    'BISHERIGES GESCHEHEN:\n'+verlaufText(12)+'\n\n'+
    'Antworte NUR mit einem gueltigen JSON-Objekt, ohne Codeblock, ohne Kommentare, ohne Text davor oder danach:\n'+
    '{\n'+
    '  "wer": "'+werOpt+(autoModus?'':' oder STOP')+'",\n'+
    '  "antwort": "die gesprochene Reaktion dieser Figur auf Deutsch, 1 bis 3 Saetze, Handlungen in eckigen Klammern",\n'+
    '  "stimmung": "Stimmung DIESER Figur nach dem Moment, EIN deutsches Wort",\n'+
    '  "weiter": false,\n'+
    '  "bild": "one English sentence describing this moment PURELY VISUALLY: what the character(s) are doing, posture, gesture, facial expression, gaze, plus setting, objects, lighting and camera framing (close-up / medium shot / wide shot). No names, no art style, no dialogue.",\n'+
    '  "handlung": "1 bis 2 deutsche Saetze, die die bisherige Handlung logisch fortschreiben",\n'+
    '  "fakt": "hoechstens ein kurzer neuer harter Fakt aus diesem Zug, der spaeter gelten soll, sonst leer"\n'+
    '}\n\n'+
    'FELD "wer": '+(autoModus?'Es MUSS eine Figur sprechen, niemals STOP.':'STOP bedeutet, dass niemand mehr spricht und der Held wieder dran ist.')+'\n'+
    'FELD "weiter": true, wenn unmittelbar noch eine ANDERE Figur reagieren sollte, sonst false.';

  var text=await frageKI(instruction);
  var j2=jsonAus(text), z=j2?null:felderAus(text);
  var wer      = j2?hole(j2,['wer'],''):(z['WER']||'');
  var antwort  = entkleide(j2?hole(j2,['antwort'],''):(z['ANTWORT']||''));
  var stimmung = einWort(j2?hole(j2,['stimmung'],''):(z['STIMMUNG']||''));
  var bild     = entkleide(j2?hole(j2,['bild'],''):(z['BILD']||z['SZENE']||''));
  var handlung = entkleide(j2?hole(j2,['handlung'],''):(z['HANDLUNG']||''));
  var fakt     = entkleide(j2?hole(j2,['fakt'],''):(z['FAKT']||''));
  var weiterRoh= j2?j2.weiter:(z['WEITER']||'');
  var weiter   = (weiterRoh===true)||/^(ja|yes|true)/i.test(String(weiterRoh||''));

  if(!antwort||(!autoModus&&/STOP/i.test(wer)))return {stop:true};
  var idx=0;
  var m=String(wer).match(/(\d+)/);
  if(m)idx=parseInt(m[1],10)-1;
  if(erzwinge>=0)idx=erzwinge;
  if(idx<0||idx>=W.npcs.length)idx=0;

  if(handlung)S.handlung=handlung;
  if(fakt)merkeFakt(fakt);
  if(bild)S.szeneText=bild;

  return {stop:false,idx:idx,text:antwort,stimmung:stimmung,weiter:(weiter&&W.npcs.length>1)};
}

// ── SCHLAGABTAUSCH ────────────────────────────
async function fuehreSchlagabtausch(erzwungenerIdx){
  if(S.wartet&&erzwungenerIdx<0)return;
  setWartet(true);
  var cap=W.npcs.length>1?Math.min(MAX_ZUEGE,W.npcs.length):1;
  var erzwinge=(typeof erzwungenerIdx==='number')?erzwungenerIdx:-1;
  var zuege=0;
  while(zuege<cap){
    var res=null;
    try{ res=await naechsterZug(erzwinge); }
    catch(e){ zeigeFehler('NPC-Zug',e); break; }
    erzwinge=-1;
    if(!res||res.stop)break;
    npcSagt(res.idx,res.text);
    S.verlauf.push({rolle:'npc',idx:res.idx,text:res.text,name:W.npcs[res.idx].name});
    if(res.stimmung){ S.stimmung[res.idx]=res.stimmung; zeigeStimmung(); }
    zuege++;
    if(!res.weiter)break;
  }
  bildTakt();
  autosave();
  setWartet(false);
}
function bildTakt(){
  if(!CFG.bildTakt)return;
  S.bildZaehler=(S.bildZaehler||0)+1;
  if(S.bildZaehler<CFG.bildTakt)return;
  S.bildZaehler=0;
  if(S.bildPauseBis&&Date.now()<S.bildPauseBis)return;   // Dienst drosselt gerade
  if(S.eigenerPrompt){
    // Festgehalten: das Bild soll bewusst stehenbleiben, also gar nicht erst
    // dieselbe Anfrage noch einmal stellen.
    if(S.promptFesthalten)return;
    // Sonst hat die Handlung Vorrang: ab hier folgt das Bild wieder der Szene.
    S.eigenerPrompt='';S.eigenerNegativ='';
  }
  zeichneBild({});
}

// ── AUTO-MODUS ────────────────────────────────
function warte(ms){ return new Promise(function(r){setTimeout(r,ms);}); }
function autoUmschalten(){
  if(!S.imSpiel)return;
  S.autoAktiv=!S.autoAktiv;
  aktualisiereUI();
  if(S.autoAktiv){
    sysZeile('▶ Auto-Modus an — die Figuren übernehmen. Deine Eingaben sind jetzt Regie (mit /sag: sprichst du selbst).');
    autoSchleife();
  }else{
    sysZeile('⏹ Auto-Modus aus.');
  }
}
async function autoSchleife(){
  if(S.autoLaeuft)return;
  S.autoLaeuft=true;
  var fehler=0;
  while(S.autoAktiv){
    var erzwinge=(S.autoForceIdx!=null)?S.autoForceIdx:-1;
    S.autoForceIdx=null;
    var res=null;
    try{
      res=await naechsterZug(erzwinge,true);
      fehler=0;
    }catch(e){
      // Nicht sofort aufgeben: kurze Pause, dann erneut. Erst nach drei
      // Fehlschlaegen abschalten – und dann auch sichtbar, nicht stumm.
      fehler++;
      zeigeFehler('Auto-Zug',e);
      if(fehler>=3){
        S.autoAktiv=false;
        sysZeile('⏹ Auto-Modus nach mehreren Fehlern beendet.');
        break;
      }
      await warte(2000*fehler);
      continue;
    }
    if(!S.autoAktiv)break;
    if(res&&!res.stop){
      npcSagt(res.idx,res.text);
      S.verlauf.push({rolle:'npc',idx:res.idx,text:res.text,name:W.npcs[res.idx].name});
      if(res.stimmung){ S.stimmung[res.idx]=res.stimmung; zeigeStimmung(); }
      bildTakt();
      autosave();
      await warte(Math.min(6000,900+String(res.text).length*Math.max(8,CFG.tempo)));
    }else{
      await warte(1500);
    }
  }
  S.autoLaeuft=false;
  aktualisiereUI();
}
function setzeAutoRegie(txt){
  S.autoRegie=txt;
  sysZeile('🎬 Stehende Regie: '+txt);
  autosave();
}

// ── BILD-PIPELINE ─────────────────────────────
// Der Prompt wird aus Bausteinen gebaut, damit beim Kuerzen nicht ausgerechnet
// das Ende verlorengeht: dort stehen Stil und Bildaufbau, und die bestimmen,
// wie das Bild ueberhaupt aussieht. Gekuerzt wird in der Mitte.
function bauePrompt(opts,max){
  var figurenArr=[];
  var P=W.protagonist;
  if(P&&(P.aussehen||'').trim()){
    var pa=P.aussehen.trim().replace(/[.\s]+$/,'');
    var pk=(P.kleidung||'').trim().replace(/[.\s]+$/,'');
    figurenArr.push(pa+(pk?', wearing '+pk:''));
  }
  W.npcs.forEach(function(n,i){
    var a=(n.aussehen||'a person').trim().replace(/[.\s]+$/,'');
    var k=(S.kleidung[i]||n.kleidung||'').trim().replace(/[.\s]+$/,'');
    figurenArr.push(a+(k?', wearing '+k:''));
  });
  var figuren=figurenArr.join(' AND ');
  var figCount=figurenArr.length;
  var szene=(opts.szene||S.szeneText||(W.ort&&W.ort.bildPrompt)||'').trim();
  var setting=(S.szeneGlobal||'').trim().replace(/[.\s]+$/,'');
  var stimmungen=W.npcs.map(function(n,i){return S.stimmung[i];}).filter(Boolean).join(' and ');
  var anzahl=figCount>1?(figCount+' distinct characters together in the scene, interacting'):'single character in the foreground';

  var schwanz=', '+aktuellerStil()+', '+anzahl+', comic panel composition, dramatic lighting, detailed background';
  var mitte=(setting?'. Setting: '+setting:'')+(szene?'. Scene: '+szene:'')+(stimmungen?', mood: '+stimmungen:'');
  var ganz=figuren+mitte+schwanz;
  if(!max||ganz.length<=max)return ganz;

  // Zu lang: Stil und Bildaufbau bleiben unangetastet, der Rest teilt sich den Platz.
  var frei=Math.max(80,max-schwanz.length);
  var figurAnteil=Math.floor(frei*0.55);
  if(figuren.length>figurAnteil)figuren=kuerzeText(figuren,figurAnteil);
  mitte=kuerzeText(mitte,Math.max(0,frei-figuren.length));
  return figuren+mitte+schwanz;
}
function baueNegativ(){
  var extra=STIL_NEGATIV[aktuellerStilSchluessel()];
  return CFG.negativ+(extra?', '+extra:'');
}
async function zeichneBild(opts){
  opts=opts||{};
  // Laeuft schon eines? Dann NICHT verwerfen, sondern vormerken —
  // sonst bleibt das Bild bei langsamen Diensten minutenlang stehen.
  if(S.bildLaeuft){ S.bildAusstehend=opts; return; }
  S.bildLaeuft=true;
  el('szenelade').classList.add('an');
  try{
    // Rangfolge: einmaliger Override → eigener Prompt (überdauert Quellenwechsel)
    // → automatisch aus der Szene gebaut.
    var max=quelle().maxPrompt;
    var prompt = (opts.promptOverride!=null) ? String(opts.promptOverride).trim()
               : (S.eigenerPrompt ? S.eigenerPrompt : bauePrompt(opts,max));
    if(max&&prompt.length>max)prompt=kuerzeText(prompt,max);   // greift nur bei eigenen Prompts
    var negativ= (opts.negativOverride!=null)?String(opts.negativOverride).trim():(S.eigenerNegativ||baueNegativ());
    var seed   = (opts.seedOverride!=null&&String(opts.seedOverride).trim()!=='')
                 ?(parseInt(opts.seedOverride,10)||S.seed)
                 :(S.seed||(S.seed=neuerSeed()));
    S.seed=seed;
    var src=await quelle().zeichne({prompt:prompt,negativ:negativ,seed:seed,breite:auf64(CFG.breite),hoehe:auf64(CFG.hoehe)});
    if(S.letzteBildUrl&&S.letzteBildUrl.indexOf('blob:')===0&&S.letzteBildUrl!==src){
      try{ URL.revokeObjectURL(S.letzteBildUrl); }catch(e1){}
    }
    el('img0').src=src;
    S.letzteBildUrl=src;
    S.bildGeneriert=true;
    S.letzterPrompt=prompt;
    S.letzterNegativ=negativ;
  }catch(e){
    var m=String((e&&e.message)||e);
    if(/HTTP 429/.test(m)){
      // Drosselung: eine Weile gar nicht mehr anfragen, statt weiter anzuklopfen.
      var sek=60, ra=m.match(/in (\d+)s/);
      if(ra)sek=Math.max(15,Math.min(600,parseInt(ra[1],10)||60));
      S.bildPauseBis=Date.now()+sek*1000;
      errZeile('⚠ '+quelle().label+' drosselt (HTTP 429). Keine Bildanfragen für '+sek+'s. '+
               'Dauerhaft hilft: Bild-Takt in ⚙ erhöhen, anderes Modell, oder zurück auf Perchance.');
    }else{
      zeigeFehler('Bild ('+quelle().label+')',e);
    }
  }
  el('szenelade').classList.remove('an');
  S.bildLaeuft=false;
  if(S.bildAusstehend){ var n=S.bildAusstehend; S.bildAusstehend=null; zeichneBild(n); }
}

// ── BEFEHLE ───────────────────────────────────
var BEFEHLE=[
  {muster:/^\/hilfe\b/i,                        hilfe:['/hilfe','zeigt diese Liste'],
   fn:function(){ zeigeHilfe(); }},
  {muster:/^\/sag\s*:?\s*([\s\S]*)$/i,          hilfe:['/sag: …','sprich selbst — auch wenn der Auto-Modus läuft'],
   fn:function(m){ var t=entkleide(m[1]); if(!t){sysZeile('/sag: gib an, was du sagen willst.');return;} if(S.wartet){sysZeile('— Bitte kurz warten —');return;} spielerSagt(t); }},
  {muster:/^\/npc\s*(\d+)\s*:?\s*([\s\S]*)$/i,  hilfe:['/npcN: …','verdeckte Regie an Figur N (neue Nummer = neue Figur tritt auf)'],
   fn:function(m){ regieBefehl(parseInt(m[1],10)-1,m[2]); }},
  {muster:/^\/kleidung\s*(\d+)\s*:?\s*([\s\S]*)$/i, hilfe:['/kleidungN: …','dauerhaftes Outfit für Figur N (englisch)'],
   fn:function(m){ kleidungBefehl(parseInt(m[1],10)-1,m[2]); }},
  {muster:/^\/regie\s*:?\s*([\s\S]*)$/i,        hilfe:['/regie: …','stehende Regie für die ganze Szene (leer = löschen)'],
   fn:function(m){ var t=entkleide(m[1]); if(!t){S.autoRegie='';sysZeile('🎬 Stehende Regie gelöscht.');autosave();return;} setzeAutoRegie(t); }},
  {muster:/^\/bild\s*:?\s*([\s\S]*)$/i,         hilfe:['/bild: …','neues Bild aus deiner Beschreibung (englisch wirkt am besten)'],
   fn:function(m){ bildBefehl(m[1]); }},
  {muster:/^\/stil\s*:?\s*([\s\S]*)$/i,         hilfe:['/stil: …','Bildstil ändern (manga, comic, aquarell, oel, realistisch, pixel oder eigener Text)'],
   fn:function(m){ stilBefehl(m[1]); }},
  {muster:/^\/quelle\b\s*:?\s*([\s\S]*)$/i,     hilfe:['/quelle','Bildquelle wechseln (öffnet die Einstellungen)'],
   fn:function(m){ quelleBefehl(m[1]); }},
  {muster:/^\/undo\b/i,                         hilfe:['/undo','letzten Zug zurücknehmen'],
   fn:function(){ undo(); }},
  {muster:/^\/nochmal\b/i,                      hilfe:['/nochmal','letzten Zug verwerfen und die Antwort neu würfeln'],
   fn:function(){ nochmal(); }},
  {muster:/^\/speichern\b/i,                    hilfe:['/speichern','Spielstände öffnen'],
   fn:function(){ oeffneSpeicher(); }}
];
function befehlVerarbeitet(txt){
  for(var i=0;i<BEFEHLE.length;i++){
    var m=txt.match(BEFEHLE[i].muster);
    if(m){ BEFEHLE[i].fn(m); return true; }
  }
  return false;
}
function zeigeHilfe(){
  var g=el('gespraech');
  var z=document.createElement('div');
  z.className='zeile hilfe';
  var html='<div class="txt"><b>BEFEHLE</b><br>';
  BEFEHLE.forEach(function(b){ html+='<b>'+escapeHtml(b.hilfe[0])+'</b> — '+escapeHtml(b.hilfe[1])+'<br>'; });
  html+='<br>Alles ohne Schrägstrich sprichst du selbst. Text in \x5Beckigen Klammern\x5D ist eine Handlung.</div>';
  z.innerHTML=html;
  g.appendChild(z);scrolle();
}
function sendeFreitext(){
  var feld=el('freitext');
  var txt=feld.value.trim();
  if(!txt)return;
  if(befehlVerarbeitet(txt)){ feld.value=''; return; }
  if(S.autoAktiv){ feld.value=''; setzeAutoRegie(txt); return; }
  if(S.wartet)return;
  feld.value='';
  spielerSagt(txt);
}
function spielerSagt(txt){
  merkeSchnappschuss();
  ichSage(txt);
  S.verlauf.push({rolle:'ich',text:txt});
  fuehreSchlagabtausch(-1);
}
function regieBefehl(idx,hintRaw){
  if(!S.imSpiel)return;
  var hint=entkleide(hintRaw);
  if(idx===W.npcs.length&&idx<MAX_NPCS){ erscheineNPC(hint); return; }   // naechste freie Nummer = neue Figur
  if(idx<0||idx>=W.npcs.length){ sysZeile('Diese Figur gibt es nicht (1 bis '+W.npcs.length+').'); return; }
  if(!hint){ sysZeile('/npc'+(idx+1)+': gib nach dem Doppelpunkt eine Regieanweisung an.'); return; }
  if(S.autoAktiv){
    S.regieAnweisung[idx]=hint;
    S.autoForceIdx=idx;
    sysZeile('🎬 Regie an '+W.npcs[idx].name+': '+hint);
    autosave();
    return;
  }
  if(S.wartet){ sysZeile('— Bitte kurz warten —'); return; }
  merkeSchnappschuss();
  S.regieAnweisung[idx]=hint;
  sysZeile('🎬 Regie an '+W.npcs[idx].name+': '+hint);
  fuehreSchlagabtausch(idx);
}
function kleidungBefehl(idx,outfitRaw){
  if(!S.imSpiel)return;
  if(idx<0||idx>=W.npcs.length){ sysZeile('Diese Figur gibt es nicht.'); return; }
  var outfit=entkleide(outfitRaw);
  if(!outfit){ sysZeile('/kleidung'+(idx+1)+': gib nach dem Doppelpunkt ein Outfit an.'); return; }
  S.kleidung[idx]=outfit;
  sysZeile('✦ Neues Outfit für '+W.npcs[idx].name+': '+outfit+' ✦');
  if(S.eigenerPrompt)sysZeile('Hinweis: Ein eigener Prompt ist aktiv, das Outfit wirkt erst nach „AUS SZENE" im Bildmenü.');
  autosave();
  zeichneBild({});
}
function bildBefehl(descRaw){
  if(!S.imSpiel)return;
  var beschreibung=entkleide(descRaw);
  if(!beschreibung){ sysZeile('/bild: gib nach dem Doppelpunkt eine Bildbeschreibung an.'); return; }
  S.szeneText=beschreibung;
  S.bildZaehler=0;
  S.eigenerPrompt='';S.eigenerNegativ='';S.promptFesthalten=false;   // ausdrueckliche Neubeschreibung schlaegt den eigenen Prompt
  sysZeile('✦ Neues Bild: '+beschreibung+' ✦');
  zeichneBild({szene:beschreibung});
}
function stilBefehl(raw){
  if(!S.imSpiel)return;
  var t=entkleide(raw);
  if(!t){
    var akt=S.stil?S.stilLabel:('Start-Auswahl ('+(el('stilwahl')?el('stilwahl').value:'?')+')');
    sysZeile('Aktueller Stil: '+akt+'. Presets: '+Object.keys(STILE).join(', ')+' — oder /stil: <eigener Text>.');
    return;
  }
  var key=t.toLowerCase();
  if(STILE[key]){ S.stil=STILE[key]; S.stilLabel=key; }
  else{ S.stil=t; S.stilLabel=t; }
  sysZeile('✦ Bildstil: '+S.stilLabel+' ✦');
  if(S.eigenerPrompt)sysZeile('Hinweis: Ein eigener Prompt ist aktiv, der Stil wirkt erst nach „AUS SZENE" im Bildmenü.');
  autosave();
  zeichneBild({});
}
function quelleBefehl(raw){
  var t=entkleide(raw).toLowerCase();
  if(t&&BILDQUELLEN[t]){
    CFG.quelle=t;speichereCfg();
    sysZeile('✦ Bildquelle: '+BILDQUELLEN[t].label+' ✦');
    zeichneBild({});
    return;
  }
  if(t)sysZeile('Unbekannte Quelle. Möglich: '+Object.keys(BILDQUELLEN).join(', '));
  oeffneEinstellungen();
}

// ── UNDO / NOCHMAL ────────────────────────────
function merkeSchnappschuss(){
  S.rueckgaengig.push(JSON.stringify({
    verlauf:S.verlauf, stimmung:S.stimmung, kleidung:S.kleidung,
    handlung:S.handlung, fakten:S.fakten, szeneText:S.szeneText
  }));
  while(S.rueckgaengig.length>MAX_UNDO)S.rueckgaengig.shift();
}
function stelleZurueck(){
  var roh=S.rueckgaengig.pop();
  if(!roh)return null;
  var d=JSON.parse(roh);
  S.verlauf=d.verlauf;S.stimmung=d.stimmung;S.kleidung=d.kleidung;
  S.handlung=d.handlung;S.fakten=d.fakten;S.szeneText=d.szeneText;
  return d;
}
function undo(){
  if(!S.imSpiel)return;
  if(S.wartet){ sysZeile('— Bitte kurz warten —'); return; }
  if(!S.rueckgaengig.length){ sysZeile('Nichts mehr zurückzunehmen.'); return; }
  stelleZurueck();
  zeichneVerlaufNeu();
  sysZeile('⟲ Zug zurückgenommen.');
  autosave();
}
function nochmal(){
  if(!S.imSpiel)return;
  if(S.wartet){ sysZeile('— Bitte kurz warten —'); return; }
  if(!S.rueckgaengig.length){ sysZeile('Es gibt keinen Zug zum Wiederholen.'); return; }
  var vorher=JSON.parse(S.rueckgaengig[S.rueckgaengig.length-1]);
  // Letzte Spielereingabe suchen, um sie erneut zu senden.
  var letzte=null;
  for(var i=S.verlauf.length-1;i>=vorher.verlauf.length;i--){
    if(S.verlauf[i].rolle==='ich'){ letzte=S.verlauf[i].text; break; }
  }
  stelleZurueck();
  zeichneVerlaufNeu();
  sysZeile('⟲ Noch einmal…');
  if(letzte)spielerSagt(letzte);
  else fuehreSchlagabtausch(-1);
}
function zeichneVerlaufNeu(){
  tippenFertig();
  var g=el('gespraech');g.innerHTML='';
  S.verlauf.forEach(function(v){
    if(v.rolle==='npc')npcZeileSofort(v.idx,v.text,v.name); else ichSage(v.text);
  });
  zeigeStimmung();
  aktualisiereUI();
}

// ── FIGUREN AUFTRETEN / ABTRETEN ──────────────
async function erscheineNPC(hint){
  if(!S.imSpiel)return;
  if(W.npcs.length>=MAX_NPCS){ sysZeile('Mehr als '+MAX_NPCS+' Personen werden hier nicht gleichzeitig gespielt.'); return; }
  if(S.wartet||S.npcErscheint){ sysZeile('— Bitte kurz warten —'); return; }
  hint=entkleide(hint);
  S.npcErscheint=true;
  setWartet(true);
  var anwesend=W.npcs.map(function(n){return n.name+' ('+n.rolle+')';}).join(', ');
  var instruction=
    'Erfinde spontan eine WEITERE Person, die JETZT am Ort dazustoesst, passend zur Situation.\n\n'+
    weltKontext()+
    'ORT: '+W.ort.name+' — '+W.ort.geschichte+'\n'+
    'BEREITS ANWESEND: '+anwesend+'.\n'+
    'BISHERIGES GESCHEHEN:\n'+verlaufText(10)+'\n'+
    (hint?'VORGABE fuer die neue Person: '+hint+'\n':'')+
    '\nAntworte NUR mit einem JSON-Objekt, ohne Codeblock:\n'+
    '{"name":"","rolle":"","aussehen":"constant English visual IDENTITY only, no clothing, no art style","kleidung":"english default outfit","person":"deutscher Satz, warm, frech, frivol, aber respektvoll","stimmung":"EIN deutsches Wort","eroeffnung":"erster deutscher Satz beim Hereinkommen, Handlungen in eckigen Klammern erlaubt"}';
  try{
    var text=await frageKI(instruction);
    var j=jsonAus(text), z=j?null:felderAus(text);
    var f=function(k,flach,ersatz){ return j?hole(j,[k],ersatz):(z[flach]||ersatz); };
    var npc={
      name:         f('name','NAME','Ein Fremder'),
      rolle:        f('rolle','ROLLE','Bewohner'),
      aussehen:     f('aussehen','AUSSEHEN','an adult with a memorable face'),
      kleidung:     f('kleidung','KLEIDUNG','simple clothing'),
      person:       f('person','PERSON','zurueckhaltend'),
      grundstimmung:einWort(f('stimmung','STIMMUNG','neugierig')),
      eroeffnung:   f('eroeffnung','EROEFFNUNG','\x5Btritt ein\x5D Störe ich?')
    };
    var idx=W.npcs.length;
    W.npcs.push(npc);
    S.stimmung.push(npc.grundstimmung);
    S.kleidung.push(npc.kleidung);
    S.regieAnweisung.push('');
    sysZeile('— '+npc.name+' erscheint —');
    npcSagt(idx,npc.eroeffnung);
    S.verlauf.push({rolle:'npc',idx:idx,text:npc.eroeffnung,name:npc.name});
    merkeFakt(npc.name+' ist am Ort dazugekommen ('+npc.rolle+').');
    aktualisiereUI();
    S.npcErscheint=false;
    S.bildZaehler=0;
    setWartet(false);
    if(hint){ S.regieAnweisung[idx]=hint; await fuehreSchlagabtausch(idx); }
    zeichneBild({});
  }catch(e){
    S.npcErscheint=false;setWartet(false);
    zeigeFehler('Figur erscheinen',e);
  }
}
function entferneNPC(idx){
  if(!S.imSpiel)return;
  if(W.npcs.length<2){ sysZeile('Mindestens eine Person muss bleiben.'); return; }
  if(idx<0||idx>=W.npcs.length)return;
  var name=W.npcs[idx].name;
  // Verlauf: Namen einfrieren, Indizes nachziehen.
  S.verlauf.forEach(function(v){
    if(v.rolle==='npc'){
      if(v.name==null)v.name=(W.npcs[v.idx]&&W.npcs[v.idx].name)||'NPC';
      if(v.idx===idx)v.idx=-1;
      else if(v.idx>idx)v.idx=v.idx-1;
    }
  });
  W.npcs.splice(idx,1);
  S.stimmung.splice(idx,1);
  S.kleidung.splice(idx,1);
  S.regieAnweisung.splice(idx,1);
  S.autoForceIdx=null;
  merkeFakt(name+' hat den Ort verlassen.');
  sysZeile('— '+name+' geht —');
  aktualisiereUI();
  autosave();
  zeichneBild({});
}

// ── DIALOG-AUSGABE ────────────────────────────
function neueZeile(klasse,werText){
  var g=el('gespraech');
  var z=document.createElement('div');
  z.className='zeile '+klasse;
  z.innerHTML=(werText?'<div class="wer">'+escapeHtml(String(werText).toUpperCase())+'</div>':'')+'<div class="txt"></div>';
  g.appendChild(z);
  return z;
}
function npcName(idx,name){ return name||(W.npcs[idx]&&W.npcs[idx].name)||'NPC'; }
function npcSagt(idx,text,name){
  var z=neueZeile('npc',npcName(idx,name));
  tippe(z.querySelector('.txt'),text);
  scrolle();
}
function npcZeileSofort(idx,text,name){
  var z=neueZeile('npc',npcName(idx,name));
  z.querySelector('.txt').innerHTML=formatAktionen(text);
}
function ichSage(text){
  var z=neueZeile('ich',W.protagonist.name);
  z.querySelector('.txt').innerHTML=formatAktionen(text);
  scrolle();
}
function sysZeile(text){
  var z=neueZeile('sys','');
  z.querySelector('.txt').innerHTML=escapeHtml(text);
  scrolle();
}
function errZeile(text){
  var z=neueZeile('err','');
  z.querySelector('.txt').innerHTML=escapeHtml(text);
  scrolle();
}
// Schreibmaschine: immer nur EINE laufende Animation, und die vorherige Zeile
// wird sauber fertiggestellt statt halb getippt stehenzubleiben.
function tippe(elem,text){
  tippenFertig();
  if(!CFG.tempo){ elem.innerHTML=formatAktionen(text); scrolle(); return; }
  var i=0;
  tipper={el:elem,text:text,timer:null};
  tipper.timer=setInterval(function(){
    if(i<text.length){ elem.textContent+=text[i++]; scrolle(); }
    else{ tippenFertig(); }
  },CFG.tempo);
}
function tippenFertig(){
  if(!tipper)return;
  clearInterval(tipper.timer);
  tipper.el.innerHTML=formatAktionen(tipper.text);
  tipper=null;
  scrolle();
}
function scrolle(){ var g=el('gespraech'); if(g)g.scrollTop=g.scrollHeight; }
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function formatAktionen(s){ return escapeHtml(s).replace(/\[([^\]]*)\]/g,'<span class="aktion">[$1]</span>'); }
function setWartet(b){
  S.wartet=b;
  el('sendBtn').disabled=b;
  el('freitext').disabled=b;
  el('gespraech').setAttribute('aria-busy',b?'true':'false');
  var g=el('gespraech'), alt=el('tippt');
  if(b){
    if(!alt){ var d=document.createElement('div'); d.id='tippt'; d.textContent='…'; g.appendChild(d); scrolle(); }
  }else if(alt){ alt.remove(); }
}

// ── UI-AKTUALISIERUNG ─────────────────────────
function aktualisiereUI(){
  zeigeStimmung();
  zeichneKopfSchalter();
  var npcbtn=el('npcbtn');
  if(npcbtn)npcbtn.style.display=(S.imSpiel&&W.npcs.length<MAX_NPCS)?'block':'none';
  var undobtn=el('undobtn');

// Scheitert etwas ausserhalb unserer Aufrufkette — etwa im Text-Plugin selbst —,
// landet die Meldung sonst nur in Perchances Fehlerkasten. Lieber im Spiel zeigen.
if(typeof window!=='undefined'&&window.addEventListener){
  window.addEventListener('unhandledrejection',function(ev){
    var g=(ev&&ev.reason)||{};
    var text=String(g.message||g);
    if(kiNochNichtBereit(g)){
      errZeile('⚠ Das Text-Plugin war kurz nicht bereit. Wenn nichts weitergeht: Seite neu laden.');
    }else{
      errZeile('⚠ '+text);
    }
    if(ev.preventDefault)ev.preventDefault();
  });
}

function zeigeChronik(ziel){
  if(!S.imSpiel)return;
  baueChronikNav();
  var kopf=el('chronikTitel'), inhalt=el('chronikInhalt');
  inhalt.style.whiteSpace=(ziel==='handlung')?'pre-wrap':'normal';
  if(ziel==='ort'){
    kopf.textContent='📖 '+((W.ort&&W.ort.name)||'Ort').toUpperCase();
    inhalt.textContent=(W.ort&&W.ort.geschichte)||'Keine Aufzeichnungen.';
  }else if(ziel==='handlung'){

// ── SPEICHERSTÄNDE ────────────────────────────
var SAVE_VERSION=7;
var SLOTS=['proxima_v7_auto','proxima_v7_1','proxima_v7_2','proxima_v7_3'];
var SLOT_NAMEN=['Automatisch','Platz 1','Platz 2','Platz 3'];

// Die Undo-Schnappschuesse enthalten jeweils den ganzen Verlauf — die kommen
// NICHT mit in den Speicherstand, sonst waechst er quadratisch.
function standObjekt(){
  var kopie={};
  Object.keys(S).forEach(function(k){ if(k!=='rueckgaengig')kopie[k]=S[k]; });
  kopie.rueckgaengig=[];
  if(kopie.verlauf&&kopie.verlauf.length>600)kopie.verlauf=kopie.verlauf.slice(-600);
  return {version:SAVE_VERSION,zeit:Date.now(),welt:W,stand:kopie};
}
function schreibeSlot(i){
  try{ localStorage.setItem(SLOTS[i],JSON.stringify(standObjekt())); return true; }
  catch(e){ zeigeFehler('Speichern',e); return false; }
}
function autosave(){ schreibeSlot(0); }
function leseSlot(i){
  try{
    var roh=localStorage.getItem(SLOTS[i]);
    if(!roh)return null;
    var d=JSON.parse(roh);
    return pruefeStand(d)?d:null;
  }catch(e){ return null; }
}
function pruefeStand(d){
  return !!(d&&d.welt&&d.stand&&d.welt.ort&&Array.isArray(d.welt.npcs)&&d.welt.npcs.length);
}
function irgendeinStand(){
  for(var i=0;i<SLOTS.length;i++){ if(leseSlot(i))return true; }
  return false;
}
// Alte Formate (V6 und aelter) mitnehmen, statt sie stumm zu verlieren.
function migriere(d){
  var w=d.welt, s=d.stand;
  if(!Array.isArray(s.verlauf))s.verlauf=[];
  if(!Array.isArray(s.stimmung))s.stimmung=w.npcs.map(function(n){return n.grundstimmung;});
  if(!Array.isArray(s.kleidung))s.kleidung=w.npcs.map(function(n){return n.kleidung;});
  if(!Array.isArray(s.regieAnweisung))s.regieAnweisung=[];
  while(s.regieAnweisung.length<w.npcs.length)s.regieAnweisung.push('');
  if(!Array.isArray(s.fakten))s.fakten=[];
  if(!Array.isArray(s.rueckgaengig))s.rueckgaengig=[];
  if(typeof s.handlung!=='string')s.handlung='';
  if(typeof s.autoRegie!=='string')s.autoRegie='';
  if(typeof s.stil!=='string')s.stil='';
  if(typeof s.stilLabel!=='string')s.stilLabel='';
  if(typeof s.szeneGlobal!=='string')s.szeneGlobal='';
  if(typeof s.szeneText!=='string')s.szeneText='';
  if(typeof s.letzterNegativ!=='string')s.letzterNegativ='';
  if(typeof s.eigenerPrompt!=='string')s.eigenerPrompt='';
  if(typeof s.eigenerNegativ!=='string')s.eigenerNegativ='';
  s.promptFesthalten=!!s.promptFesthalten;
  if(!s.seed)s.seed=(w.ort&&parseInt(w.ort.seed,10))||neuerSeed();   // V6 hielt den Seed am Ort
  if(w.protagonist){
    if(typeof w.protagonist.aussehen!=='string')w.protagonist.aussehen='';
    if(typeof w.protagonist.kleidung!=='string')w.protagonist.kleidung='';
  }
  // Transiente Zustaende zuruecksetzen; das Bild entsteht beim Betreten neu.
  s.wartet=false;s.bildLaeuft=false;s.bildAusstehend=null;s.npcErscheint=false;
  s.bildGeneriert=false;s.bildZaehler=0;s.imSpiel=true;
  s.autoAktiv=false;s.autoLaeuft=false;s.autoForceIdx=null;
  s.letzteBildUrl='';s.bildPauseBis=0;
  return d;
}
function oeffneSpeicher(){
  var html='';
  SLOTS.forEach(function(k,i){
    var d=leseSlot(i);
    var info=d
      ? escapeHtml((d.welt.protagonist&&d.welt.protagonist.name)||'?')+' · '+escapeHtml((d.welt.ort&&d.welt.ort.name)||'?')+
        '<small>'+new Date(d.zeit||0).toLocaleString()+' · '+(d.stand.verlauf?d.stand.verlauf.length:0)+' Zeilen</small>'
      : '<span style="color:var(--dim)">leer</span>';
    html+='<div class="slot"><div class="slotinfo"><b>'+SLOT_NAMEN[i]+'</b><br>'+info+'</div>'+
      (i>0?'<button onclick="slotSpeichern('+i+')"'+(S.imSpiel?'':' disabled')+'>SICHERN</button>':'')+
      '<button onclick="slotLaden('+i+')"'+(d?'':' disabled')+'>LADEN</button>'+
      '<button onclick="slotLoeschen('+i+')"'+(d?'':' disabled')+'>✕</button></div>';
  });
  html+='<label class="feldlabel" for="exportFeld">EXPORT / IMPORT (Textblock sichern oder einfügen)</label>'+
        '<textarea id="exportFeld" class="feld" rows="4" placeholder="Hier erscheint der Export – oder füge einen fremden Spielstand ein und drücke IMPORT."></textarea>';
  el('speicherInhalt').innerHTML=html;
  oeffneModal('mSpeicher');
}
function slotSpeichern(i){
  if(!S.imSpiel)return;
  if(schreibeSlot(i))oeffneSpeicher();
}
function slotLoeschen(i){
  try{ localStorage.removeItem(SLOTS[i]); }catch(e){}
  oeffneSpeicher();
  pruefeLadeButton();
}
function slotLaden(i){
  var d=leseSlot(i);
  if(!d){ zeigeFehler('Laden',new Error('Dieser Platz ist leer oder beschädigt.')); return; }
  uebernehmeStand(d);
}
function uebernehmeStand(d){
  migriere(d);
  W=d.welt;S=d.stand;
  tipper=null;
  schliesseModal();
  if(el('start').style.display!=='none'&&!el('start').classList.contains('aus')){
    betreteSpiel();
  }else{
    S.imSpiel=true;
    starteOrt();
  }
}
function exportAnzeigen(){
  if(!S.imSpiel){
    var d=leseSlot(0);
    if(!d){ sysZeile('Kein Spielstand zum Exportieren.'); return; }
    el('exportFeld').value=JSON.stringify(d);
    return;
  }
  el('exportFeld').value=JSON.stringify(standObjekt());
  el('exportFeld').select();
}
function importStand(){
  var t=el('exportFeld').value.trim();
  if(!t){ zeigeFehler('Import',new Error('Kein Text zum Einlesen.')); return; }
  var d;
  try{ d=JSON.parse(t); }catch(e){ zeigeFehler('Import',new Error('Das ist kein gültiger Spielstand.')); return; }
  if(!pruefeStand(d)){ zeigeFehler('Import',new Error('Spielstand unvollständig.')); return; }

}

  try{
